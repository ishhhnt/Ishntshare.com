<style>
:root{--t:#f5f2ee;--m:rgba(245,242,238,.62);--gl:rgba(26,24,30,.58);--l:rgba(255,255,255,.09);--bd:rgba(255,255,255,.16);--ac:#ffb54a;--rd:#ff4d5e;--gn:#3ddc84}
/* Add your background image here: body{background-image:url('bg.jpg')} */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#141316 center/cover fixed;color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
.g{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.hide{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;margin:max(10px,env(safe-area-inset-top)) 12px 0;padding:8px 10px 8px 16px;border-radius:999px}
.logo{font-weight:800;letter-spacing:.5px;white-space:nowrap}
#q{flex:1;min-width:0;height:44px;border-radius:999px;border:1px solid var(--bd);background:var(--l);padding:0 16px;outline:0}
#q:focus{border-color:var(--ac)}
.ib{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--l);cursor:pointer;display:grid;place-items:center;font-size:19px;flex:none}
.ib:active,.btn:active{transform:scale(.95)}
.dot{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--rd);border:2px solid #222}
main{flex:1;overflow:auto;padding:14px 12px 110px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}}
.grid.p3{grid-template-columns:repeat(3,1fr);gap:6px}
.card{border-radius:22px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card img.pic{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--l)}
.p3 .card{border-radius:14px}.p3 .card .meta{display:none}
.meta{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:44px}
.meta b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--ac);color:#201400;display:inline-grid;place-items:center;font-weight:700;font-size:13px}
.av.l{width:92px;height:92px;font-size:36px;border:3px solid var(--bd)}.av.m{width:44px;height:44px;font-size:17px}
.btn{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--bd);background:var(--l);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.btn.pri{background:var(--t);color:#17141a;border-color:var(--t)}
.btn.dng{color:var(--rd)}
.btn.wide{width:100%;justify-content:space-between;padding:0 6px 0 20px}
.btn.wide i{width:34px;height:34px;border-radius:50%;background:#17141a;color:var(--t);display:grid;place-items:center;font-style:normal}
.btn.spin{pointer-events:none;opacity:.6}.btn.spin::after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--m);padding:60px 20px}
.sp{width:28px;height:28px;margin:40px auto;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:r .8s linear infinite}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;border-radius:999px;z-index:20}
nav button{width:52px;height:48px;border-radius:999px;border:0;background:none;cursor:pointer;font-size:21px;opacity:.65}
nav button.on{background:var(--l);opacity:1;box-shadow:inset 0 0 0 1px var(--bd)}
nav button.plus{background:var(--ac);color:#201400;opacity:1;font-weight:800;font-size:26px;transform:translateY(-10px);box-shadow:0 8px 20px rgba(255,181,74,.35)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.sheet{width:min(520px,100%);max-height:92dvh;overflow:auto;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:18px}
.in{width:100%;min-height:46px;border-radius:16px;border:1px solid var(--bd);background:var(--l);padding:10px 14px;outline:0}
.in:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}
.tag{color:var(--ac);cursor:pointer;margin-right:6px}
.cm{padding:8px 12px;border-radius:14px;background:var(--l);font-size:14px}
.pv img.big{width:100%;max-height:56dvh;object-fit:contain;border-radius:18px;background:rgba(0,0,0,.3)}
#auth{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;background:#141316 center/cover}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:40;transform:translateX(105%);transition:transform .28s;display:flex;flex-direction:column;border-radius:28px 0 0 28px;padding-top:env(safe-area-inset-top)}
#panel.open{transform:none}
.ph{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--bd)}
.crow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;cursor:pointer;min-height:56px}
.crow:hover{background:var(--l)}
.crow .tx{flex:1;min-width:0}.crow .tx div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crow small{color:var(--m)}
.ud{width:11px;height:11px;border-radius:50%;background:var(--gn)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;padding:8px 12px;border-radius:18px;background:var(--l);align-self:flex-start;position:relative;word-break:break-word}
.b.me{align-self:flex-end;background:var(--ac);color:#201400}
.b img{max-width:100%;border-radius:12px;display:block;margin-bottom:4px}
.b small{display:block;opacity:.6;font-size:11px;margin-top:2px}
.b .mm{position:absolute;top:-10px;left:-14px;width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:#2a2630;color:var(--t);cursor:pointer;font-size:14px}
.cb{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd);padding-bottom:max(10px,env(safe-area-inset-bottom))}
#toast{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);transition:transform .3s;z-index:90;display:flex;gap:10px;align-items:center;padding:10px 16px 10px 10px;border-radius:999px;max-width:92vw;cursor:pointer}
#toast.show{transform:translate(-50%,0)}
#off{position:fixed;bottom:0;left:0;right:0;background:var(--rd);text-align:center;padding:4px;font-size:13px;z-index:99}
.lnk{background:none;border:0;color:var(--m);text-decoration:underline;cursor:pointer;min-height:44px;align-self:center}
#vb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 12px 0;padding:8px 14px;border-radius:22px;font-size:13px}
#vb span{flex:1;min-width:160px}#vb .btn{min-height:36px;padding:0 14px;font-size:13px}
.stats{display:flex;justify-content:space-around;text-align:center;padding:12px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.stats b{display:block;font-size:22px}.stats span{color:var(--m);font-size:13px}

:root{--sh:rgba(0,0,0,.55)}
[data-theme=light]{--t:#1c1a20;--m:rgba(28,26,32,.62);--gl:rgba(255,255,255,.7);--l:rgba(20,18,24,.06);--bd:rgba(20,18,24,.14);--ac:#e58a00;--rd:#d92b3d;--gn:#16a05a;--sh:rgba(40,30,20,.3)}
[data-theme=light] body,[data-theme=light] #auth{background:#ecebe7}
[data-theme=light] .dot{border-color:#fff}
[data-theme=light] .btn.pri{background:#1c1a20;color:#f5f2ee;border-color:#1c1a20}
[data-theme=light] .btn.wide i{background:#f5f2ee;color:#1c1a20}
[data-theme=light] .b .mm{background:#fff}
[data-theme=light] .ov{background:rgba(30,25,20,.35)}
body,.g,.btn,.in,.ib{transition:background-color .25s,border-color .25s,color .25s}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
.ib .ic{width:21px;height:21px}
nav button{display:grid;place-items:center}
nav button .ic{width:24px;height:24px}
nav button.on .ic{stroke:var(--ac)}
nav button.plus .ic{width:26px;height:26px;stroke:#201400;stroke-width:2.6}
.b .mm{display:grid;place-items:center}.mm .ic{width:16px;height:16px}
.btn.wide i .ic{width:18px;height:18px}
.grid .card{position:relative;border:0;border-radius:24px;background:var(--l);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 12px 28px -14px var(--sh),inset 0 0 0 1px var(--bd);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;animation:up .5s backwards}
.grid .card:nth-child(2n){animation-delay:.06s}
.grid .card img.pic{aspect-ratio:3/4;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.grid .card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(to top,rgba(10,8,14,.8),transparent);pointer-events:none}
.grid .card .meta{position:absolute;left:0;right:0;bottom:0;z-index:1;min-height:0;padding:12px;color:#fff}
.grid .card .meta b{color:#fff;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.grid .card .av{border:2px solid rgba(255,255,255,.75)}
.grid .card:hover{transform:translateY(-4px);box-shadow:0 20px 34px -14px var(--sh),inset 0 0 0 1px var(--bd)}
.grid .card:hover img.pic{transform:scale(1.06)}
.grid .card:active{transform:scale(.98)}
.grid.p3 .card{border-radius:14px}.p3 .card::after{display:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
[data-theme=blue]{--t:#fff;--m:rgba(255,255,255,.7);--gl:rgba(20,16,51,.42);--l:rgba(255,255,255,.1);--bd:rgba(255,255,255,.22);--ac:#2AFFCC;--rd:#ff6b81;--gn:#2AFFCC;--sh:rgba(6,10,50,.7)}
[data-theme=blue] body,[data-theme=blue] #auth{background-color:#141033;background-image:radial-gradient(120% 70% at 10% 110%,#d3e2ff 0,#5c86e6 22%,transparent 62%),radial-gradient(90% 60% at 100% 100%,#2f63ec 0,transparent 66%),linear-gradient(180deg,#0a0f33 0,#141033 38%,#10319f 100%);background-attachment:fixed;background-size:cover}
[data-theme=blue] body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
[data-theme=blue] .dot{border-color:#141033}
[data-theme=blue] .av,[data-theme=blue] .b.me,[data-theme=blue] nav button.plus{color:#141033}
[data-theme=blue] nav button.plus .ic{stroke:#141033}
[data-theme=blue] nav button.plus{box-shadow:0 8px 22px rgba(42,255,204,.4)}
[data-theme=blue] .b .mm{background:rgba(20,16,51,.9)}
#thm{position:fixed;z-index:120;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:20px;min-width:172px;animation:up .2s}
#thm button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:14px;background:none;cursor:pointer;text-align:left;font-weight:600}
#thm button:hover,#thm button.on{background:var(--l)}
#thm i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--bd);flex:none}
#thm button.on::after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.grid .card::after{display:none}
.grid .card .meta{left:8px;right:auto;bottom:8px;max-width:calc(100% - 16px);padding:4px 12px 4px 4px;gap:8px;border-radius:999px;background:rgba(14,12,30,.38);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5)}
.grid .card .av{width:26px;height:26px;font-size:12px;border:0}
.ov.pv{align-items:flex-end;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:rgba(8,8,24,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media(min-width:700px){.ov.pv{align-items:center}}
.pv .sheet{border-radius:34px;padding:10px 18px 18px;gap:12px;background:var(--gl);backdrop-filter:blur(36px) saturate(1.8);-webkit-backdrop-filter:blur(36px) saturate(1.8);box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:sheet .38s cubic-bezier(.2,.9,.25,1)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--bd);align-self:center}
.pv .row b{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv .row small{display:block;color:var(--m);font-size:12px}
.pvi{border-radius:24px;overflow:hidden;background:var(--l);cursor:zoom-in}
.pv .pvi img.big{display:block;width:100%;max-height:46dvh;object-fit:cover;border-radius:0;background:none}
.pv #cap{font-size:15px;line-height:1.45}
.pv #cap:empty,.pv #tg:empty{display:none}
.pv .tag{display:inline-block;background:var(--l);padding:3px 10px;border-radius:99px;font-size:13px;margin:0 6px 6px 0}
.pva{gap:8px}.pva .pri{flex:1}.btn.sq{width:44px;padding:0;flex:none}
.pv #cms .empty{font-size:13px;padding:4px 0!important}
.fv{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(4,4,12,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);animation:fi .2s}
.fv.out{opacity:0;transition:opacity .18s}
.fv img{max-width:100vw;max-height:100dvh;object-fit:contain;animation:zin .32s cubic-bezier(.2,.9,.25,1)}
.fv .ib{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);backdrop-filter:blur(14px)}
.fvc{position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));max-width:calc(100% - 28px);display:flex;gap:8px;align-items:baseline;padding:9px 16px;border-radius:999px;color:#fff;font-size:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.fvc span{opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes sheet{from{transform:translateY(40px) scale(.97);opacity:0}}
@keyframes fi{from{opacity:0}}
@keyframes zin{from{opacity:0;transform:scale(.96)}}
@media(prefers-reduced-motion:reduce){.grid .card,.grid .card img.pic{animation:none;transition:none}}
</style>

 me={uid:u.uid,username:p.username,email:u.email,profilePic:p.profilePic,contacts:p.contacts||[],verified:u.emailVerified,pw:u.providerData.some(x=>x.providerId=="password")};start();if(!me.verified)say("Verify your email to post, comment and chat.")}

async function loadImages(){$("grid").innerHTML='<div class="sp" style="grid-column:1/-1"></div>';try{const r=await fetch(W+"/list");const j=await r.json();posts=(j.images||[]).filter(p=>!/__(dp|chat)__/.test(p.tags||p.caption||"")).sort((a,b)=>new Date(b.date)-new Date(a.date))}catch{if(!posts.length)$("grid").innerHTML='<div class="empty" style="grid-column:1/-1">Couldn\'t load posts. Check your connection and try again.</div>';return}renderGallery()}

function makeCard(p){const c=document.createElement("div");c.className="card g";c.innerHTML=`<img class="pic" loading="lazy" src="${imgUrl(p.id)}" alt=""><div class="meta"><span data-a>${av(p.username)}</span><b>${esc(p.username)}</b></div>`;c.onclick=()=>openPostView(p);getUserProfile(p.uid).then(u=>{if(u)c.querySelector("[data-a]").innerHTML=av(u.username,u.profilePic);if(u)c.querySelector("b").textContent=u.username});return c}

function openPostView(p){const own=!guest&&me.uid===p.uid;const o=document.createElement("div");o.className="ov pv";

 o.innerHTML=`<div class="sheet g pvs"><div class="grab"></div><div class="row"><span data-a>${av(p.username,"","m")}</span><div style="flex:1;min-width:0"><b>${esc(p.username)}</b>${p.date&&!isNaN(new Date(p.date))?`<small>${new Date(p.date).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}</small>`:""}</div><button class="ib" data-x aria-label="Close">${IC.x}</button></div><div class="pvi"><img class="big" src="${imgUrl(p.id)}" alt=""></div><div id="cap">${esc(p.caption)}</div><div id="tg">${tags}</div>
 <div class="row pva"><button class="btn pri" id="vw">${IC.expand} View image</button><button class="btn sq" id="dl" aria-label="Download">${IC.dl}</button>${own?`<button class="btn sq" id="ed" aria-label="Edit post">${IC.edit}</button><button class="btn sq dng" id="de" aria-label="Delete post">${IC.trash}</button>`:""}</div>
 <div id="cms" style="display:flex;flex-direction:column;gap:6px"></div>
 <div class="row"><input class="in" id="ci" placeholder="${guest?"Log in to comment":"Write a comment…"}" ${guest?"disabled":""}><button class="btn pri" id="cs" ${guest?"disabled":""}>Send</button></div></div>`;
 document.body.appendChild(o);const $$=s=>o.querySelector(s);
 getUserProfile(p.uid).then(u=>{if(u){$$("[data-a]").innerHTML=av(u.username,u.profilePic,"m");$$("b").textContent=u.username}});
 const cm=l=>{$$("#cms").innerHTML=(l||[]).length?l.map(c=>`<div class="cm"><b>${esc(c.username)}</b> ${esc(c.text)}</div>`).join(""):'<div class="empty" style="padding:10px">No comments yet. Start the conversation.</div>'};cm(p.comments);
 o.onclick=e=>{if(e.target===o||e.target.dataset.x!==undefined)o.remove();if(e.target.classList.contains("tag")){$("q").value=e.target.textContent;nav("home");renderGallery();o.remove()}};
 $$("#dl").onclick=e=>busy(e.target,async()=>{const b=await(await fetch(imgUrl(p.id))).blob();const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(p.username||"post")+"_"+p.id+".jpg";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)});

try{await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,a))}catch(e){if(/invalid-credential|wrong-password/.test(e.code||"")){say("Current password is incorrect.");return false}throw e}
await updatePassword(u,b);say("Password changed!")}));

 await setDoc(doc(db,"usernames",n),{uid:me.uid,email:me.email||"",createdAt:serverTimestamp()});try{await deleteDoc(doc(db,"usernames",me.username))}catch{}await updateDoc(doc(db,"users",me.uid),{username:n});me.username=n;await getUserProfile(me.uid,true);say("Username updated ✓");openProfile()})}

async function searchUsers(q){const r=$("ur");if(!q){r.innerHTML="";return}try{const s=await onceDocs(query(collection(db,"usernames"),where(documentId(),">=",q),where(documentId(),"<=",q+"\uf8ff"),limit(8)));r.innerHTML="";const rows=s.filter(d=>d.data.uid!=me.uid);if(!rows.length)r.innerHTML='<div class="empty" style="padding:14px">No users found.</div>';
 for(const d of rows){const p=await getUserProfile(d.data.uid);const row=document.createElement("div");row.className="crow";row.innerHTML=`${av(d.id,p?.profilePic,"m")}<div class="tx"><div>@${esc(d.id)}</div></div>`;row.onclick=()=>openConv(d.data.uid);r.appendChild(row)}}catch{say("Search failed. Try again.")}}
const onceDocs=q=>new Promise((res,rej)=>{const u=onSnapshot(q,s=>{u();res(s.docs.map(d=>({id:d.id,data:d.data()})))},e=>{u();rej(e)})});
function renderChatList(){const el=$("cl");if(!el)return;const arr=[...chats.entries()].sort((a,b)=>ms(b[1].lastMessageTime)-ms(a[1].lastMessageTime));if(!arr.length){el.innerHTML='<div class="empty">No chats yet 💬<br>Search a username above to start chatting.</div>';return}
 el.innerHTML="";const s=seen();arr.forEach(([id,c])=>{const o=c.users.find(x=>x!=me.uid),row=document.createElement("div");row.className="crow";const unread=c.lastSender&&c.lastSender!=me.uid&&ms(c.lastMessageTime)>(s[id]||0);
 row.innerHTML=`<span data-a>${av(c.usernames?.[o],c.profilePics?.[o],"m")}</span><div class="tx"><div><b>${esc(c.usernames?.[o]||"user")}</b></div><div><small>${esc(c.lastMessage||"New chat")}</small></div></div>${unread?'<span class="ud"></span>':""}`;row.onclick=()=>openConv(o);el.appendChild(row);
 getUserProfile(o).then(u=>{if(u){row.querySelector("[data-a]").innerHTML=av(u.username,u.profilePic,"m");row.querySelector("b").textContent=u.username}})});}
function updBadge(){const s=seen();$("badge").classList.toggle("hide",![...chats].some(([id,c])=>c.lastSender&&c.lastSender!=me.uid&&ms(c.lastMessageTime)>(s[id]||0)))}
function openPanel(){if(guest){say("Log in to use chat.");return}if(!canAct())return;panelOpen=true;$("panel").classList.add("open");curChat?openConv(curChat.other):panelList()}
function closePanel(){panelOpen=false;$("panel").classList.remove("open");unsubMsgs?.()}
function watchChat(id){if(watching.has(id))return;watching.add(id);onSnapshot(doc(db,"chats",id),s=>{if(!s.exists()||!me)return;const c=s.data(),first=!chats.has(id);chats.set(id,c);const t=ms(c.lastMessageTime);
 if(c.lastSender&&c.lastSender!=me.uid){if(curChat?.id==id&&panelOpen)setSeen(id,t);else if(t>T0&&!first||t>T0&&first){const o=c.users.find(x=>x!=me.uid);getUserProfile(o).then(u=>toast(`${av(u?.username||c.lastSenderName,u?.profilePic,"m")}<div><b>${esc(c.lastSenderName||"New message")}</b><div style="color:var(--m);font-size:13px">${esc(c.lastMessage)}</div></div>`,()=>{openPanel();openConv(o)}))}}
 renderChatList();updBadge()},()=>watching.delete(id))}
function startNotif(){me.contacts.forEach(u=>watchChat(cid(me.uid,u)));
 onSnapshot(query(collection(db,"chats"),where("users","array-contains",me.uid)),s=>s.docs.forEach(d=>watchChat(d.id)),()=>{})}
async function openConv(other){const id=cid(me.uid,other),op=await getUserProfile(other);if(!op){say("User not found.");return}
 try{const s=await getDoc(doc(db,"chats",id));if(!s.exists())await setDoc(doc(db,"chats",id),{users:[me.uid,other],usernames:{[me.uid]:me.username,[other]:op.username},profilePics:{[me.uid]:me.profilePic||"",[other]:op.profilePic||""},createdAt:serverTimestamp()});
 if(!me.contacts.includes(other)){me.contacts.push(other);await updateDoc(doc(db,"users",me.uid),{contacts:arrayUnion(other)})}}catch{say("Couldn't open chat.");return}
 watchChat(id);curChat={id,other};panelOpen=true;$("panel").classList.add("open");const el=$("panel");
 el.innerHTML=`<div class="ph"><button class="ib" id="bk" aria-label="Back">${IC.back}</button>${av(op.username,op.profilePic,"m")}<b style="flex:1">@${esc(op.username)}</b><button class="ib" id="px" aria-label="Close">${IC.x}</button></div><div id="msgs"></div><div class="cb"><button class="ib" id="at" aria-label="Attach image">${IC.clip}</button><input class="in" id="mi" placeholder="Write a message…" style="flex:1"><button class="btn pri" id="sd">Send</button></div>`;
 $("bk").onclick=panelList;$("px").onclick=closePanel;$("at").onclick=()=>$("fChat").click();$("sd").onclick=()=>sendMsg();$("mi").onkeydown=e=>{if(e.key=="Enter")sendMsg()};loadMsgs(id);$("mi").focus()}
function loadMsgs(id){unsubMsgs?.();unsubMsgs=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("createdAt")),s=>{const el=$("msgs");if(!el||curChat?.id!=id)return;el.innerHTML="";if(s.empty)el.innerHTML='<div class="empty">Send the first message 👋</div>';
 s.docs.forEach(d=>{const m=d.data(),own=m.from==me.uid,b=document.createElement("div");b.className="b"+(own?" me":"");const tm=m.createdAt?new Date(ms(m.createdAt)).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"…";
 b.innerHTML=(m.imageUrl?`<img src="${esc(m.imageUrl)}" alt="">`:"")+(m.text?`<span>${esc(m.text)}</span>`:"")+`<small>${tm}${m.edited?" · edited":""}</small>`+(own?'<button class="mm" aria-label="Message options">'+IC.more+'</button>':"");
 if(own)b.querySelector(".mm").onclick=()=>msgMenu(id,d.id,m);el.appendChild(b)});el.scrollTop=el.scrollHeight;setSeen(id,Date.now());updBadge();renderChatList()},()=>say("Couldn't load messages."))}
function msgMenu(id,mid,m){const o=dlg("Message",`<button class="btn" data-ed ${m.text?"":"disabled"}>${IC.edit} Edit</button><button class="btn dng" data-del>${IC.trash} Delete</button>`,null);o.querySelector("[data-ed]").onclick=()=>{o.remove();dlg("Edit message",`<input class="in" id="et" value="${esc(m.text)}">`,"Save",async d=>{const t=d.querySelector("#et").value.trim();if(!t)return false;await updateDoc(doc(db,"chats",id,"messages",mid),{text:t,edited:true})})};
 o.querySelector("[data-del]").onclick=async()=>{o.remove();if(!confirm("Delete this message?"))return;try{await deleteDoc(doc(db,"chats",id,"messages",mid))}catch{say("Couldn't delete.")}}}
async function sendMsg(file){const inp=$("mi");if(!inp||!curChat||!canAct())return;const text=inp.value.trim();if(!text&&!file)return;const{id,other}=curChat;inp.value="";const btn=$("sd");
 try{let imageUrl="";if(file){say("Sending image…");imageUrl=imgUrl(await upload(file,{caption:"__chat__",tags:"__chat__"}))}
 const msg={text,from:me.uid,fromName:me.username,createdAt:serverTimestamp(),edited:false};if(imageUrl)msg.imageUrl=imageUrl;await addDoc(collection(db,"chats",id,"messages"),msg);
 const op=await getUserProfile(other);await setDoc(doc(db,"chats",id),{users:[me.uid,other],usernames:{[me.uid]:me.username,[other]:op?.username||""},profilePics:{[me.uid]:me.profilePic||"",[other]:op?.profilePic||""},lastMessage:text||"📷 Photo",lastMessageTime:serverTimestamp(),lastSender:me.uid,lastSenderName:me.username},{merge:true})}
 catch(e){inp.value=text;say(navigator.onLine?"Message not sent. Try again.":"You're offline — message not sent.")}}
$("fChat").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)sendMsg(f)};
function updVerify(){$("vb").classList.toggle("hide",guest||!me||me.verified!==false)}
$("vRe").onclick=()=>busy($("vRe"),async()=>{await sendEmailVerification(auth.currentUser);mailSent("verify")});
$("vOk").onclick=()=>busy($("vOk"),async()=>{await auth.currentUser.reload();me.verified=auth.currentUser.emailVerified;updVerify();say(me.verified?"Email verified ✓":"Not verified yet. Open the link in your email first.")});
/* NAV */
function nav(v){["Home","Search","Chat","Prof"].forEach(k=>$("n"+k).classList.remove("on"));$("home").classList.toggle("hide",v=="profile");$("profile").classList.toggle("hide",v!="profile");if(v=="profile"){$("nProf").classList.add("on");openProfile()}else{$("nHome").classList.add("on");if(v=="search"){$("nHome").classList.remove("on");$("nSearch").classList.add("on");$("main").scrollTop=0;$("q").focus()}}}
$("nHome").onclick=()=>{$("q").value="";nav("home");renderGallery()};$("nSearch").onclick=()=>nav("search");$("nPost").onclick=openUpload;$("nChat").onclick=openPanel;$("chatBtn").onclick=openPanel;$("nProf").onclick=()=>nav("profile");
$("q").oninput=()=>{nav("home");renderGallery()};
addEventListener("online",()=>{$("off").classList.add("hide");if(ready)loadImages()});addEventListener("offline",()=>$("off").classList.remove("hide"));if(!navigator.onLine)$("off").classList.remove("hide");
</script><script type="module">
/* ISHNTTCHAT boost */
(()=>{
const d=document,$=id=>d.getElementById(id),root=d.documentElement,set=(id,a,v)=>$(id)?.setAttribute(a,v);

/* Styles: no iOS zoom on inputs, visible keyboard focus, image fade-in, reduced motion */
const st=d.createElement('style');
st.textContent=`input,textarea{font-size:16px}
html{-webkit-text-size-adjust:100%}
main,#msgs,#panel{overscroll-behavior:contain}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.in:focus-visible,#q:focus-visible{outline:0}
.grid .card img.pic.fade{opacity:0;transition:opacity .4s,transform .6s cubic-bezier(.2,.8,.2,1)}
.grid .card img.pic.fade.ld{opacity:1}
@media(prefers-reduced-motion:reduce){.grid .card,.grid .card img.pic,.pv .sheet,.fv img,#thm,#panel,#toast{animation:none!important;transition:none!important}}`;
d.head.appendChild(st);

/* Head extras: description, favicon */
const H=(t,o)=>{const e=d.createElement(t);for(const k in o)e.setAttribute(k,o[k]);d.head.appendChild(e)};
if(!d.querySelector('meta[name=description]'))H('meta',{name:'description',content:'ISHNTTCHAT: share photos, browse by hashtag and chat with friends.'});
if(!d.querySelector('link[rel~=icon]'))H('link',{rel:'icon',href:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ffb54a'/%3E%3Ctext x='32' y='45' font-size='36' font-weight='700' text-anchor='middle' fill='%23201400' font-family='sans-serif'%3EI%3C/text%3E%3C/svg%3E"});

/* First visit follows the device's light/dark setting */
try{if(!localStorage.getItem('theme')&&matchMedia('(prefers-color-scheme:light)').matches){root.setAttribute('data-theme','light');d.querySelector('meta[name=theme-color]')?.setAttribute('content','#ecebe7')}}catch{}

/* Form and screen-reader basics */
set('aMail','autocomplete','email');set('aUser','autocomplete','username');set('aUser','spellcheck','false');
set('aPass','autocomplete','current-password');set('q','aria-label','Search');
set('toast','role','status');set('toast','aria-live','polite');set('off','role','alert');
$('tLogin')?.addEventListener('click',()=>set('aPass','autocomplete','current-password'));
$('tSign')?.addEventListener('click',()=>set('aPass','autocomplete','new-password'));

/* Search waits for a pause in typing; tapping Home again scrolls to the top */
const q=$('q'),qf=q&&q.oninput;
if(qf){let t;q.oninput=e=>{clearTimeout(t);t=setTimeout(()=>qf.call(q,e),180)}}
$('nHome')?.addEventListener('click',()=>$('main')?.scrollTo({top:0,behavior:'smooth'}));

/* Cards become keyboard-reachable, images fade in, dialogs are announced as dialogs */
const done=new WeakSet();
function scan(n){
  if(n.matches('.grid>.card')){
    if(done.has(n))return;done.add(n);
    n.tabIndex=0;n.setAttribute('role','button');
    const i=n.querySelector('img.pic');
    if(i){i.decoding='async';if(!i.complete){const f=()=>i.classList.add('ld');i.classList.add('fade');i.addEventListener('load',f,{once:true});i.addEventListener('error',f,{once:true})}}
  }else if(n.matches('.ov')){
    if(done.has(n))return;done.add(n);
    const s=n.firstElementChild;if(s){s.setAttribute('role','dialog');s.setAttribute('aria-modal','true')}
  }else if(n.firstElementChild)n.querySelectorAll('.grid>.card,.ov').forEach(scan);
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>n.nodeType==1&&scan(n)))).observe(d.body,{childList:true,subtree:true});
d.querySelectorAll('.grid>.card,.ov').forEach(scan);

/* Keyboard: Enter submits login and dialogs, Enter/Space opens a card, Escape closes the top layer */
d.addEventListener('keydown',e=>{
  const t=e.target,k=e.key;
  if(k=='Escape'){
    const top=[...d.querySelectorAll('.fv,.ov')].pop();
    if(top)top.classList.contains('fv')?top.click():top.querySelector('[data-x]')?.click();
    else if($('panel')?.classList.contains('open'))$('px')?.click();
    return;
  }
  if(!t.matches)return;
  if((k=='Enter'||k==' ')&&t.matches('.grid>.card')){e.preventDefault();t.click();return}
  if(k=='Enter'&&t.matches('input:not([type=file])')){
    const ov=t.closest('.ov'),b=t.closest('#auth')?$('aGo'):ov&&ov.querySelector('[data-ok],#cs');
    if(b&&!b.disabled&&!b.classList.contains('spin')){e.preventDefault();b.click()}
  }
});

/* Smaller uploads: resize big photos before they leave the phone (posts 1600px, chat 1280px, profile 512px) */
async function shrink(f,max){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;
  try{
    const b=await createImageBitmap(f),k=Math.min(1,max/Math.max(b.width,b.height));
    if(k==1&&f.size<8e5)return f;
    const c=d.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);
    const o=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    return o&&o.size<f.size?new File([o],(f.name||'photo').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f;
  }catch{return f}
}
const F=window.fetch.bind(window);
window.fetch=async(u,o)=>{
  try{
    if(o&&o.method=='POST'&&o.body instanceof FormData&&/\/upload$/.test(String(u))){
      const f=o.body.get('file'),c=o.body.get('caption');
      if(f instanceof Blob){const s=await shrink(f,c=='__dp__'?512:c=='__chat__'?1280:1600);if(s!==f)o.body.set('file',s,s.name)}
    }
  }catch{}
  return F(u,o);
};
})();
</script>
