<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISHNTTCHAT</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #000; color: #fff; height: 100vh; overflow: hidden; }

#loginScreen { position: fixed; inset: 0; background: #0a0a0a; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
#loginScreen.hide { display: none; }
.login-box { width: 100%; max-width: 360px; padding: 32px 26px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 24px; }
.login-box h1 { font-size: 30px; font-weight: 800; letter-spacing: -1px; margin-bottom: 4px; }
.login-box h1 span { background: linear-gradient(135deg, #00ffaa, #00ccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.login-box .sub { font-size: 12px; color: #888; margin-bottom: 26px; }
.tabs { display: flex; padding: 4px; margin-bottom: 18px; background: #0a0a0a; border-radius: 14px; }
.tab { flex: 1; padding: 10px; border: none; background: transparent; color: #777; font-weight: 700; font-size: 13px; border-radius: 10px; cursor: pointer; }
.tab.on { background: #00ffaa; color: #000; }
input.field { width: 100%; padding: 14px 16px; margin-bottom: 10px; background: #0a0a0a; border: 1px solid #2a2a2a; color: #fff; font-size: 14px; border-radius: 14px; outline: none; }
input.field:focus { border-color: #00ffaa; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 14px; font-weight: 800; cursor: pointer; margin-bottom: 10px; }
.btn:active { transform: scale(0.97); }
.btn-green { background: #00ffaa; color: #000; }
.btn-white { background: #fff; color: #000; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; padding: 12px; }
.btn-ghost { background: transparent; color: #888; border: 1px solid #2a2a2a; font-weight: 600; font-size: 13px; padding: 12px; }
.err { color: #ff4466; font-size: 12px; margin-bottom: 10px; display: none; padding: 8px; background: rgba(255,68,102,0.08); border-radius: 8px; }

#app { display: none; height: 100vh; flex-direction: column; }
#app.on { display: flex; }
header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #0a0a0a; border-bottom: 1px solid #1f1f1f; }
.logo { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { background: linear-gradient(135deg, #00ffaa, #00ccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.h-actions { display: flex; gap: 8px; align-items: center; }
.iconbtn { background: #1a1a1a; border: none; color: #aaa; width: 38px; height: 38px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
.iconbtn:hover { color: #00ffaa; }
.iconbtn .dot { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: #ff3355; display: none; }
.iconbtn .dot.on { display: block; }
.postbtn { background: #00ffaa; color: #000; border: none; padding: 9px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; }

.searchWrap { padding: 12px 16px; background: #0a0a0a; border-bottom: 1px solid #1f1f1f; }
.searchWrap input { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; padding: 12px 16px; border-radius: 20px; font-size: 13px; outline: none; }
.searchWrap input:focus { border-color: #00ffaa; }

#gallery { flex: 1; overflow-y: auto; padding: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.gcard { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden; cursor: pointer; }
.gcard:hover { border-color: #00ffaa; }
.gcard img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
.gcard .gbody { padding: 8px; }
.gcard .gname { font-size: 11px; color: #00ffaa; font-weight: 700; margin-bottom: 4px; }
.gcard .gcap { font-size: 11px; color: #999; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gcard .gtags { font-size: 10px; color: #00ccff; margin-bottom: 6px; }
.gcard .grow { display: flex; justify-content: space-between; align-items: center; }
.gcard .gcnt { font-size: 10px; color: #666; }
.empty { text-align: center; padding: 60px 20px; color: #555; font-size: 14px; line-height: 1.6; }

#chatPanel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh; background: #0a0a0a; border-left: 1px solid #1f1f1f; z-index: 200; display: flex; flex-direction: column; transition: right 0.3s ease; }
#chatPanel.on { right: 0; }
.phead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #1f1f1f; }
.pback { background: #1a1a1a; border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; }
.phead h2 { font-size: 17px; font-weight: 700; }
.ptabs { display: flex; padding: 8px 12px; gap: 4px; border-bottom: 1px solid #1f1f1f; }
.ptab { flex: 1; padding: 9px; text-align: center; color: #777; font-weight: 700; font-size: 12px; cursor: pointer; border-radius: 10px; background: #141414; }
.ptab.on { background: #00ffaa; color: #000; }
.plist { flex: 1; overflow-y: auto; }
.chatrow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #141414; }
.chatrow:hover { background: #141414; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #00ffaa, #00ccff); color: #000; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.chatrow .cinfo { flex: 1; min-width: 0; }
.chatrow .cname { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.chatrow .cmsg { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.searchbox { padding: 12px 16px; border-bottom: 1px solid #1f1f1f; }
.searchbox input { width: 100%; background: #141414; border: 1px solid #2a2a2a; color: #fff; padding: 10px 14px; border-radius: 18px; font-size: 13px; outline: none; }
.searchbox input:focus { border-color: #00ffaa; }
.userrow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #141414; }
.userrow .uname { font-size: 13px; font-weight: 700; flex: 1; }
.userrow .uchat { color: #00ffaa; font-size: 11px; font-weight: 700; }
.pempty { text-align: center; padding: 40px 20px; color: #555; font-size: 12px; line-height: 1.7; }

#msgView { position: fixed; inset: 0; background: #0a0a0a; z-index: 300; display: none; flex-direction: column; }
#msgView.on { display: flex; }
.mhead { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #1f1f1f; }
.mhead .avatar { width: 38px; height: 38px; font-size: 14px; }
.mhead .mname { font-size: 14px; font-weight: 700; }
.mhead .mstatus { font-size: 10px; color: #00ffaa; }
#msgBody { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.msg-row { display: flex; align-items: flex-end; gap: 6px; }
.msg-row.me { justify-content: flex-end; }
.msg { max-width: 75%; padding: 9px 13px; border-radius: 18px; font-size: 13px; line-height: 1.4; word-break: break-word; }
.msg.me { background: #00ffaa; color: #000; border-bottom-right-radius: 4px; }
.msg.you { background: #1c1c1c; color: #fff; border-bottom-left-radius: 4px; }
.msg .mtime { font-size: 9px; opacity: 0.6; margin-top: 3px; display: block; text-align: right; }
.msg .medit { font-size: 9px; opacity: 0.6; margin-right: 4px; font-style: italic; }
.msg img { max-width: 100%; border-radius: 12px; margin-bottom: 4px; display: block; cursor: pointer; }
.msg-action { background: #1c1c1c; border: none; color: #aaa; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: 0.6; }
.msg-action:hover { opacity: 1; color: #00ffaa; }
.mbottom { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #1f1f1f; align-items: center; }
.mbottom .attach { background: #1a1a1a; border: none; color: #00ffaa; width: 40px; height: 40px; border-radius: 50%; font-size: 17px; cursor: pointer; }
.mbottom input { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; padding: 11px 16px; border-radius: 22px; font-size: 13px; outline: none; }
.mbottom input:focus { border-color: #00ffaa; }
.mbottom .send { background: #00ffaa; color: #000; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 15px; font-weight: 700; cursor: pointer; }

#msgMenu { position: fixed; left: 50%; bottom: -100%; transform: translateX(-50%); width: calc(100% - 24px); max-width: 400px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px 20px 0 0; padding: 8px; z-index: 500; transition: bottom 0.3s ease; }
#msgMenu.on { bottom: 0; }
#msgMenu .handle { width: 40px; height: 4px; background: #333; border-radius: 4px; margin: 4px auto 12px; }
#msgMenu button { width: 100%; background: #141414; border: none; color: #fff; padding: 14px; text-align: left; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
#msgMenu button.d { color: #ff5577; }
#msgMenu button .ic { font-size: 18px; width: 24px; text-align: center; }

#backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; }
#backdrop.on { display: block; }

#toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #1a1a1a; border: 1px solid #00ffaa; padding: 12px 16px; border-radius: 14px; z-index: 600; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); min-width: 280px; transition: transform 0.4s ease; }
#toast.on { transform: translateX(-50%) translateY(0); }
#toast .tinfo { flex: 1; min-width: 0; }
#toast .tname { font-size: 12px; color: #00ffaa; font-weight: 700; margin-bottom: 2px; }
#toast .tmsg { font-size: 12px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 700; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal.on { display: flex; }
.modal-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
.modal-box h3 { font-size: 18px; margin-bottom: 14px; font-weight: 700; }
.modal-box textarea, .modal-box input { width: 100%; background: #0a0a0a; border: 1px solid #2a2a2a; color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 14px; outline: none; margin-bottom: 10px; font-family: inherit; resize: vertical; }
.modal-box textarea:focus, .modal-box input:focus { border-color: #00ffaa; }
.modal-box .preview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 12px; margin-bottom: 10px; }

#postView { position: fixed; inset: 0; background: #0a0a0a; z-index: 800; display: none; flex-direction: column; overflow-y: auto; }
#postView.on { display: flex; }
.post-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #1f1f1f; position: sticky; top: 0; background: #0a0a0a; z-index: 10; }
.post-header .avatar { width: 36px; height: 36px; font-size: 14px; }
.post-header .pname { font-size: 14px; font-weight: 700; }
.post-img { width: 100%; max-height: 60vh; object-fit: contain; background: #000; display: block; }
.post-body { padding: 16px; }
.post-caption { font-size: 14px; color: #ccc; margin-bottom: 10px; line-height: 1.5; }
.post-tags { font-size: 13px; color: #00ccff; margin-bottom: 14px; }
.post-actions-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.post-action-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.post-action-btn:hover { background: #00ffaa; color: #000; border-color: #00ffaa; }
.post-action-btn.del:hover { background: #ff3355; border-color: #ff3355; color: #fff; }
.post-comments { margin-top: 10px; }
.post-comments h4 { font-size: 13px; color: #888; margin-bottom: 10px; font-weight: 600; }
.post-comment { background: #1a1a1a; padding: 8px 12px; border-radius: 10px; font-size: 12px; margin-bottom: 6px; color: #ccc; }
.post-comment b { color: #00ffaa; }
.post-comment-input { display: flex; gap: 6px; margin-top: 12px; }
.post-comment-input input { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; padding: 11px 14px; border-radius: 22px; font-size: 13px; outline: none; }
.post-comment-input button { background: #00ffaa; color: #000; border: none; padding: 11px 18px; border-radius: 22px; font-size: 13px; font-weight: 700; cursor: pointer; }

#profileView { position: fixed; inset: 0; background: #0a0a0a; z-index: 800; display: none; flex-direction: column; overflow-y: auto; }
#profileView.on { display: flex; }
.profile-header { padding: 20px 16px; border-bottom: 1px solid #1f1f1f; position: sticky; top: 0; background: #0a0a0a; z-index: 10; display: flex; align-items: center; gap: 12px; }
.profile-info { padding: 24px 16px; text-align: center; border-bottom: 1px solid #1f1f1f; }
.profile-pic { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #00ffaa, #00ccff); color: #000; font-weight: 800; font-size: 32px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; overflow: hidden; cursor: pointer; position: relative; }
.profile-pic img { width: 100%; height: 100%; object-fit: cover; }
.profile-name { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.profile-email { font-size: 12px; color: #666; margin-bottom: 16px; }
.profile-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
.profile-stats .stat { text-align: center; }
.profile-stats .stat b { font-size: 18px; font-weight: 800; display: block; }
.profile-stats .stat span { font-size: 11px; color: #666; }
.profile-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.profile-actions button { background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
.profile-actions button:hover { background: #00ffaa; color: #000; border-color: #00ffaa; }
.profile-posts { padding: 16px; }
.profile-posts h4 { font-size: 14px; color: #888; margin-bottom: 12px; }
.profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.profile-grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: pointer; border-radius: 4px; }

@media (max-width: 640px) { #chatPanel { max-width: 100%; } }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>ISHNTT<span>CHAT</span></h1>
    <p class="sub">Share. Chat. Connect.</p>
    <div class="err" id="err"></div>
    <div class="tabs">
      <button class="tab on" id="tabLogin" onclick="setMode(true)">Login</button>
      <button class="tab" id="tabSignup" onclick="setMode(false)">Sign Up</button>
    </div>
    <input type="text" class="field" id="inUser" placeholder="Username (unique)" style="display:none;">
    <input type="email" class="field" id="inEmail" placeholder="Email">
    <input type="password" class="field" id="inPass" placeholder="Password (min 6)">
    <button class="btn btn-green" id="authBtn" onclick="doAuth()">Login</button>
    <button class="btn btn-white" onclick="doGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" height="16" alt="G">
      Continue with Google
    </button>
    <button class="btn btn-ghost" onclick="doSkip()">Skip for now →</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">ISHNTT<span>CHAT</span></div>
    <div class="h-actions">
      <button class="iconbtn" onclick="openChat()">💬<span class="dot" id="chatDot"></span></button>
      <button class="iconbtn" onclick="openProfile()">👤</button>
      <button class="postbtn" onclick="pickImage()">+ Post</button>
    </div>
  </header>
  <div class="searchWrap">
    <input type="text" id="mainSearch" placeholder="🔍 Search... try #anime #nature #cars" oninput="filterBySearch(this.value)">
  </div>
  <div id="gallery">
    <div class="empty" id="gEmpty">Abhi koi post nahi hai<br>"+ Post" dabao aur upload karo!</div>
    <div class="grid" id="gGrid"></div>
  </div>
  <input type="file" id="fileIn" accept="image/*" style="display:none;">
  <input type="file" id="chatImgIn" accept="image/*" style="display:none;">
  <input type="file" id="profilePicIn" accept="image/*" style="display:none;">
</div>

<div class="modal" id="uploadModal">
  <div class="modal-box">
    <h3>New Post</h3>
    <img id="uploadPreview" class="preview" style="display:none;">
    <textarea id="uploadCaption" placeholder="Caption likho..." rows="2"></textarea>
    <input type="text" id="uploadTags" placeholder="#hashtags (jaise #anime #nature #cars)">
    <button class="btn btn-green" onclick="submitPost()">Share Post</button>
    <button class="btn btn-ghost" onclick="closeUpload()">Cancel</button>
  </div>
</div>

<div id="backdrop" onclick="handleBackdrop()"></div>
<div id="chatPanel">
  <div class="phead">
    <button class="pback" onclick="closeChat()">←</button>
    <h2>Chats</h2>
  </div>
  <div class="ptabs">
    <div class="ptab on" id="ptabChats" onclick="switchTab('chats')">💬 Chats</div>
    <div class="ptab" id="ptabSearch" onclick="switchTab('search')">🔍 Search</div>
  </div>
  <div class="plist" id="chatsList">
    <div class="pempty" id="chatsEmpty">Abhi koi chat nahi.<br>Search se kisi ko dhoondo!</div>
  </div>
  <div class="plist" id="searchList" style="display:none;">
    <div class="searchbox">
      <input type="text" id="searchIn" placeholder="Username search..." oninput="searchUsers(this.value)">
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<div id="msgView">
  <div class="mhead">
    <button class="pback" onclick="closeMsg()">←</button>
    <div class="avatar" id="mAvatar">U</div>
    <div>
      <div class="mname" id="mName">User</div>
      <div class="mstatus">online</div>
    </div>
  </div>
  <div id="msgBody"></div>
  <div class="mbottom">
    <button class="attach" onclick="document.getElementById('chatImgIn').click()">📎</button>
    <input type="text" id="msgIn" placeholder="Message..." onkeypress="if(event.key==='Enter')sendMsg()">
    <button class="send" onclick="sendMsg()">➤</button>
  </div>
</div>

<div id="msgMenu">
  <div class="handle"></div>
  <button id="editOpt" onclick="editMsg()"><span class="ic">✏️</span> Edit Message</button>
  <button class="d" onclick="deleteMsg()"><span class="ic">🗑</span> Delete Message</button>
</div>

<div id="postView">
  <div class="post-header">
    <button class="pback" onclick="closePostView()">←</button>
    <div class="avatar" id="pvAvatar">U</div>
    <div>
      <div class="pname" id="pvName">User</div>
      <div style="font-size:10px;color:#666;" id="pvTime">just now</div>
    </div>
  </div>
  <img id="pvImage" class="post-img">
  <div class="post-body">
    <div class="post-caption" id="pvCaption"></div>
    <div class="post-tags" id="pvTags"></div>
    <div class="post-actions-row">
      <button class="post-action-btn" onclick="downloadPost()">⬇️ Download</button>
      <button class="post-action-btn" id="pvEditBtn" onclick="editPostFromView()">✏️ Edit</button>
      <button class="post-action-btn del" id="pvDelBtn" onclick="deletePostFromView()">🗑 Delete</button>
    </div>
    <div class="post-comments">
      <h4>Comments (<span id="pvCommentCount">0</span>)</h4>
      <div id="pvComments"></div>
      <div class="post-comment-input">
        <input type="text" id="pvCommentInput" placeholder="Comment...">
        <button onclick="addPvComment()">Post</button>
      </div>
    </div>
  </div>
</div>

<div id="profileView">
  <div class="profile-header">
    <button class="pback" onclick="closeProfile()">←</button>
    <h2 style="font-size:17px;font-weight:700;">Profile</h2>
  </div>
  <div class="profile-info">
    <div class="profile-pic" id="profilePic" onclick="changeProfilePic()">
      <span id="profilePicText">U</span>
    </div>
    <div class="profile-name" id="profileName">User</div>
    <div class="profile-email" id="profileEmail">email@example.com</div>
    <div class="profile-stats">
      <div class="stat"><b id="statPosts">0</b><span>Posts</span></div>
      <div class="stat"><b id="statChats">0</b><span>Chats</span></div>
    </div>
    <div class="profile-actions">
      <button onclick="changeUsername()">Change Username</button>
      <button onclick="changeProfilePic()">Change Photo</button>
      <button onclick="doLogout()" style="background:#ff3355;border-color:#ff3355;">Logout</button>
    </div>
  </div>
  <div class="profile-posts">
    <h4>My Posts</h4>
    <div class="profile-grid" id="profileGrid"></div>
  </div>
</div>

<div id="toast">
  <div class="avatar" id="toastAvatar">U</div>
  <div class="tinfo">

window.doAuth = async () => {
  const email = $('inEmail').value.trim(), pass = $('inPass').value, user = $('inUser').value.trim().toLowerCase();
  $('err').style.display = 'none';
  if (!email || !pass) return showErr('Email aur password daalo!');
  if (pass.length < 6) return showErr('Password min 6 chars!');
  if (!isLoginMode) {
    if (!user) return showErr('Username daalo!');
    if (user.length < 3 || !/^[a-z0-9_]+$/.test(user)) return showErr('Username: small letters, numbers, _ only!');
    const s = await getDoc(doc(db, 'usernames', user));
    if (s.exists()) return showErr('Ye username already le liya gaya hai!');
  }
  try {
    if (isLoginMode) await signInWithEmailAndPassword(auth, email, pass);
    else {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, 'usernames', user), { uid: c.user.uid, email, createdAt: Date.now() });
      await setDoc(doc(db, 'users', c.user.uid), { username: user, email, createdAt: Date.now() });
      await updateProfile(c.user, { displayName: user });
    }
  } catch (e) { showErr(e.message.replace('Firebase: ', '')); }
};

window.doGoogle = async () => {
  try {
    const r = await signInWithPopup(auth, googleProvider);
    const u = r.user;
    let base = (u.displayName || u.email.split('@')[0]).toLowerCase().replace(/[^a-z0-9_]/g, '');
    let s = await getDoc(doc(db, 'usernames', base));
    if (s.exists() && s.data().uid !== u.uid) base = base + '_' + Math.floor(Math.random() * 9999);
    if (!s.exists()) {
      await setDoc(doc(db, 'usernames', base), { uid: u.uid, email: u.email, createdAt: Date.now() });
      await setDoc(doc(db, 'users', u.uid), { username: base, email: u.email, createdAt: Date.now() });
      await updateProfile(u, { displayName: base });
    } else if (s.data().uid === u.uid) await updateProfile(u, { displayName: base });
  } catch (e) { showErr(e.message); }
};

window.submitPost = async () => {
  if (!pendingFile) return;
  const caption = $('uploadCaption').value.trim();

  if (isGuest && guestCount() >= GUEST_LIMIT) return alert('Limit khatam!');

  fd.append('caption', caption);
  fd.append('tags', tags);
  try {

    if (d.id) { if (isGuest) incGuest(); closeUpload(); setTimeout(loadImages, 500); }
    else alert('Upload fail');

async function loadImages() {
  try {
    const r = await fetch(`${WORKER_URL}/list`);
    const d = await r.json();
    allImages = d.images || [];
    renderGallery();
  } catch (e) {}
}

function renderGallery() {
  const grid = $('gGrid');
  grid.innerHTML = '';
  let filtered = allImages;
  if (currentFilter) {
    const f = currentFilter.toLowerCase();
    filtered = allImages.filter(im => {
      const tags = (im.tags || '').toLowerCase();
      const cap = (im.caption || '').toLowerCase();
      const un = (im.username || '').toLowerCase();
      return tags.includes(f) || cap.includes(f) || un.includes(f);
    });
  }
  if (filtered.length > 0) {
    $('gEmpty').style.display = 'none';
    filtered.forEach(im => grid.appendChild(makeCard(im)));
  } else {
    $('gEmpty').style.display = 'block';
    $('gEmpty').textContent = currentFilter ? 'Koi post nahi mila' : 'Abhi koi post nahi hai';
  }
}

function makeCard(im) {
  const c = document.createElement('div');
  c.className = 'gcard';
  c.onclick = () => openPostView(im);
  const tagList = (im.tags || '').split(' ').filter(t => t).map(t => t.startsWith('#') ? t : '#' + t).join(' ');
  c.innerHTML = `
    <img src="${WORKER_URL}/image/${im.id}" loading="lazy">
    <div class="gbody">
      <div class="gname">📷 ${esc(im.username || 'Unknown')}</div>
      <div class="gcap">${esc(im.caption || '')}</div>
      ${tagList ? `<div class="gtags">${esc(tagList)}</div>` : ''}
      <div class="grow"><span class="gcnt">💬 ${(im.comments || []).length}</span></div>
    </div>`;
  return c;
}

window.searchUsers = async q => {
  const res = $('searchResults');
  if (q.length < 2) { res.innerHTML = '<div class="pempty">2 letters daalo...</div>'; return; }

window.startChat = async (uid, name) => {
  if (isGuest) return alert('Login karo!');
  const cid = [currentUser.uid, uid].sort().join('_');
  activeChatId = cid;
  activeChatUser = { uid, name };
  $('mName').textContent = name;
  $('mAvatar').textContent = name[0].toUpperCase();
  $('msgView').classList.add('on');
  const ref = doc(db, 'chats', cid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, {
      users: [currentUser.uid, uid],
      usernames: { [currentUser.uid]: currentUser.name, [uid]: name },
      createdAt: Date.now(), lastMessage: 'Connected!', lastMessageTime: Date.now(),
      lastSender: 'system'
    });
  }
  closeChat();
  knownMsgIds = new Set();
  loadMsgs(cid);
};

function loadMsgs(cid) {
  if (unsubMsgs) unsubMsgs();
  const body = $('msgBody');
  body.innerHTML = '<div style="text-align:center;color:#555;padding:20px;font-size:12px;">Loading...</div>';
  const q = query(collection(db, 'chats', cid, 'messages'), orderBy('createdAt', 'asc'), limit(200));
  unsubMsgs = onSnapshot(q, snap => {
    body.innerHTML = '';
    if (snap.empty) { body.innerHTML = '<div style="text-align:center;color:#555;padding:20px;font-size:12px;">Abhi koi message nahi</div>'; return; }
    snap.forEach(d => {
      const m = d.data(), mid = d.id, me = m.from === currentUser.uid;
      const row = document.createElement('div');
      row.className = 'msg-row ' + (me ? 'me' : 'you');
      if (me) {
        const btn = document.createElement('button');
        btn.className = 'msg-action';
        btn.innerHTML = '⋯';
        btn.onclick = e => { e.stopPropagation(); openMsgMenu(mid, m.text || ''); };
        row.appendChild(btn);
      }
      const div = document.createElement('div');
      div.className = 'msg ' + (me ? 'me' : 'you');
      const time = m.createdAt ? new Date(m.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      let h = '';
      if (m.imageUrl) h += `<img src="${m.imageUrl}" onclick="event.stopPropagation();window.open('${m.imageUrl}','_blank')">`;
      if (m.text) h += `<span>${esc(m.text)}</span>`;
      h += `<span class="mtime">${m.edited ? '<span class="medit">edited</span>' : ''}${time}</span>`;
      div.innerHTML = h;
      row.appendChild(div);
      body.appendChild(row);
    });
    body.scrollTop = body.scrollHeight;
  });
}

window.sendMsg = async () => {
  if (isGuest) return alert('Login karo!');
  const inp = $('msgIn'), t = inp.value.trim();
  if (!t || !activeChatId) return;
  inp.value = '';
  try {
    await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
      text: t,
      from: currentUser.uid,
      fromName: currentUser.name,
      createdAt: serverTimestamp()
    });
    await setDoc(doc(db, 'chats', activeChatId), {
      lastMessage: t,
      lastMessageTime: Date.now(),
      lastSender: currentUser.uid,
      lastSenderName: currentUser.name
    }, { merge: true });
  } catch (err) {
    alert('Message fail: ' + err.message);
  }
};

$('chatImgIn').onchange = async e => {
  const f = e.target.files[0]; if (!f || !activeChatId) return;
  if (isGuest) return alert('Login karo!');
  const inp = $('msgIn');
  inp.placeholder = 'Uploading...'; inp.disabled = true;
  try {
    const fd = new FormData();
    fd.append('file', f); fd.append('username', currentUser.name); fd.append('uid', currentUser.uid);

    const d = await r.json();
    if (d.id) {
      await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
        text: '', imageUrl: `${WORKER_URL}/image/${d.id}`, from: currentUser.uid, fromName: currentUser.name, createdAt: serverTimestamp()
      });
      await setDoc(doc(db, 'chats', activeChatId), {
        lastMessage: '📷 Photo',
        lastMessageTime: Date.now(),
        lastSender: currentUser.uid,
        lastSenderName: currentUser.name
      }, { merge: true });
    }
  } catch (er) { alert('Error: ' + er.message); }
  inp.placeholder = 'Message...'; inp.disabled = false;
  $('chatImgIn').value = '';
};

function openMsgMenu(mid, txt) {
  selectedMsgId = mid; selectedMsgText = txt;
  $('msgMenu').classList.add('on');
  $('editOpt').style.display = txt ? 'flex' : 'none';
}
window.closeMsgMenu = () => $('msgMenu').classList.remove('on');

window.editMsg = async () => {
  if (!selectedMsgId) return;
  $('msgMenu').classList.remove('on');
  const n = prompt('Edit:', selectedMsgText);
  if (!n || !n.trim()) return;
  await updateDoc(doc(db, 'chats', activeChatId, 'messages', selectedMsgId), { text: n.trim(), edited: true });
  await setDoc(doc(db, 'chats', activeChatId), { lastMessage: n.trim(), lastMessageTime: Date.now() }, { merge: true });
};

window.deleteMsg = async () => {
  if (!selectedMsgId) return;
  $('msgMenu').classList.remove('on');
  if (!confirm('Delete?')) return;
  await deleteDoc(doc(db, 'chats', activeChatId, 'messages', selectedMsgId));
};

window.handleBackdrop = () => {
  if ($('msgMenu').classList.contains('on')) closeMsgMenu();
  else if ($('chatPanel').classList.contains('on')) closeChat();
};

window.closeMsg = () => {
  $('msgView').classList.remove('on');
  if (unsubMsgs) unsubMsgs();
  activeChatId = null;
};

// ===== CHAT LIST (UPDATED) =====
function loadChats() {
  if (unsubChats) unsubChats();
  const list = $('chatsList');
  const q = query(collection(db, 'chats'), where('users', 'array-contains', currentUser.uid));
  unsubChats = onSnapshot(q, snap => {
    list.innerHTML = '';
    if (snap.empty) {
      list.innerHTML = '<div class="pempty">Abhi koi chat nahi.<br>Search se kisi ko dhoondo!</div>';
      return;
    }
    const arr = [];
    snap.forEach(d => {
      const data = d.data();
      if (data.users && data.users.includes(currentUser.uid)) {
        arr.push({ id: d.id, ...data });
      }
    });
    arr.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
    arr.forEach(c => {
      const ou = c.users.find(u => u !== currentUser.uid);
      const on = c.usernames && c.usernames[ou] ? c.usernames[ou] : 'User';
      const isUnread = c.lastSender && c.lastSender !== currentUser.uid && c.lastSender !== 'system';
      const r = document.createElement('div');
      r.className = 'chatrow';
      r.onclick = () => startChat(ou, on);
      r.innerHTML = `
        <div class="avatar">${on[0].toUpperCase()}</div>
        <div class="cinfo">
          <div class="cname">${esc(on)}</div>
          <div class="cmsg" style="${isUnread ? 'color:#00ffaa;font-weight:600;' : ''}">${esc(c.lastMessage || 'Chat shuru karo...')}</div>
        </div>
        ${isUnread ? '<div style="width:8px;height:8px;background:#00ffaa;border-radius:50%;flex-shrink:0;"></div>' : ''}
      `;
      list.appendChild(r);
    });
  }, error => {
    console.error('Chat list error:', error);
    list.innerHTML = '<div class="pempty">Error: ' + error.message + '</div>';
  });
}

// ===== NOTIFICATION =====
function startNotif() {
  if (unsubNotif) unsubNotif();
  const q = query(collection(db, 'chats'), where('users', 'array-contains', currentUser.uid));
  unsubNotif = onSnapshot(q, snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type === 'modified') {
        const c = ch.doc.data();
        const chatId = ch.doc.id;
        if (
          chatId !== activeChatId &&
          c.lastSender &&
          c.lastSender !== currentUser.uid &&
          c.lastSender !== 'system' &&
          c.lastMessage
        ) {
          const ou = c.users.find(u => u !== currentUser.uid);
          const on = c.usernames && c.usernames[ou] ? c.usernames[ou] : 'User';
          showToast(on, c.lastMessage);
          $('chatDot').classList.add('on');
        }
      }
    });
  }, error => {
    console.error('Notification listener error:', error);
  });
}

function showToast(name, msg) {
  $('toastAvatar').textContent = name[0].toUpperCase();
  $('toastName').textContent = name;
  $('toastMsg').textContent = msg;
  $('toast').classList.add('on');
  setTimeout(() => $('toast').classList.remove('on'), 3500);
}

function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

window.changeUsername = async () => {
  const n = prompt('Naya username:', currentUser.name);
  if (!n) return;
  const c = n.trim().toLowerCase();
  if (c.length < 3 || !/^[a-z0-9_]+$/.test(c)) return alert('Invalid!');
  if (c === currentUser.name) return;
  const s = await getDoc(doc(db, 'usernames', c));
  if (s.exists()) return alert('Already taken!');
  await deleteDoc(doc(db, 'usernames', currentUser.name));
  await setDoc(doc(db, 'usernames', c), { uid: currentUser.uid, email: currentUser.email, createdAt: Date.now() });
  await setDoc(doc(db, 'users', currentUser.uid), { username: c }, { merge: true });
  await updateProfile(auth.currentUser, { displayName: c });
  currentUser.name = c;
  $('profileName').textContent = c;
  alert('Done! ✅');
};

window.changeProfilePic = () => $('profilePicIn').click();

$('profilePicIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData();
  fd.append('file', f); fd.append('username', currentUser.name); fd.append('uid', 'profile_' + currentUser.uid);
  try {
    const r = await fetch(`${WORKER_URL}/upload`, { method: 'POST', body: fd });
    const d = await r.json();
    if (d.id) {
      const url = `${WORKER_URL}/image/${d.id}`;
      await setDoc(doc(db, 'users', currentUser.uid), { profilePic: url }, { merge: true });
      $('profilePic').innerHTML = `<img src="${url}">`;
      alert('Profile pic updated! ✅');
    }
  } catch (er) { alert('Error: ' + er.message); }
  $('profilePicIn').value = '';
};

// ===== AUTH STATE =====
onAuthStateChanged(auth, async u => {
  if (u) {
    isGuest = false;
    let name = u.displayName;
    if (!name) {
      const s = await getDocs(collection(db, 'usernames'));
      s.forEach(d => { if (d.data().uid === u.uid) name = d.id; });
      if (!name) name = u.email.split('@')[0];
      await updateProfile(u, { displayName: name });
    }
    currentUser = { uid: u.uid, email: u.email, name };
    $('loginScreen').classList.add('hide');
    $('app').classList.add('on');
    loadImages();
    loadChats();
    startNotif();
  } else if (!isGuest) {
    currentUser = null;
    $('loginScreen').classList.remove('hide');
    $('app').classList.remove('on');
  }
});
</script>
