<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISHNTT - Image Share</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #0f0f0f; color: #fff; min-height: 100vh; }

header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #1f1f1f; position: sticky; top: 0; background: #0f0f0f; z-index: 10; }
.logo { font-size: 22px; font-weight: 800; color: #00ffaa; letter-spacing: 1px; }
.header-actions { display: flex; align-items: center; gap: 10px; }
.user-badge { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 8px 14px; border-radius: 20px; font-size: 13px; color: #00ffaa; font-weight: 600; cursor: pointer; }
.user-badge.guest { color: #888; }
.logout-btn { background: #ff3355; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
.upload-btn { background: #00ffaa; color: #000; padding: 10px 20px; border-radius: 25px; font-weight: 700; cursor: pointer; border: none; font-size: 14px; }
.upload-btn:active { transform: scale(0.96); }
#fileInput { display: none; }

.limit-warn { color: #ffaa00; font-size: 11px; font-weight: 600; }

.container { max-width: 1100px; margin: 0 auto; padding: 20px; }

.empty { text-align: center; padding: 80px 20px; color: #666; }
.empty h3 { font-size: 18px; color: #888; margin-bottom: 6px; }

.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 640px) { .gallery { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .gallery { grid-template-columns: repeat(4, 1fr); } }

.card { background: #1a1a1a; border-radius: 12px; border: 1px solid #2a2a2a; overflow: hidden; }
.card-img-wrap { position: relative; }
.card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #222; }
.card-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #00ffaa; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
.card-body { padding: 10px; }
.uploader { font-size: 12px; color: #00ffaa; font-weight: 600; margin-bottom: 6px; }
.caption { font-size: 12px; color: #ccc; margin-bottom: 8px; word-break: break-word; }
.actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.action-btns { display: flex; gap: 6px; }
.icon-btn { background: #252525; border: 1px solid #333; color: #ccc; width: 28px; height: 28px; border-radius: 50%; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.icon-btn.del { color: #ff5577; }
.comment-count { color: #888; font-size: 12px; }
.comments { max-height: 100px; overflow-y: auto; margin-top: 6px; }
.comment { background: #252525; padding: 5px 8px; border-radius: 8px; font-size: 11px; margin-bottom: 4px; color: #ccc; word-break: break-word; }
.comment b { color: #00ffaa; }
.comment-input { display: flex; gap: 4px; margin-top: 6px; }
.comment-input input { flex: 1; background: #252525; border: 1px solid #333; color: #fff; padding: 6px 10px; border-radius: 15px; font-size: 12px; outline: none; }
.comment-input input:focus { border-color: #00ffaa; }
.comment-input button { background: #00ffaa; color: #000; border: none; padding: 6px 12px; border-radius: 15px; font-size: 11px; font-weight: 700; cursor: pointer; }
.comment-input input:disabled, .comment-input button:disabled { opacity: 0.4; cursor: not-allowed; }

.loading { display: none; text-align: center; padding: 20px; color: #00ffaa; font-weight: 600; font-size: 14px; }

/* ===== AUTH MODAL ===== */
.auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
.auth-overlay.active { display: flex; }
.auth-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 380px; }
.auth-box h2 { font-size: 22px; margin-bottom: 6px; color: #fff; font-weight: 800; }
.auth-box .sub { font-size: 13px; color: #888; margin-bottom: 20px; }

.auth-tabs { display: flex; gap: 4px; margin-bottom: 18px; background: #0f0f0f; padding: 4px; border-radius: 10px; }
.auth-tab { flex: 1; padding: 8px; border: none; background: transparent; color: #888; font-weight: 700; font-size: 13px; cursor: pointer; border-radius: 7px; }
.auth-tab.active { background: #00ffaa; color: #000; }

.auth-box input { width: 100%; background: #0f0f0f; border: 1px solid #333; color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 14px; outline: none; margin-bottom: 10px; }
.auth-box input:focus { border-color: #00ffaa; }

.auth-box .primary-btn { width: 100%; background: #00ffaa; color: #000; border: none; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; margin-bottom: 8px; }
.auth-box .google-btn { width: 100%; background: #fff; color: #000; border: none; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.auth-box .skip-btn { width: 100%; background: transparent; color: #888; border: 1px solid #333; padding: 11px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.auth-box .skip-btn:hover { color: #fff; border-color: #555; }

.error-msg { color: #ff4466; font-size: 12px; margin-bottom: 10px; display: none; padding: 8px 12px; background: rgba(255,68,102,0.1); border-radius: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">ISHNTT</div>
  <div class="header-actions">
    <span class="limit-warn" id="limitWarn"></span>
    <span class="user-badge" id="userBadge">👤 Guest</span>
    <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
    <button class="upload-btn" onclick="handleUploadClick()">+ Post</button>
  </div>
  <input type="file" id="fileInput" accept="image/*">
</header>

<div class="container">
  <div id="loading" class="loading">⏳ Uploading...</div>
  <div id="emptyMsg" class="empty">
    <h3>Abhi koi image nahi hai</h3>
    <p>"+ Post" dabao aur apni pehli image upload karo!</p>
  </div>
  <div class="gallery" id="gallery"></div>
</div>

<!-- AUTH MODAL -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h2 id="authTitle">Welcome to ISHNTT</h2>
    <p class="sub" id="authSubtitle">Login karo ya naya account banao</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="setMode(true)">Login</button>
      <button class="auth-tab" id="signupTab" onclick="setMode(false)">Sign Up</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <input type="text" id="usernameInput" placeholder="Username (unique)" style="display:none;">
    <input type="email" id="emailInput" placeholder="Email address">
    <input type="password" id="passwordInput" placeholder="Password (min 6 chars)">

    <button class="primary-btn" id="authBtn" onclick="handleAuth()">Login</button>

    <button class="google-btn" onclick="googleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="G">
      Continue with Google
    </button>

    <button class="skip-btn" onclick="skipAuth()">Skip for now →</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJkg8OOu3szJmBnvbbND6BJYT_9aQVExg",
  authDomain: "ishntt-f8b74.firebaseapp.com",
  projectId: "ishntt-f8b74",
  storageBucket: "ishntt-f8b74.firebasestorage.app",
  messagingSenderId: "1002308007099",
  appId: "1:1002308007099:web:ed0f89596a74f522bba59e",
  measurementId: "G-7L1X880XLS"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

const WORKER_URL = "https://ishntbot.ishantgiri2004g.workers.dev";
const fileInput = document.getElementById('fileInput');
const gallery = document.getElementById('gallery');
const loading = document.getElementById('loading');
const emptyMsg = document.getElementById('emptyMsg');
const authOverlay = document.getElementById('authOverlay');
const userBadge = document.getElementById('userBadge');
const logoutBtn = document.getElementById('logoutBtn');
const errorMsg = document.getElementById('errorMsg');
const limitWarn = document.getElementById('limitWarn');
const usernameInput = document.getElementById('usernameInput');

let currentUser = null;
let isLoginMode = true;
const GUEST_LIMIT = 10;

function getGuestCount() { return parseInt(localStorage.getItem('ishntt_guest_uploads') || '0'); }
function incGuestCount() { localStorage.setItem('ishntt_guest_uploads', getGuestCount() + 1); updateLimit(); }
function updateLimit() {
  if (currentUser) { limitWarn.textContent = ''; return; }
  const used = getGuestCount();
  limitWarn.textContent = used >= GUEST_LIMIT ? '⚠️ Limit khatam' : `Guest: ${used}/${GUEST_LIMIT}`;
}

window.openAuth = function() {
  authOverlay.classList.add('active');
  errorMsg.style.display = 'none';
  usernameInput.style.display = isLoginMode ? 'none' : 'block';
};

window.skipAuth = function() {
  authOverlay.classList.remove('active');
  userBadge.textContent = '👤 Guest';
  userBadge.classList.add('guest');
  updateLimit();
  loadAllImages();
};

window.setMode = function(loginMode) {
  isLoginMode = loginMode;
  document.getElementById('loginTab').classList.toggle('active', loginMode);
  document.getElementById('signupTab').classList.toggle('active', !loginMode);
  document.getElementById('authTitle').textContent = loginMode ? 'Welcome Back' : 'Create Account';
  document.getElementById('authSubtitle').textContent = loginMode ? 'Login karo apne account me' : 'Naya account banao, free hai';
  document.getElementById('authBtn').textContent = loginMode ? 'Login' : 'Sign Up';
  usernameInput.style.display = loginMode ? 'none' : 'block';
  errorMsg.style.display = 'none';
};

window.handleAuth = async function() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const username = usernameInput.value.trim().toLowerCase();
  errorMsg.style.display = 'none';

  if (!email || !password) { showError('Email aur password dono daalo!'); return; }
  if (password.length < 6) { showError('Password kam se kam 6 characters!'); return; }

  if (!isLoginMode) {
    if (!username) { showError('Username daalo!'); return; }
    if (username.length < 3) { showError('Username kam se kam 3 characters!'); return; }
    if (!/^[a-z0-9_]+$/.test(username)) { showError('Sirf small letters, numbers, _ allowed!'); return; }
    try {
      const snap = await getDoc(doc(db, 'usernames', username));
      if (snap.exists()) { showError('Ye username already le liya gaya hai!'); return; }
    } catch (e) { showError('Check fail: ' + e.message); return; }
  }

  try {
    if (isLoginMode) {
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, 'usernames', username), { uid: cred.user.uid, email: cred.user.email, createdAt: Date.now() });
      await updateProfile(cred.user, { displayName: username });
    }
    document.getElementById('emailInput').value = '';
    document.getElementById('passwordInput').value = '';
    usernameInput.value = '';
  } catch (err) {
    showError(err.message.replace('Firebase: ', ''));
  }
};

window.googleLogin = async function() {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    const user = result.user;
    const baseUsername = (user.displayName || user.email.split('@')[0]).toLowerCase().replace(/[^a-z0-9_]/g, '');
    const snap = await getDoc(doc(db, 'usernames', baseUsername));
    if (!snap.exists()) {
      await setDoc(doc(db, 'usernames', baseUsername), { uid: user.uid, email: user.email, createdAt: Date.now() });
      if (!user.displayName) await updateProfile(user, { displayName: baseUsername });
    }
  } catch (err) { showError(err.message); }
};

window.logout = async function() { await signOut(auth); };

window.handleBadgeClick = function() {
  if (!currentUser) openAuth();
  else changeUsername();
};

window.changeUsername = async function() {
  const newU = prompt('Naya username daalo:', currentUser.name);
  if (!newU) return;
  const clean = newU.trim().toLowerCase();
  if (clean.length < 3) { alert('Kam se kam 3 characters!'); return; }
  if (!/^[a-z0-9_]+$/.test(clean)) { alert('Sirf small letters, numbers, _ !'); return; }
  if (clean === currentUser.name) return;
  try {
    const snap = await getDoc(doc(db, 'usernames', clean));
    if (snap.exists()) { alert('Ye username already le liya gaya hai!'); return; }
    await deleteDoc(doc(db, 'usernames', currentUser.name));
    await setDoc(doc(db, 'usernames', clean), { uid: currentUser.uid, email: currentUser.email, createdAt: Date.now() });
    await updateProfile(auth.currentUser, { displayName: clean });
    currentUser.name = clean;
    userBadge.textContent = '👤 ' + clean;
    alert('Username change ho gaya! ✅');
  } catch (e) { alert('Fail: ' + e.message); }
};

window.handleUploadClick = function() {
  if (!currentUser && getGuestCount() >= GUEST_LIMIT) {
    alert('10 uploads ki limit khatam. Login karo!');
    openAuth();
    return;
  }
  fileInput.click();
};

function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; }

// ===== UPLOAD =====
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!currentUser && getGuestCount() >= GUEST_LIMIT) { alert('Limit khatam. Login karo!'); openAuth(); return; }

  loading.style.display = 'block';
  emptyMsg.style.display = 'none';
  const fd = new FormData();
  fd.append('file', file);
  fd.append('username', currentUser ? currentUser.name : 'Guest');
  fd.append('uid', currentUser ? currentUser.uid : 'guest_' + Date.now());

  try {
    const res = await fetch(`${WORKER_URL}/upload`, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.id) { if (!currentUser) incGuestCount(); setTimeout(loadAllImages, 800); }
    else alert('Upload fail: ' + (data.error || 'Unknown'));
  } catch (err) { alert('Error: ' + err.message); }
  finally { loading.style.display = 'none'; fileInput.value = ''; }
});

// ===== GALLERY =====
async function loadAllImages() {
  try {
    const res = await fetch(`${WORKER_URL}/list`);
    const data = await res.json();
    gallery.innerHTML = '';
    if (data.images && data.images.length > 0) {
      emptyMsg.style.display = 'none';
      data.images.forEach(img => renderCard(img));
    } else emptyMsg.style.display = 'block';
  } catch (err) { console.error(err); }
}

function renderCard(img) {
  const isOwner = currentUser && img.uid === currentUser.uid;
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card_' + img.id;

  let actionsHTML = '';
  if (isOwner) {
    actionsHTML = `
      <div class="action-btns">
        <button class="icon-btn" onclick="editCaption('${img.id}')">✏️</button>
        <button class="icon-btn del" onclick="deleteImage('${img.id}')">🗑</button>
      </div>
    `;
  }
  const canComment = currentUser !== null;

  card.innerHTML = `
    <div class="card-img-wrap">
      <img src="${WORKER_URL}/image/${img.id}" loading="lazy" alt="image">
      ${isOwner ? '<span class="card-badge">Yours</span>' : ''}
    </div>
    <div class="card-body">
      <div class="uploader">📷 ${escapeHtml(img.username || 'Unknown')}</div>
      <div class="caption" id="caption_${img.id}">${escapeHtml(img.caption || '')}</div>
      <div class="actions">
        ${actionsHTML}
        <span class="comment-count">💬 ${img.comments.length}</span>
      </div>
      <div class="comments" id="comments_${img.id}">
        ${img.comments.map(c => `<div class="comment"><b>${escapeHtml(c.username || 'Anon')}:</b> ${escapeHtml(c.text)}</div>`).join('')}
      </div>
      <div class="comment-input">
        <input type="text" id="input_${img.id}" placeholder="${canComment ? 'Comment...' : 'Login to comment'}" ${canComment ? '' : 'disabled'}>
        <button onclick="addComment('${img.id}')" ${canComment ? '' : 'disabled'}>Post</button>
      </div>
    </div>
  `;
  gallery.appendChild(card);
}

window.deleteImage = async function(id) {
  if (!confirm('Delete kar dein?')) return;
  try { await fetch(`${WORKER_URL}/delete/${id}`, { method: 'DELETE' }); document.getElementById('card_' + id).remove(); }
  catch (err) { alert('Delete fail'); }
};

window.editCaption = async function(id) {
  const el = document.getElementById('caption_' + id);
  const newCap = prompt('Naya caption:', el.textContent);
  if (newCap === null) return;
  try {
    await fetch(`${WORKER_URL}/edit/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caption: newCap }) });
    el.textContent = newCap;
  } catch (err) { alert('Edit fail'); }
};

window.addComment = async function(id) {
  if (!currentUser) { openAuth(); return; }
  const input = document.getElementById('input_' + id);
  const text = input.value.trim();
  if (!text) return;
  try {
    const res = await fetch(`${WORKER_URL}/comment/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, username: currentUser.name }) });
    const data = await res.json();
    if (data.success) {
      input.value = '';
      const cDiv = document.getElementById('comments_' + id);
      const div = document.createElement('div');
      div.className = 'comment';
      div.innerHTML = `<b>${escapeHtml(currentUser.name)}:</b> ${escapeHtml(text)}`;
      cDiv.appendChild(div);
      document.querySelector(`#card_${id} .comment-count`).textContent = '💬 ' + data.comments.length;
    }
  } catch (err) { alert('Comment fail'); }
};

function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text || ''; return d.innerHTML; }

// ===== AUTH STATE =====
onAuthStateChanged(auth, async (user) => {
  if (user) {
    let name = user.displayName || user.email.split('@')[0];
    currentUser = { uid: user.uid, email: user.email, name };
    userBadge.textContent = '👤 ' + name;
    userBadge.classList.remove('guest');
    logoutBtn.style.display = 'inline-block';
    authOverlay.classList.remove('active');
    updateLimit();
    loadAllImages();
  } else {
    currentUser = null;
    userBadge.textContent = '👤 Guest';
    userBadge.classList.add('guest');
    logoutBtn.style.display = 'none';
    updateLimit();
    openAuth();
  }
});

// Badge pe click
userBadge.addEventListener('click', handleBadgeClick);
</script>

</body>
</html>
