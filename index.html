<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISHNTTCHAT</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #000; color: #fff; height: 100vh; overflow: hidden; position: relative; }

/* Animated Gradient Background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 30%, rgba(0, 255, 170, 0.15), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 150, 255, 0.15), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255, 0, 150, 0.08), transparent 60%),
    #000;
  z-index: -1;
  animation: bgMove 20s ease-in-out infinite;
}
@keyframes bgMove {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* Glass Base */
.glass {
  background: rgba(30, 30, 30, 0.5);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
}
.glass-strong {
  background: rgba(20, 20, 20, 0.7);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

/* LOGIN */
#loginScreen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
#loginScreen.hide { display: none; }
.login-box { 
  width: 100%; max-width: 360px; padding: 32px 26px;
  background: rgba(20, 20, 20, 0.6);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.login-box h1 { font-size: 30px; font-weight: 800; letter-spacing: -1px; margin-bottom: 4px; }
.login-box h1 span { 
  background: linear-gradient(135deg, #00ffaa, #00ccff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.login-box .sub { font-size: 12px; color: #888; margin-bottom: 26px; font-weight: 500; }
.tabs { 
  display: flex; padding: 4px; margin-bottom: 18px;
  background: rgba(0, 0, 0, 0.4);
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.tab { flex: 1; padding: 10px; border: none; background: transparent; color: #777; font-weight: 700; font-size: 13px; border-radius: 10px; cursor: pointer; transition: all 0.25s; }
.tab.on { 
  background: linear-gradient(135deg, #00ffaa, #00ccaa);
  color: #000;
  box-shadow: 0 4px 12px rgba(0, 255, 170, 0.3);
}
input.field { 
  width: 100%; padding: 14px 16px; margin-bottom: 10px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff; font-size: 14px; border-radius: 14px; outline: none; transition: all 0.25s;
  -webkit-backdrop-filter: blur(10px);
}
input.field:focus { border-color: rgba(0, 255, 170, 0.5); background: rgba(0, 255, 170, 0.05); }
input.field::placeholder { color: #666; }

.btn { 
  width: 100%; padding: 14px; border: none; border-radius: 14px;
  font-size: 14px; font-weight: 800; cursor: pointer; margin-bottom: 10px;
  transition: all 0.2s;
}
.btn:active { transform: scale(0.97); }
.btn-green { 
  background: linear-gradient(135deg, #00ffaa, #00ccaa);
  color: #000;
  box-shadow: 0 8px 24px rgba(0, 255, 170, 0.25);
}
.btn-white { 
  background: rgba(255, 255, 255, 0.95);
  color: #000;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 700; font-size: 13px;
}
.btn-ghost { 
  background: rgba(255, 255, 255, 0.05);
  color: #aaa;
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-weight: 600; font-size: 13px;
}
.err { color: #ff5577; font-size: 12px; margin-bottom: 10px; display: none; padding: 10px 12px; background: rgba(255, 85, 119, 0.1); border-radius: 10px; border: 1px solid rgba(255, 85, 119, 0.2); }

/* APP HEADER */
#app { display: none; height: 100vh; flex-direction: column; }
#app.on { display: flex; }
header { 
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: rgba(15, 15, 15, 0.5);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  position: relative; z-index: 10;
}
.logo { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { 
  background: linear-gradient(135deg, #00ffaa, #00ccff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.h-actions { display: flex; gap: 8px; align-items: center; }

.iconbtn { 
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff; width: 38px; height: 38px; border-radius: 50%;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; position: relative;
}
.iconbtn:hover { background: rgba(0, 255, 170, 0.15); border-color: rgba(0, 255, 170, 0.3); }
.iconbtn:active { transform: scale(0.92); }
.iconbtn .dot { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: #ff3355; display: none; box-shadow: 0 0 8px #ff3355; }
.iconbtn .dot.on { display: block; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.postbtn { 
  background: linear-gradient(135deg, #00ffaa, #00ccaa);
  color: #000; border: none; padding: 10px 18px; border-radius: 22px;
  font-weight: 800; font-size: 13px; cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 255, 170, 0.3);
  transition: all 0.2s;
}
.postbtn:active { transform: scale(0.95); }

.userbtn { 
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #00ffaa; padding: 8px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 700; cursor: pointer;
}
.logoutbtn { 
  background: rgba(255, 51, 85, 0.9);
  color: #fff; border: none; padding: 8px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 700; cursor: pointer; display: none;
}

/* GALLERY */
#gallery { flex: 1; overflow-y: auto; padding: 14px; position: relative; z-index: 1; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }

.gcard { 
  background: rgba(25, 25, 25, 0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px; overflow: hidden;
  transition: all 0.25s;
}
.gcard:hover { border-color: rgba(0, 255, 170, 0.3); transform: translateY(-2px); }
.gcard img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
.gcard .gbody { padding: 10px; }
.gcard .gname { font-size: 11px; color: #00ffaa; font-weight: 700; margin-bottom: 4px; }
.gcard .gcap { font-size: 11px; color: #999; margin-bottom: 6px; line-height: 1.3; }
.gcard .grow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.gcard .gbtn { 
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #ccc; width: 26px; height: 26px; border-radius: 50%;
  font-size: 11px; cursor: pointer; transition: all 0.2s;
}
.gcard .gbtn:hover { background: rgba(0, 255, 170, 0.15); color: #00ffaa; }
.gcard .gbtn.d:hover { background: rgba(255, 85, 119, 0.15); color: #ff5577; }
.gcard .gcnt { font-size: 10px; color: #666; }
.gcard .gcmts { max-height: 80px; overflow-y: auto; margin-bottom: 4px; }
.gcard .gcmt { 
  background: rgba(0, 0, 0, 0.3);
  padding: 5px 8px; border-radius: 8px; font-size: 10px;
  margin-bottom: 3px; color: #bbb;
}
.gcard .gcmt b { color: #00ffaa; }
.gcard .gcinput { display: flex; gap: 4px; }
.gcard .gcinput input { 
  flex: 1; background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: #fff; padding: 6px 10px; border-radius: 10px;
  font-size: 11px; outline: none;
}
.gcard .gcinput input:focus { border-color: rgba(0, 255, 170, 0.4); }
.gcard .gcinput button { 
  background: linear-gradient(135deg, #00ffaa, #00ccaa);
  color: #000; border: none; padding: 6px 10px; border-radius: 10px;
  font-size: 10px; font-weight: 700; cursor: pointer;
}
.empty { text-align: center; padding: 60px 20px; color: #555; font-size: 14px; line-height: 1.6; }

/* CHAT PANEL */
#chatPanel { 
  position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh;
  background: rgba(15, 15, 15, 0.85);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border-left: 1px solid rgba(255, 255, 255, 0.1);
  z-index: 200; display: flex; flex-direction: column;
  transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
#chatPanel.on { right: 0; }
.phead { 
  display: flex; align-items: center; gap: 10px; padding: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.pback { 
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff; width: 34px; height: 34px; border-radius: 50%;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.pback:active { transform: scale(0.92); }
.phead h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.ptabs { display: flex; padding: 8px 12px; gap: 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
.ptab { 
  flex: 1; padding: 9px; text-align: center;
  color: #777; font-weight: 700; font-size: 12px;
  cursor: pointer; border-radius: 10px; transition: all 0.2s;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid transparent;
}
.ptab.on { 
  background: rgba(0, 255, 170, 0.15);
  color: #00ffaa;
  border-color: rgba(0, 255, 170, 0.3);
}
.plist { flex: 1; overflow-y: auto; padding: 6px 0; }
.chatrow { 
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; cursor: pointer;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  transition: background 0.2s;
}
.chatrow:hover { background: rgba(255, 255, 255, 0.04); }
.avatar { 
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, #00ffaa, #00ccff);
  color: #000; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(0, 255, 170, 0.2);
}
.chatrow .cinfo { flex: 1; min-width: 0; }
.chatrow .cname { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.chatrow .cmsg { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.searchbox { padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
.searchbox input { 
  width: 100%; background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff; padding: 11px 16px; border-radius: 22px;
  font-size: 13px; outline: none;
}
.searchbox input:focus { border-color: rgba(0, 255, 170, 0.5); }
.userrow { 
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; cursor: pointer;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  transition: background 0.2s;
}
.userrow:hover { background: rgba(255, 255, 255, 0.04); }
.userrow .uname { font-size: 13px; font-weight: 700; flex: 1; }
.userrow .uchat { color: #00ffaa; font-size: 11px; font-weight: 700; }
.pempty { text-align: center; padding: 40px 20px; color: #555; font-size: 12px; line-height: 1.7; }

/* MSG VIEW */
#msgView { 
  position: fixed; inset: 0;
  background: rgba(10, 10, 10, 0.92);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  z-index: 300; display: none; flex-direction: column;
}
#msgView.on { display: flex; }
.mhead { 
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(15, 15, 15, 0.6);
  backdrop-filter: blur(20px);
}
.mhead .avatar { width: 38px; height: 38px; font-size: 14px; }
.mhead .mname { font-size: 14px; font-weight: 700; }
.mhead .mstatus { font-size: 10px; color: #00ffaa; display: flex; align-items: center; gap: 4px; }
.mhead .mstatus::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #00ffaa; box-shadow: 0 0 6px #00ffaa; }

#msgBody { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; }

.msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 100%; }
.msg-row.me { justify-content: flex-end; }
.msg { 
  max-width: 75%; padding: 10px 14px; border-radius: 20px;
  font-size: 13px; line-height: 1.45; word-break: break-word;
  position: relative;
}
.msg.me { 
  background: linear-gradient(135deg, #00ffaa, #00ccaa);
  color: #000; border-bottom-right-radius: 6px;
  box-shadow: 0 4px 12px rgba(0, 255, 170, 0.2);
}
.msg.you { 
  background: rgba(40, 40, 40, 0.85);
  backdrop-filter: blur(20px);
  color: #fff; border-bottom-left-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.msg .mtime { font-size: 9px; opacity: 0.55; margin-top: 3px; display: block; text-align: right; }
.msg .medit { font-size: 9px; opacity: 0.55; margin-right: 4px; font-style: italic; }
.msg img { max-width: 100%; border-radius: 12px; margin-bottom: 4px; display: block; cursor: pointer; }

/* Message action button */
.msg-action {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
  width: 30px; height: 30px; border-radius: 50%;
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  opacity: 0.7;
  transition: all 0.2s;
}
.msg-action:hover { opacity: 1; background: rgba(0, 255, 170, 0.2); }
.msg-action:active { transform: scale(0.9); }

.mbottom { 
  display: flex; gap: 8px; padding: 12px 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(15, 15, 15, 0.6);
  backdrop-filter: blur(20px);
  align-items: center;
}
.mbottom .attach { 
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #00ffaa; width: 42px; height: 42px; border-radius: 50%;
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.mbottom .attach:active { transform: scale(0.92); }
.mbottom input { 
  flex: 1; background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff; padding: 12px 18px; border-radius: 24px;
  font-size: 13px; outline: none;
}
.mbottom input:focus { border-color: rgba(0, 255, 170, 0.5); }
.mbottom .send { 
  background: linear-gradient(135deg, #00ffaa, #00ccaa);
  color: #000; border: none; width: 42px; height: 42px;
  border-radius: 50%; font-size: 16px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 12px rgba(0, 255, 170, 0.3);
  transition: all 0.2s;
}
.mbottom .send:active { transform: scale(0.92); }

/* MSG MENU (Action Sheet) */
#msgMenu { 
  position: fixed; left: 50%; bottom: -100%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 400px;
  background: rgba(25, 25, 25, 0.9);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px 20px 0 0;
  padding: 8px;
  z-index: 500;
  transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
}
#msgMenu.on { bottom: 0; }
#msgMenu .handle {
  width: 40px; height: 4px; background: rgba(255, 255, 255, 0.2);
  border-radius: 4px; margin: 4px auto 12px;
}
#msgMenu button { 
  width: 100%; background: rgba(255, 255, 255, 0.04);
  border: none; color: #fff; padding: 16px;
  text-align: left; font-size: 15px; font-weight: 600;
  cursor: pointer; border-radius: 14px; margin-bottom: 6px;
  display: flex; align-items: center; gap: 12px;
  transition: all 0.2s;
}
#msgMenu button:hover { background: rgba(255, 255, 255, 0.08); }
#msgMenu button.d { color: #ff5577; }
#msgMenu button.d:hover { background: rgba(255, 85, 119, 0.12); }
#msgMenu button .ic { font-size: 18px; width: 24px; text-align: center; }

/* BACKDROP */
#backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); z-index: 150; display: none; }
#backdrop.on { display: block; }

/* TOAST */
#toast { 
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-100px);
  background: rgba(25, 25, 25, 0.9);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(0, 255, 170, 0.3);
  padding: 12px 16px; border-radius: 16px;
  z-index: 600; display: flex; gap: 10px; align-items: center;
  max-width: calc(100% - 32px); min-width: 280px;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 10px 40px rgba(0, 255, 170, 0.15);
}
#toast.on { transform: translateX(-50%) translateY(0); }
#toast .tinfo { flex: 1; min-width: 0; }
#toast .tname { font-size: 12px; color: #00ffaa; font-weight: 700; margin-bottom: 2px; }
#toast .tmsg { font-size: 12px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* IMG VIEWER */
#imgViewer { 
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.97);
  backdrop-filter: blur(20px);
  z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px;
}
#imgViewer.on { display: flex; }
#imgViewer img { max-width: 100%; max-height: 90vh; border-radius: 16px; }
#imgViewer .x { 
  position: absolute; top: 16px; right: 16px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff; width: 40px; height: 40px; border-radius: 50%;
  font-size: 18px; cursor: pointer;
}

@media (max-width: 640px) { #chatPanel { max-width: 100%; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>ISHNTT<span>CHAT</span></h1>
    <p class="sub">Share. Chat. Connect.</p>
    <div class="err" id="err"></div>
    <div class="tabs">
      <button class="tab on" id="tabLogin" onclick="setMode(true)">Login</button>
      <button class="tab" id="tabSignup" onclick="setMode(false)">Sign Up</button>
    </div>
    <input type="text" class="field" id="inUser" placeholder="Username (unique)" style="display:none;">
    <input type="email" class="field" id="inEmail" placeholder="Email">
    <input type="password" class="field" id="inPass" placeholder="Password (min 6)">
    <button class="btn btn-green" id="authBtn" onclick="doAuth()">Login</button>
    <button class="btn btn-white" onclick="doGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" height="16" alt="G">
      Continue with Google
    </button>
    <button class="btn btn-ghost" onclick="doSkip()">Skip for now →</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="logo">ISHNTT<span>CHAT</span></div>
    <div class="h-actions">
      <span class="userbtn" id="userBtn">👤 Guest</span>
      <button class="logoutbtn" id="logoutBtn" onclick="doLogout()">Logout</button>
      <button class="iconbtn" onclick="openChat()">💬<span class="dot" id="chatDot"></span></button>
      <button class="postbtn" onclick="pickImage()">+ Post</button>
    </div>
  </header>
  <div id="gallery">
    <div class="empty" id="gEmpty">Abhi koi image nahi hai<br>"+ Post" dabao aur upload karo!</div>
    <div class="grid" id="gGrid"></div>
  </div>
  <input type="file" id="fileIn" accept="image/*" style="display:none;">
  <input type="file" id="chatImgIn" accept="image/*" style="display:none;">
</div>

<!-- CHAT PANEL -->
<div id="backdrop" onclick="closeChat()"></div>
<div id="chatPanel">
  <div class="phead">
    <button class="pback" onclick="closeChat()">←</button>
    <h2>Chats</h2>
  </div>
  <div class="ptabs">
    <div class="ptab on" id="ptabChats" onclick="switchTab('chats')">💬 Chats</div>
    <div class="ptab" id="ptabSearch" onclick="switchTab('search')">🔍 Search</div>
  </div>
  <div class="plist" id="chatsList">
    <div class="pempty" id="chatsEmpty">Abhi koi chat nahi.<br>Search se kisi ko dhoondo!</div>
  </div>
  <div class="plist" id="searchList" style="display:none;">
    <div class="searchbox">
      <input type="text" id="searchIn" placeholder="Username search..." oninput="searchUsers(this.value)">
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<!-- MSG VIEW -->
<div id="msgView">
  <div class="mhead">
    <button class="pback" onclick="closeMsg()">←</button>
    <div class="avatar" id="mAvatar">U</div>
    <div>
      <div class="mname" id="mName">User</div>
      <div class="mstatus">online</div>
    </div>
  </div>
  <div id="msgBody"></div>
  <div class="mbottom">
    <button class="attach" onclick="document.getElementById('chatImgIn').click()">📎</button>
    <input type="text" id="msgIn" placeholder="Message..." onkeypress="if(event.key==='Enter')sendMsg()">
    <button class="send" onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- MSG MENU -->
<div id="msgMenu">
  <div class="handle"></div>
  <button id="editOpt" onclick="editMsg()"><span class="ic">✏️</span> Edit Message</button>
  <button class="d" onclick="deleteMsg()"><span class="ic">🗑</span> Delete Message</button>
</div>

<!-- IMG VIEWER -->
<div id="imgViewer" onclick="closeImg()">
  <button class="x" onclick="closeImg()">✕</button>
  <img id="imgViewerImg" src="" alt="Image" onclick="event.stopPropagation()">
</div>

<!-- TOAST -->
<div id="toast">
  <div class="avatar" id="toastAvatar">U</div>
  <div class="tinfo">
    <div class="tname" id="toastName">User</div>
    <div class="tmsg" id="toastMsg">Hello</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJkg8OOu3szJmBnvbbND6BJYT_9aQVExg",
  authDomain: "ishntt-f8b74.firebaseapp.com",
  projectId: "ishntt-f8b74",
  storageBucket: "ishntt-f8b74.firebasestorage.app",
  messagingSenderId: "1002308007099",
  appId: "1:1002308007099:web:ed0f89596a74f522bba59e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();
const WORKER_URL = "https://ishntbot.ishantgiri2004g.workers.dev";

let currentUser = null, isGuest = false, isLoginMode = true;
let activeChatId = null, activeChatUser = null;
let unsubMsgs = null, unsubChats = null, unsubNotif = null;
let selectedMsgId = null, selectedMsgText = '';
const GUEST_LIMIT = 10;

const $ = id => document.getElementById(id);
const guestCount = () => parseInt(localStorage.getItem('ishntt_gu') || '0');
const incGuest = () => { localStorage.setItem('ishntt_gu', guestCount() + 1); };

// ===== AUTH =====
window.setMode = m => {
  isLoginMode = m;
  $('tabLogin').classList.toggle('on', m);
  $('tabSignup').classList.toggle('on', !m);
  $('authBtn').textContent = m ? 'Login' : 'Sign Up';
  $('inUser').style.display = m ? 'none' : 'block';
  $('err').style.display = 'none';
};

window.doAuth = async () => {
  const email = $('inEmail').value.trim(), pass = $('inPass').value, user = $('inUser').value.trim().toLowerCase();
  $('err').style.display = 'none';
  if (!email || !pass) return showErr('Email aur password daalo!');
  if (pass.length < 6) return showErr('Password min 6 chars!');
  if (!isLoginMode) {
    if (!user) return showErr('Username daalo!');
    if (user.length < 3 || !/^[a-z0-9_]+$/.test(user)) return showErr('Username: small letters, numbers, _ only!');
    const s = await getDoc(doc(db, 'usernames', user));
    if (s.exists()) return showErr('Ye username already le liya gaya hai!');
  }
  try {
    if (isLoginMode) await signInWithEmailAndPassword(auth, email, pass);
    else {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, 'usernames', user), { uid: c.user.uid, email, createdAt: Date.now() });
      await updateProfile(c.user, { displayName: user });
    }
  } catch (e) { showErr(e.message.replace('Firebase: ', '')); }
};

window.doGoogle = async () => {
  try {
    const r = await signInWithPopup(auth, googleProvider);
    const u = r.user;
    let base = (u.displayName || u.email.split('@')[0]).toLowerCase().replace(/[^a-z0-9_]/g, '');
    let s = await getDoc(doc(db, 'usernames', base));
    if (s.exists() && s.data().uid !== u.uid) base = base + '_' + Math.floor(Math.random() * 9999);
    if (!s.exists()) {
      await setDoc(doc(db, 'usernames', base), { uid: u.uid, email: u.email, createdAt: Date.now() });
      await updateProfile(u, { displayName: base });
    } else if (s.data().uid === u.uid) await updateProfile(u, { displayName: base });
  } catch (e) { showErr(e.message); }
};

window.doSkip = () => {
  isGuest = true;
  currentUser = { uid: 'guest_' + Date.now(), email: '', name: 'Guest' };
  $('userBtn').textContent = '👤 Guest';
  $('loginScreen').classList.add('hide');
  $('app').classList.add('on');
  loadImages();
};

window.doLogout = async () => { await signOut(auth); isGuest = false; };

$('userBtn').onclick = () => { if (isGuest || !currentUser) $('loginScreen').classList.remove('hide'); else changeUser(); };

async function changeUser() {
  const n = prompt('Naya username:', currentUser.name);
  if (!n) return;
  const c = n.trim().toLowerCase();
  if (c.length < 3 || !/^[a-z0-9_]+$/.test(c)) return alert('Invalid!');
  if (c === currentUser.name) return;
  const s = await getDoc(doc(db, 'usernames', c));
  if (s.exists()) return alert('Already taken!');
  await setDoc(doc(db, 'usernames', c), { uid: currentUser.uid, email: currentUser.email, createdAt: Date.now() });
  await updateProfile(auth.currentUser, { displayName: c });
  currentUser.name = c;
  $('userBtn').textContent = '👤 ' + c;
  alert('Done! ✅');
}

function showErr(m) { $('err').textContent = m; $('err').style.display = 'block'; }

// ===== IMAGE UPLOAD =====
window.pickImage = () => {
  if (isGuest && guestCount() >= GUEST_LIMIT) { alert('Limit khatam! Login karo!'); $('loginScreen').classList.remove('hide'); return; }
  $('fileIn').click();
};

$('fileIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (isGuest && guestCount() >= GUEST_LIMIT) return alert('Limit khatam!');
  const fd = new FormData();
  fd.append('file', f);
  fd.append('username', currentUser && !isGuest ? currentUser.name : 'Guest');
  fd.append('uid', currentUser && !isGuest ? currentUser.uid : 'guest_' + Date.now());
  try {
    const r = await fetch(`${WORKER_URL}/upload`, { method: 'POST', body: fd });
    const d = await r.json();
    if (d.id) { if (isGuest) incGuest(); setTimeout(loadImages, 500); }
    else alert('Upload fail');
  } catch (er) { alert('Error: ' + er.message); }
  $('fileIn').value = '';
};

// ===== GALLERY =====
async function loadImages() {
  try {
    const r = await fetch(`${WORKER_URL}/list`);
    const d = await r.json();
    const grid = $('gGrid');
    grid.innerHTML = '';
    if (d.images && d.images.length > 0) {
      $('gEmpty').style.display = 'none';
      d.images.forEach(im => grid.appendChild(makeCard(im)));
    } else $('gEmpty').style.display = 'block';
  } catch (e) {}
}

function makeCard(im) {
  const isOwn = currentUser && !isGuest && im.uid === currentUser.uid;
  const canC = currentUser && !isGuest;
  const c = document.createElement('div');
  c.className = 'gcard';
  c.id = 'gc_' + im.id;
  c.innerHTML = `
    <img src="${WORKER_URL}/image/${im.id}" loading="lazy">
    <div class="gbody">
      <div class="gname">📷 ${esc(im.username || 'Unknown')}</div>
      <div class="gcap" id="gcap_${im.id}">${esc(im.caption || '')}</div>
      <div class="grow">
        ${isOwn ? `<div style="display:flex;gap:4px;"><button class="gbtn" onclick="editCap('${im.id}')">✏️</button><button class="gbtn d" onclick="delImg('${im.id}')">🗑</button></div>` : '<span></span>'}
        <span class="gcnt">💬 ${im.comments.length}</span>
      </div>
      <div class="gcmts" id="gcm_${im.id}">${im.comments.map(c => `<div class="gcmt"><b>${esc(c.username || 'Anon')}:</b> ${esc(c.text)}</div>`).join('')}</div>
      <div class="gcinput">
        <input type="text" id="gin_${im.id}" placeholder="${canC ? 'Comment...' : 'Login'}" ${canC ? '' : 'disabled'}>
        <button onclick="addCom('${im.id}')" ${canC ? '' : 'disabled'}>Post</button>
      </div>
    </div>`;
  return c;
}

window.delImg = async id => {
  if (!confirm('Delete?')) return;
  await fetch(`${WORKER_URL}/delete/${id}`, { method: 'DELETE' });
  $('gc_' + id).remove();
};
window.editCap = async id => {
  const el = $('gcap_' + id);
  const n = prompt('Naya caption:', el.textContent);
  if (n === null) return;
  await fetch(`${WORKER_URL}/edit/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caption: n }) });
  el.textContent = n;
};
window.addCom = async id => {
  if (!currentUser || isGuest) { $('loginScreen').classList.remove('hide'); return; }
  const inp = $('gin_' + id);
  const t = inp.value.trim(); if (!t) return;
  const r = await fetch(`${WORKER_URL}/comment/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t, username: currentUser.name }) });
  const d = await r.json();
  if (d.success) {
    inp.value = '';
    const cm = $('gcm_' + id);
    const div = document.createElement('div');
    div.className = 'gcmt';
    div.innerHTML = `<b>${esc(currentUser.name)}:</b> ${esc(t)}`;
    cm.appendChild(div);
    document.querySelector(`#gc_${id} .gcnt`).textContent = '💬 ' + d.comments.length;
  }
};

// ===== CHAT PANEL =====
window.openChat = () => {
  $('chatPanel').classList.add('on');
  $('backdrop').classList.add('on');
  $('chatDot').classList.remove('on');
  if (currentUser && !isGuest) loadChats();
  else $('chatsList').innerHTML = '<div class="pempty">Login karo!</div>';
};
window.closeChat = () => { $('chatPanel').classList.remove('on'); $('backdrop').classList.remove('on'); };
window.switchTab = t => {
  $('ptabChats').classList.toggle('on', t === 'chats');
  $('ptabSearch').classList.toggle('on', t === 'search');
  $('chatsList').style.display = t === 'chats' ? 'block' : 'none';
  $('searchList').style.display = t === 'search' ? 'block' : 'none';
};

window.searchUsers = async q => {
  const res = $('searchResults');
  if (q.length < 2) { res.innerHTML = '<div class="pempty">2 letters daalo...</div>'; return; }
  if (isGuest || !currentUser) { res.innerHTML = '<div class="pempty">Login karo!</div>'; return; }
  res.innerHTML = '<div class="pempty">Searching...</div>';
  const s = await getDocs(collection(db, 'usernames'));
  res.innerHTML = '';
  let f = 0;
  s.forEach(d => {
    const n = d.id, data = d.data();
    if (n.includes(q.toLowerCase()) && data.uid !== currentUser.uid) {
      f++;
      const r = document.createElement('div');
      r.className = 'userrow';
      r.onclick = () => startChat(data.uid, n);
      r.innerHTML = `<div class="avatar">${n[0].toUpperCase()}</div><div class="uname">${n}</div><div class="uchat">💬 Chat</div>`;
      res.appendChild(r);
    }
  });
  if (f === 0) res.innerHTML = '<div class="pempty">Koi user nahi mila</div>';
};

window.startChat = async (uid, name) => {
  if (isGuest) return alert('Login karo!');
  const cid = [currentUser.uid, uid].sort().join('_');
  activeChatId = cid;
  activeChatUser = { uid, name };
  $('mName').textContent = name;
  $('mAvatar').textContent = name[0].toUpperCase();
  $('msgView').classList.add('on');
  const ref = doc(db, 'chats', cid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, {
      users: [currentUser.uid, uid],
      usernames: { [currentUser.uid]: currentUser.name, [uid]: name },
      createdAt: Date.now(), lastMessage: 'Connected!', lastMessageTime: Date.now()
    });
  }
  closeChat();
  loadMsgs(cid);
};

function loadMsgs(cid) {
  if (unsubMsgs) unsubMsgs();
  const body = $('msgBody');
  body.innerHTML = '<div style="text-align:center;color:#555;padding:20px;font-size:12px;">Loading...</div>';
  const q = query(collection(db, 'chats', cid, 'messages'), orderBy('createdAt', 'asc'), limit(200));
  unsubMsgs = onSnapshot(q, snap => {
    body.innerHTML = '';
    if (snap.empty) { body.innerHTML = '<div style="text-align:center;color:#555;padding:20px;font-size:12px;">Abhi koi message nahi</div>'; return; }
    snap.forEach(d => {
      const m = d.data(), mid = d.id, me = m.from === currentUser.uid;
      const row = document.createElement('div');
      row.className = 'msg-row ' + (me ? 'me' : 'you');
      
      // Action button (only for own messages)
      if (me) {
        const btn = document.createElement('button');
        btn.className = 'msg-action';
        btn.innerHTML = '⋯';
        btn.onclick = (e) => { e.stopPropagation(); openMsgMenu(mid, m.text || ''); };
        row.appendChild(btn);
      }
      
      const div = document.createElement('div');
      div.className = 'msg ' + (me ? 'me' : 'you');
      const time = m.createdAt ? new Date(m.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      let h = '';
      if (m.imageUrl) h += `<img src="${m.imageUrl}" onclick="event.stopPropagation();showImg('${m.imageUrl}')">`;
      if (m.text) h += `<span>${esc(m.text)}</span>`;
      h += `<span class="mtime">${m.edited ? '<span class="medit">edited</span>' : ''}${time}</span>`;
      div.innerHTML = h;
      row.appendChild(div);
      body.appendChild(row);
    });
    body.scrollTop = body.scrollHeight;
  });
}

window.sendMsg = async () => {
  if (isGuest) return alert('Login karo!');
  const inp = $('msgIn'), t = inp.value.trim();
  if (!t || !activeChatId) return;
  inp.value = '';
  await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
    text: t, from: currentUser.uid, fromName: currentUser.name, createdAt: serverTimestamp()
  });
  await setDoc(doc(db, 'chats', activeChatId), { lastMessage: t, lastMessageTime: Date.now(), lastSender: currentUser.uid }, { merge: true });
};

$('chatImgIn').onchange = async e => {
  const f = e.target.files[0]; if (!f || !activeChatId) return;
  if (isGuest) return alert('Login karo!');
  const inp = $('msgIn');
  inp.placeholder = 'Uploading...'; inp.disabled = true;
  try {
    const fd = new FormData();
    fd.append('file', f); fd.append('username', currentUser.name); fd.append('uid', currentUser.uid);
    const r = await fetch(`${WORKER_URL}/upload`, { method: 'POST', body: fd });
    const d = await r.json();
    if (d.id) {
      await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
        text: '', imageUrl: `${WORKER_URL}/image/${d.id}`, from: currentUser.uid, fromName: currentUser.name, createdAt: serverTimestamp()
      });
      await setDoc(doc(db, 'chats', activeChatId), { lastMessage: '📷 Photo', lastMessageTime: Date.now(), lastSender: currentUser.uid }, { merge: true });
    }
  } catch (er) { alert('Error: ' + er.message); }
  inp.placeholder = 'Message...'; inp.disabled = false;
  $('chatImgIn').value = '';
};

// ===== MSG MENU =====
function openMsgMenu(mid, txt) {
  selectedMsgId = mid; selectedMsgText = txt;
  $('msgMenu').classList.add('on');
  $('editOpt').style.display = txt ? 'flex' : 'none';
}
window.closeMsgMenu = () => $('msgMenu').classList.remove('on');

window.editMsg = async () => {
  if (!selectedMsgId) return;
  $('msgMenu').classList.remove('on');
  const n = prompt('Edit:', selectedMsgText);
  if (!n || !n.trim()) return;
  await updateDoc(doc(db, 'chats', activeChatId, 'messages', selectedMsgId), { text: n.trim(), edited: true });
  await setDoc(doc(db, 'chats', activeChatId), { lastMessage: n.trim(), lastMessageTime: Date.now() }, { merge: true });
};

window.deleteMsg = async () => {
  if (!selectedMsgId) return;
  $('msgMenu').classList.remove('on');
  if (!confirm('Delete?')) return;
  await deleteDoc(doc(db, 'chats', activeChatId, 'messages', selectedMsgId));
};

$('backdrop').onclick = () => {
  if ($('msgMenu').classList.contains('on')) closeMsgMenu();
};

window.closeMsg = () => {
  $('msgView').classList.remove('on');
  if (unsubMsgs) unsubMsgs();
  activeChatId = null;
};

// ===== IMG VIEWER =====
window.showImg = u => { $('imgViewerImg').src = u; $('imgViewer').classList.add('on'); };
window.closeImg = () => $('imgViewer').classList.remove('on');

// ===== CHAT LIST =====
function loadChats() {
  if (unsubChats) unsubChats();
  const list = $('chatsList');
  const q = query(collection(db, 'chats'), where('users', 'array-contains', currentUser.uid));
  unsubChats = onSnapshot(q, snap => {
    list.innerHTML = '';
    if (snap.empty) { list.innerHTML = '<div class="pempty">Abhi koi chat nahi.<br>Search se dhoondo!</div>'; return; }
    const arr = [];
    snap.forEach(d => { const data = d.data(); if (data.users && data.users.includes(currentUser.uid)) arr.push({ id: d.id, ...data }); });
    arr.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
    arr.forEach(c => {
      const ou = c.users.find(u => u !== currentUser.uid);
      const on = c.usernames && c.usernames[ou] ? c.usernames[ou] : 'User';
      const r = document.createElement('div');
      r.className = 'chatrow';
      r.onclick = () => startChat(ou, on);
      r.innerHTML = `<div class="avatar">${on[0].toUpperCase()}</div><div class="cinfo"><div class="cname">${esc(on)}</div><div class="cmsg">${esc(c.lastMessage || 'Chat shuru karo...')}</div></div>`;
      list.appendChild(r);
    });
  });
}

// ===== NOTIFICATIONS =====
function startNotif() {
  if (unsubNotif) unsubNotif();
  const q = query(collection(db, 'chats'), where('users', 'array-contains', currentUser.uid));
  unsubNotif = onSnapshot(q, snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type === 'modified') {
        const c = ch.doc.data();
        if (ch.doc.id !== activeChatId && c.lastSender && c.lastSender !== currentUser.uid) {
          const ou = c.users.find(u => u !== currentUser.uid);
          const on = c.usernames ? c.usernames[ou] : 'User';
          showToast(on, c.lastMessage);
          $('chatDot').classList.add('on');
        }
      }
    });
  });
}

function showToast(name, msg) {
  $('toastAvatar').textContent = name[0].toUpperCase();
  $('toastName').textContent = name;
  $('toastMsg').textContent = msg;
  $('toast').classList.add('on');
  setTimeout(() => $('toast').classList.remove('on'), 3500);
}

function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

// ===== AUTH STATE =====
onAuthStateChanged(auth, async u => {
  if (u) {
    isGuest = false;
    let name = u.displayName;
    if (!name) {
      const s = await getDocs(collection(db, 'usernames'));
      s.forEach(d => { if (d.data().uid === u.uid) name = d.id; });
      if (!name) name = u.email.split('@')[0];
      await updateProfile(u, { displayName: name });
    }
    currentUser = { uid: u.uid, email: u.email, name };
    $('userBtn').textContent = '👤 ' + name;
    $('logoutBtn').style.display = 'block';
    $('loginScreen').classList.add('hide');
    $('app').classList.add('on');
    loadImages();
    loadChats();
    startNotif();
  } else if (!isGuest) {
    currentUser = null;
    $('userBtn').textContent = '👤 Guest';
    $('logoutBtn').style.display = 'none';
    $('loginScreen').classList.remove('hide');
    $('app').classList.remove('on');
  }
});
</script>

</body>
</html>
