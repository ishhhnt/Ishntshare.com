<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>ISHNTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c12;--bg2:#14141e;--bg3:#1a1a26;
  --border:rgba(255,255,255,0.08);
  --accent:#c8f45a;--accent2:#7c6bff;
  --text:#ededf5;--muted:#6b6b8a;--card:#141420;
  --r:16px;--r-sm:10px;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;overflow-x:hidden}

/* NAME SCREEN */
#ns{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:1000;padding:1.5rem}
.ns-card{background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:2.5rem 2rem;max-width:400px;width:100%;text-align:center;animation:fadeUp .5s both}
.brand{font-family:var(--fh);font-size:2.6rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.tagline{font-size:.78rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin:.4rem 0 2rem}
.ns-title{font-family:var(--fh);font-size:1.4rem;font-weight:700;margin-bottom:.4rem}
.ns-sub{font-size:.86rem;color:var(--muted);margin-bottom:1.8rem;line-height:1.5}
.ns-card input{width:100%;padding:.9rem 1.2rem;background:rgba(255,255,255,0.05);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-family:var(--fb);font-size:.95rem;outline:none;transition:border-color .2s;margin-bottom:1rem}
.ns-card input:focus{border-color:var(--accent)}
.ns-card input::placeholder{color:var(--muted)}
.btn-p{width:100%;padding:.9rem;background:var(--accent);color:#0c0c12;border:none;border-radius:var(--r-sm);font-family:var(--fh);font-size:.95rem;font-weight:700;cursor:pointer}
.btn-p:hover{opacity:.88}

/* MAIN */
#app{display:none;min-height:100vh}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:rgba(12,12,18,.95);border-bottom:1px solid var(--border);padding:.75rem 1rem}
.tb-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:.75rem}
.tb-brand{font-family:var(--fh);font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0}
.tb-user{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.tb-user b{color:var(--accent);font-weight:600}
.tb-right{display:flex;gap:.5rem;align-items:center;margin-left:auto;flex-shrink:0}
.btn-post{display:flex;align-items:center;gap:.4rem;background:var(--accent);color:#0c0c12;border:none;border-radius:50px;padding:.55rem 1.1rem;font-family:var(--fh);font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-post:hover{opacity:.88}
.ic-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s;flex-shrink:0}
.ic-btn:hover{background:rgba(255,255,255,0.1);color:var(--text)}

/* FEED */
.feed{max-width:1100px;margin:0 auto;padding:1.2rem .8rem 4rem}
.feed-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:.5rem;flex-wrap:wrap}
.feed-label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.feed-meta{display:flex;align-items:center;gap:.5rem}
.pc-badge{font-size:.75rem;color:var(--muted);background:var(--bg3);border:1px solid var(--border);border-radius:50px;padding:.2rem .65rem}

/* grid toggle */
.gtog{display:flex;gap:.3rem}
.gb{width:30px;height:30px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gb:hover{background:rgba(255,255,255,.08);color:var(--text)}
.gb.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}

/* GRID MODES */
#grid{column-count:3;column-gap:8px}
@media(max-width:700px){#grid{column-count:2;column-gap:6px}}
@media(max-width:360px){#grid{column-count:2;column-gap:5px}}
#grid.v2{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;column-count:unset!important}
#grid.v1{display:grid!important;grid-template-columns:1fr;gap:10px;max-width:520px;margin-left:auto!important;margin-right:auto!important;column-count:unset!important}
@media(max-width:400px){#grid.v2{gap:5px}}

/* CARD */
.card{break-inside:avoid;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px;animation:fadeUp .3s both;position:relative;display:inline-block;width:100%}
#grid.v2 .card,#grid.v1 .card{display:block;margin-bottom:0}
.card:hover{border-color:rgba(255,255,255,.14)}

.img-wrap{position:relative;background:var(--bg3);overflow:hidden}
.img-wrap img{width:100%;display:block;object-fit:cover}

/* desktop overlay */
.overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.72));opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;padding:.65rem;gap:.35rem;flex-wrap:wrap}
@media(hover:hover){.card:hover .overlay{opacity:1}}

/* touch action row */
@media(hover:none){.overlay{display:none}.tap-row{display:flex!important}}
.tap-row{display:none;gap:.35rem;flex-wrap:wrap;padding:.5rem .65rem 0}

.ob{padding:.35rem .7rem;border-radius:50px;font-size:.7rem;font-weight:600;font-family:var(--fh);border:none;cursor:pointer;display:flex;align-items:center;gap:.25rem;line-height:1}
.ob-dl{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}
.ob-ed{background:var(--accent2);color:#fff}
.ob-del{background:#ff4055;color:#fff}
.ob-dl-tap{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}

.card-body{padding:.65rem .7rem .7rem}
.card-user{display:flex;align-items:center;gap:.4rem;margin-bottom:.35rem}
.av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:.58rem;font-weight:800;flex-shrink:0;text-transform:uppercase}
.a0{background:linear-gradient(135deg,#667eea,#764ba2)}
.a1{background:linear-gradient(135deg,#f093fb,#f5576c)}
.a2{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.a3{background:linear-gradient(135deg,#43e97b,#38f9d7)}
.a4{background:linear-gradient(135deg,#fa709a,#fee140)}
.a5{background:linear-gradient(135deg,#a18cd1,#fbc2eb)}
.a6{background:linear-gradient(135deg,#c8f45a,#7c6bff)}
.a7{background:linear-gradient(135deg,#ffd89b,#19547b)}
.uname{font-size:.75rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caption{font-size:.76rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* SKELETON */
#skel{column-count:3;column-gap:8px;display:none}
@media(max-width:700px){#skel{column-count:2}}
.sk{break-inside:avoid;border-radius:var(--r);overflow:hidden;margin-bottom:8px;background:var(--card);border:1px solid var(--border);display:inline-block;width:100%}
.sk-i{background:var(--bg3);animation:sh 1.4s infinite}
.sk-b{padding:.7rem}
.sk-l{height:9px;border-radius:5px;background:var(--bg3);animation:sh 1.4s infinite;margin-bottom:6px}
.sk-l.s{width:55%}

/* EMPTY */
#empty{display:none;text-align:center;padding:4rem 2rem;color:var(--muted)}
#empty svg{width:50px;height:50px;margin-bottom:1rem;opacity:.3}
#empty h3{font-family:var(--fh);font-size:1.2rem;color:var(--text);margin-bottom:.4rem}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:500;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex;animation:fadeIn .18s}
.sheet{background:var(--bg2);border:1px solid var(--border);border-radius:22px 22px 0 0;padding:1.5rem 1.4rem 2.2rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.16,1,.3,1) both}
.handle{width:36px;height:3px;background:var(--border);border-radius:3px;margin:0 auto 1.4rem}
.mtitle{font-family:var(--fh);font-size:1.2rem;font-weight:700;margin-bottom:1.2rem}

.dz{border:2px dashed var(--border);border-radius:var(--r);padding:2rem 1rem;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:1rem;overflow:hidden}
.dz:hover{border-color:var(--accent2)}
.dz.got{padding:0;border-style:solid;border-color:var(--accent2)}
.dz svg{width:36px;height:36px;color:var(--muted);margin-bottom:.7rem}
.dz p{font-size:.82rem;color:var(--muted);line-height:1.5}
.dz p b{color:var(--accent)}
.dz img{width:100%;max-height:260px;object-fit:cover;border-radius:calc(var(--r) - 2px);display:none}
.dz.got img{display:block}
.dz.got .dzph{display:none}
input[type=file]{display:none}

textarea{width:100%;padding:.8rem 1rem;background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-family:var(--fb);font-size:.88rem;resize:vertical;min-height:78px;outline:none;transition:border-color .2s;margin-bottom:1rem}
textarea:focus{border-color:var(--accent2)}
textarea::placeholder{color:var(--muted)}

.prg{height:3px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:.9rem;display:none}
.prg.on{display:block}
.prg-b{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px;width:0;transition:width .3s}

.m-act{display:flex;gap:.7rem}
.btn-c{flex:1;padding:.82rem;background:transparent;border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--muted);font-family:var(--fb);font-size:.88rem;cursor:pointer}
.btn-c:hover{border-color:var(--muted);color:var(--text)}
.btn-s{flex:2;padding:.82rem;background:var(--accent2);border:none;border-radius:var(--r-sm);color:#fff;font-family:var(--fh);font-size:.88rem;font-weight:700;cursor:pointer}
.btn-s:hover{opacity:.88}
.btn-s:disabled{opacity:.45;cursor:not-allowed}

/* TOAST */
#tc{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
.toast{background:var(--bg2);border:1px solid var(--border);border-radius:50px;padding:.55rem 1.1rem;font-size:.82rem;font-weight:500;color:var(--text);box-shadow:0 4px 20px rgba(0,0,0,.5);white-space:nowrap;animation:fadeUp .25s both}
.toast.ok{border-color:var(--accent);color:var(--accent)}
.toast.err{border-color:#ff4055;color:#ff4055}
.toast.bye{animation:fadeDown .25s both}

.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .5s linear infinite;vertical-align:middle;margin-right:5px}

/* SCROLL TOP */
#stb{position:fixed;bottom:1.5rem;right:1.2rem;width:40px;height:40px;background:var(--accent);color:#0c0c12;border:none;border-radius:50%;font-size:1.1rem;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:200}
#stb.on{display:flex;animation:fadeUp .25s both}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-8px)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sh{0%,100%{opacity:.6}50%{opacity:.3}}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- NAME SCREEN -->
<div id="ns">
  <div class="ns-card">
    <div class="brand">ISHNTT</div>
    <div class="tagline">Share your world</div>
    <div class="ns-title">Choose your name</div>
    <p class="ns-sub">Pick a username to join the community.</p>
    <input id="ni" type="text" placeholder="e.g. stellar.sky" maxlength="24"
      onkeydown="if(event.key==='Enter')window.saveName()" autocomplete="off"/>
    <button class="btn-p" onclick="window.saveName()">Enter ISHNTT ✦</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <header class="topbar">
    <div class="tb-inner">
      <div class="tb-brand">ISHNTT</div>
      <div class="tb-user">@<b id="du"></b></div>
      <div class="tb-right">
        <button class="btn-post" onclick="window.openUpload()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Post
        </button>
        <button class="ic-btn" onclick="window.loadPosts()" title="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="ic-btn" onclick="window.switchUser()" title="Switch user">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="feed">
    <div class="feed-bar">
      <div class="feed-label">✦ Latest</div>
      <div class="feed-meta">
        <div class="pc-badge" id="pc">0 posts</div>
        <!-- VIEW TOGGLE -->
        <div class="gtog">
          <!-- Masonry -->
          <button class="gb on" id="gb-m" onclick="window.setView('m')" title="Masonry">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><rect x="1" y="1" width="7" height="9" rx="1.2"/><rect x="12" y="1" width="7" height="5" rx="1.2"/><rect x="1" y="13" width="7" height="6" rx="1.2"/><rect x="12" y="9" width="7" height="10" rx="1.2"/></svg>
          </button>
          <!-- 2-col side by side -->
          <button class="gb" id="gb-2" onclick="window.setView('2')" title="2-column">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><rect x="1" y="1" width="7.5" height="18" rx="1.2"/><rect x="11.5" y="1" width="7.5" height="18" rx="1.2"/></svg>
          </button>
          <!-- Single col -->
          <button class="gb" id="gb-1" onclick="window.setView('1')" title="Single column">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="1" width="16" height="8" rx="1.2"/><rect x="2" y="11" width="16" height="8" rx="1.2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Skeletons -->
    <div id="skel">
      <div class="sk"><div class="sk-i" style="height:190px"></div><div class="sk-b"><div class="sk-l s"></div><div class="sk-l"></div></div></div>
      <div class="sk"><div class="sk-i" style="height:140px"></div><div class="sk-b"><div class="sk-l s"></div><div class="sk-l"></div></div></div>
      <div class="sk"><div class="sk-i" style="height:250px"></div><div class="sk-b"><div class="sk-l s"></div><div class="sk-l"></div></div></div>
      <div class="sk"><div class="sk-i" style="height:160px"></div><div class="sk-b"><div class="sk-l s"></div><div class="sk-l"></div></div></div>
      <div class="sk"><div class="sk-i" style="height:220px"></div><div class="sk-b"><div class="sk-l s"></div><div class="sk-l"></div></div></div>
      <div class="sk"><div class="sk-i" style="height:120px"></div><div class="sk-b"><div class="sk-l s"></div><div class="sk-l"></div></div></div>
    </div>

    <div id="grid"></div>

    <div id="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <h3>No posts yet</h3>
      <p>Be the first to share something.</p>
    </div>
  </main>
</div>

<!-- UPLOAD MODAL -->
<div class="modal" id="um">
  <div class="sheet">
    <div class="handle"></div>
    <div class="mtitle">New Post ✦</div>
    <div class="dz" id="udz" onclick="document.getElementById('ufi').click()">
      <div class="dzph">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <p>Tap to choose photo<br><b>Any image format</b></p>
      </div>
      <img id="upv" src="" alt=""/>
    </div>
    <input type="file" id="ufi" accept="image/*" onchange="window.prevImg(event,'upv','udz','u')"/>
    <textarea id="uci" placeholder="Write a caption…" maxlength="300"></textarea>
    <div class="prg" id="uprg"><div class="prg-b" id="upb"></div></div>
    <div class="m-act">
      <button class="btn-c" onclick="window.closeUpload()">Cancel</button>
      <button class="btn-s" id="usb" onclick="window.uploadImage()">Share Post</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="em">
  <div class="sheet">
    <div class="handle"></div>
    <div class="mtitle">Edit Post ✦</div>
    <div class="dz" id="edz" onclick="document.getElementById('efi').click()">
      <div class="dzph">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <p>Tap to replace image<br><b>(optional)</b></p>
      </div>
      <img id="epv" src="" alt=""/>
    </div>
    <input type="file" id="efi" accept="image/*" onchange="window.prevImg(event,'epv','edz','e')"/>
    <textarea id="eci" placeholder="Update caption…" maxlength="300"></textarea>
    <div class="prg" id="eprg"><div class="prg-b" id="epb"></div></div>
    <div class="m-act">
      <button class="btn-c" onclick="window.closeEdit()">Cancel</button>
      <button class="btn-s" id="esb" onclick="window.editPost()">Save Changes</button>
    </div>
  </div>
</div>

<div id="tc"></div>
<button id="stb" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>

<script type="module">
const {Client,Storage,Databases,ID,Query}=Appwrite;
const client=new Client()
  .setEndpoint('https://sgp.cloud.appwrite.io/v1')
  .setProject('6a00735000212c19f8ff');
const storage=new Storage(client);
const db=new Databases(client);
const DB='6a00775b0033af06d5b6',COL='posts',BKT='6a00738700068cdcb792';

let user=localStorage.getItem('ishntt_u')||'';
let editId=null,editImgId=null,selFile=null,editFile=null,curView='m';

// helpers
const $=id=>document.getElementById(id);
function iurl(id){return`https://sgp.cloud.appwrite.io/v1/storage/buckets/${BKT}/files/${id}/view?project=6a00735000212c19f8ff`}
function avc(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))&0xffff;return'a'+(h%8)}
function toast(msg,type=''){
  const t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.textContent=msg;$('tc').appendChild(t);
  setTimeout(()=>{t.classList.add('bye');setTimeout(()=>t.remove(),280)},2800);
}
function setBar(prgId,barId,pct){
  const p=$(prgId),b=$(barId);
  if(pct===false){p.classList.remove('on')}
  else{p.classList.add('on');b.style.width=pct+'%'}
}

// view toggle
window.setView=function(v){
  curView=v;
  const g=$('grid');
  g.className='';
  if(v==='2')g.classList.add('v2');
  if(v==='1')g.classList.add('v1');
  ['m','2','1'].forEach(x=>$('gb-'+x)&&$('gb-'+x).classList.toggle('on',x===v));
};

// image preview
window.prevImg=function(e,imgId,dzId,which){
  const f=e.target.files[0];if(!f)return;
  if(which==='u')selFile=f;else editFile=f;
  const r=new FileReader();
  r.onload=ev=>{$(imgId).src=ev.target.result;$(dzId).classList.add('got');};
  r.readAsDataURL(f);
};

// name screen
window.saveName=function(){
  const v=$('ni').value.trim();
  if(!v||v.length<2){toast('Enter at least 2 characters','err');return;}
  user=v;localStorage.setItem('ishntt_u',user);
  $('ns').style.display='none';
  $('app').style.display='block';
  $('du').textContent=user;
  window.loadPosts();
};
window.switchUser=function(){localStorage.removeItem('ishntt_u');location.reload();};

// upload
window.openUpload=function(){$('um').classList.add('open')};
window.closeUpload=function(){
  $('um').classList.remove('open');
  selFile=null;$('ufi').value='';$('upv').src='';
  $('udz').classList.remove('got');$('uci').value='';
  setBar('uprg','upb',false);
  const b=$('usb');b.disabled=false;b.textContent='Share Post';
};
window.uploadImage=async function(){
  if(!selFile){toast('Choose an image','err');return;}
  const cap=$('uci').value.trim();
  if(!cap){toast('Add a caption','err');return;}
  const b=$('usb');b.disabled=true;b.innerHTML='<span class="spin"></span>Uploading…';
  setBar('uprg','upb',15);
  let pct=15;
  const tick=setInterval(()=>{if(pct<78){pct+=6;$('upb').style.width=pct+'%';}},300);
  try{
    const fr=await storage.createFile(BKT,ID.unique(),selFile);
    clearInterval(tick);setBar('uprg','upb',88);
    await db.createDocument(DB,COL,ID.unique(),{username:user,caption:cap,imageId:fr.$id});
    setBar('uprg','upb',100);
    toast('Posted! ✦','ok');window.closeUpload();window.loadPosts();
  }catch(e){
    clearInterval(tick);toast('Upload failed: '+e.message,'err');
    b.disabled=false;b.textContent='Share Post';setBar('uprg','upb',false);
  }
};

// edit
window.openEdit=function(docId,imgId,cap,url){
  editId=docId;editImgId=imgId;editFile=null;
  $('eci').value=cap;$('epv').src=url;$('edz').classList.add('got');
  $('efi').value='';$('em').classList.add('open');
  const b=$('esb');b.disabled=false;b.textContent='Save Changes';
};
window.closeEdit=function(){
  $('em').classList.remove('open');
  editId=editImgId=editFile=null;setBar('eprg','epb',false);
};
window.editPost=async function(){
  const cap=$('eci').value.trim();
  if(!cap){toast('Caption cannot be empty','err');return;}
  const b=$('esb');b.disabled=true;b.innerHTML='<span class="spin"></span>Saving…';
  setBar('eprg','epb',20);
  try{
    let newImg=editImgId;
    if(editFile){
      setBar('eprg','epb',40);
      const fr=await storage.createFile(BKT,ID.unique(),editFile);
      setBar('eprg','epb',65);
      try{await storage.deleteFile(BKT,editImgId);}catch(_){}
      newImg=fr.$id;
    }
    setBar('eprg','epb',82);
    await db.updateDocument(DB,COL,editId,{caption:cap,imageId:newImg});
    setBar('eprg','epb',100);
    toast('Updated! ✦','ok');window.closeEdit();window.loadPosts();
  }catch(e){
    toast('Edit failed: '+e.message,'err');
    b.disabled=false;b.textContent='Save Changes';
  }
};

// delete
window.deletePost=async function(docId,imgId){
  if(!confirm('Delete this post?'))return;
  try{
    await db.deleteDocument(DB,COL,docId);
    try{await storage.deleteFile(BKT,imgId);}catch(_){}
    toast('Deleted','ok');window.loadPosts();
  }catch(e){toast('Delete failed: '+e.message,'err');}
};

// download
window.dlImg=function(imgId,uname){
  const a=document.createElement('a');
  a.href=iurl(imgId);a.target='_blank';
  a.download='ishntt_'+uname+'_'+imgId+'.jpg';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('Saving image…','ok');
};

// load posts
window.loadPosts=async function(){
  const g=$('grid'),sk=$('skel'),emp=$('empty'),pc=$('pc');
  g.innerHTML='';sk.style.display='block';emp.style.display='none';
  g.className='';
  if(curView==='2')g.classList.add('v2');
  if(curView==='1')g.classList.add('v1');
  try{
    const res=await db.listDocuments(DB,COL,[Query.orderDesc('$createdAt'),Query.limit(100)]);
    sk.style.display='none';
    pc.textContent=res.total+' post'+(res.total!==1?'s':'');
    if(!res.documents.length){emp.style.display='block';return;}

    const frag=document.createDocumentFragment();
    res.documents.forEach((doc,i)=>{
      const own=doc.username===user;
      const url=iurl(doc.imageId);
      const av=avc(doc.username);
      const ini=doc.username.charAt(0).toUpperCase();
      // safe strings for inline onclick attributes
      const sc=doc.caption.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
      const su=url.replace(/'/g,"\\'");

      const c=document.createElement('div');
      c.className='card';
      if(i<10)c.style.animationDelay=(i*35)+'ms';

      const ownBtns=own?`
        <button class="ob ob-ed" onclick="event.stopPropagation();window.openEdit('${doc.$id}','${doc.imageId}','${sc}','${su}')">✎ Edit</button>
        <button class="ob ob-del" onclick="event.stopPropagation();window.deletePost('${doc.$id}','${doc.imageId}')">✕</button>
      `:'';
      const ownTap=own?`
        <button class="ob ob-ed" onclick="window.openEdit('${doc.$id}','${doc.imageId}','${sc}','${su}')">✎ Edit</button>
        <button class="ob ob-del" onclick="window.deletePost('${doc.$id}','${doc.imageId}')">✕ Del</button>
      `:'';

      c.innerHTML=`
        <div class="img-wrap">
          <img src="${url}" alt="" loading="lazy" decoding="async"/>
          <div class="overlay">
            <button class="ob ob-dl" onclick="event.stopPropagation();window.dlImg('${doc.imageId}','${doc.username}')">↓ Save</button>
            ${ownBtns}
          </div>
        </div>
        <div class="tap-row">
          <button class="ob ob-dl-tap" onclick="window.dlImg('${doc.imageId}','${doc.username}')">↓ Save</button>
          ${ownTap}
        </div>
        <div class="card-body">
          <div class="card-user">
            <div class="av ${av}">${ini}</div>
            <div class="uname">${doc.username}</div>
          </div>
          ${doc.caption?`<div class="caption">${doc.caption}</div>`:''}
        </div>
      `;
      frag.appendChild(c);
    });
    g.appendChild(frag);
  }catch(e){
    sk.style.display='none';
    toast('Load failed: '+e.message,'err');
    console.error(e);
  }
};

// scroll top
window.addEventListener('scroll',()=>$('stb').classList.toggle('on',scrollY>450),{passive:true});

// close modals on backdrop
$('um').addEventListener('click',e=>{if(e.target===$('um'))window.closeUpload();});
$('em').addEventListener('click',e=>{if(e.target===$('em'))window.closeEdit();});

// init
if(user){
  $('ns').style.display='none';
  $('app').style.display='block';
  $('du').textContent=user;
  window.loadPosts();
}
</script>
</body>
</html>
