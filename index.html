<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISHNTT — Share. Connect.</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #0a0a0a; color: #fff; min-height: 100vh; }

/* ===== LOGIN SCREEN ===== */
.login-screen {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; justify-content: center; align-items: center;
  padding: 20px; transition: opacity 0.4s, visibility 0.4s;
}
.login-screen.hidden { opacity: 0; visibility: hidden; }

.login-bg {
  position: absolute; inset: 0;
  background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200');
  background-size: cover; background-position: center;
  filter: blur(2px);
}
.login-bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,255,170,0.2), rgba(0,0,0,0.7));
}

.login-box {
  position: relative;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px;
  padding: 36px 28px;
  width: 100%; max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: slideUp 0.4s ease;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.login-box h1 { font-size: 30px; font-weight: 800; margin-bottom: 6px; color: #fff; }
.login-box .sub { font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 24px; }

.auth-tabs {
  display: flex; gap: 8px; margin-bottom: 20px;
  background: rgba(0,0,0,0.3); padding: 4px; border-radius: 12px;
}
.auth-tab {
  flex: 1; padding: 10px; border: none; background: transparent;
  color: #888; font-weight: 700; font-size: 14px;
  cursor: pointer; border-radius: 8px; transition: all 0.2s;
}
.auth-tab.active { background: linear-gradient(135deg, #00ffaa, #00cc66); color: #000; }

.input-wrap { position: relative; margin-bottom: 12px; }
.input-wrap input {
  width: 100%; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff; padding: 14px 44px 14px 16px;
  border-radius: 12px; font-size: 15px; outline: none;
}
.input-wrap input:focus { border-color: #00ffaa; background: rgba(0,255,170,0.05); }
.input-wrap input::placeholder { color: rgba(255,255,255,0.4); }
.input-wrap .icon {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); color: rgba(255,255,255,0.4);
  font-size: 18px; cursor: pointer;
}

.error-msg {
  color: #ff4466; font-size: 12px; margin-bottom: 10px;
  display: none; padding: 8px 12px;
  background: rgba(255,68,102,0.1); border-radius: 8px;
  border: 1px solid rgba(255,68,102,0.2);
}

.login-btn {
  width: 100%; background: linear-gradient(135deg, #00ffaa, #00cc66);
  color: #000; border: none; padding: 14px;
  border-radius: 12px; font-size: 15px; font-weight: 800;
  cursor: pointer; margin-bottom: 10px;
}
.login-btn:active { transform: scale(0.98); }

.google-btn {
  width: 100%; background: #fff; color: #000;
  border: none; padding: 13px; border-radius: 12px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  margin-bottom: 10px; display: flex;
  align-items: center; justify-content: center; gap: 10px;
}

.skip-btn {
  width: 100%; background: transparent; color: #888;
  border: 1px solid rgba(255,255,255,0.15);
  padding: 12px; border-radius: 12px;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
}
.skip-btn:hover { color: #fff; border-color: #444; }

/* ===== MAIN APP ===== */
.app { display: none; }
.app.active { display: block; }

header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px; border-bottom: 1px solid #1a1a1a;
  position: sticky; top: 0; background: rgba(10,10,10,0.95);
  backdrop-filter: blur(10px); z-index: 50;
}
.logo {
  font-size: 22px; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(135deg, #00ffaa, #00ccff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-header {
  background: #141414; border: 1px solid #222;
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; color: #ccc;
  position: relative;
}
.icon-header:hover { color: #00ffaa; }
.icon-header .badge {
  position: absolute; top: -2px; right: -2px;
  background: #ff3355; color: #fff;
  font-size: 9px; font-weight: 700;
  padding: 2px 5px; border-radius: 10px;
  min-width: 16px; text-align: center;
}

/* User bar */
.user-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: #141414; border: 1px solid #1f1f1f;
  border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
  font-size: 13px;
}
.user-bar .badge-name { color: #00ffaa; font-weight: 700; cursor: pointer; }
.user-bar .limit { color: #ffaa00; font-size: 11px; }
.user-bar .logout {
  background: #ff3355; color: #fff; border: none;
  padding: 6px 12px; border-radius: 16px;
  font-size: 12px; font-weight: 700; cursor: pointer;
}

.container { max-width: 1100px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }

/* Upload box */
.post-box {
  background: #141414; border: 1px solid #1f1f1f;
  border-radius: 16px; padding: 12px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 12px;
}
.post-box .avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #00ffaa, #00ccff);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: #000; font-size: 16px;
}
.post-box .upload-btn {
  flex: 1; background: #1c1c1c; border: 1px solid #262626;
  color: #888; padding: 12px 16px; border-radius: 24px;
  font-size: 14px; text-align: left; cursor: pointer;
}

/* Gallery */
.gallery {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 640px) { .gallery { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .gallery { grid-template-columns: repeat(4, 1fr); } }

.card {
  background: #141414; border-radius: 16px;
  border: 1px solid #1f1f1f; overflow: hidden;
}
.card-img-wrap { position: relative; }
.card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #1a1a1a; }
.card-badge {
  position: absolute; top: 10px; right: 10px;
  background: rgba(0,0,0,0.7); color: #00ffaa;
  padding: 4px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 700;
}
.card-body { padding: 12px; }
.uploader { font-size: 12px; color: #00ffaa; font-weight: 700; margin-bottom: 6px; }
.caption { font-size: 13px; color: #bbb; margin-bottom: 10px; line-height: 1.4; word-break: break-word; }
.actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.action-btns { display: flex; gap: 6px; }
.icon-btn {
  background: #222; border: 1px solid #2a2a2a; color: #ccc;
  width: 30px; height: 30px; border-radius: 50%;
  font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn.del { color: #ff5577; }
.comment-count { color: #666; font-size: 12px; font-weight: 600; }
.comments { max-height: 110px; overflow-y: auto; margin-top: 4px; }
.comment {
  background: #1c1c1c; padding: 6px 10px; border-radius: 10px;
  font-size: 12px; margin-bottom: 4px; color: #ccc; word-break: break-word;
}
.comment b { color: #00ffaa; }
.comment-input { display: flex; gap: 6px; margin-top: 8px; }
.comment-input input {
  flex: 1; background: #1c1c1c; border: 1px solid #262626;
  color: #fff; padding: 8px 12px; border-radius: 20px;
  font-size: 12px; outline: none;
}
.comment-input button {
  background: #00ffaa; color: #000; border: none;
  padding: 8px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 700; cursor: pointer;
}
.comment-input input:disabled, .comment-input button:disabled { opacity: 0.4; }

.empty { text-align: center; padding: 60px 20px; color: #555; }
.empty h3 { font-size: 18px; color: #888; margin-bottom: 6px; }
.empty p { font-size: 13px; }

.loading { display: none; text-align: center; padding: 20px; color: #00ffaa; font-weight: 600; }

/* Chat Panel */
.chat-panel {
  position: fixed; top: 0; right: -100%;
  width: 100%; max-width: 400px; height: 100vh;
  background: #0f0f0f; border-left: 1px solid #1f1f1f;
  z-index: 200; transition: right 0.3s ease;
  display: flex; flex-direction: column;
}
.chat-panel.open { right: 0; }

.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; border-bottom: 1px solid #1f1f1f;
}
.chat-header .back {
  background: #1a1a1a; border: none; color: #fff;
  width: 36px; height: 36px; border-radius: 50%;
  cursor: pointer; font-size: 18px;
}
.chat-header h2 { font-size: 18px; font-weight: 700; }

.chat-list { flex: 1; overflow-y: auto; }
.chat-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; cursor: pointer;
}
.chat-item:hover { background: #1a1a1a; }
.chat-item .avatar {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, #00ffaa, #00ccff);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: #000; font-size: 18px;
}
.chat-item .info { flex: 1; }
.chat-item .name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.chat-item .msg { font-size: 13px; color: #888; }
.chat-item .time { font-size: 11px; color: #555; }

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(15,15,15,0.95);
  backdrop-filter: blur(10px);
  border-top: 1px solid #1f1f1f;
  display: flex; justify-content: space-around;
  padding: 8px 0; z-index: 50;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 6px 16px; cursor: pointer;
  color: #666; font-size: 10px;
  background: none; border: none;
}
.nav-item.active { color: #00ffaa; }
.nav-item .icon { font-size: 22px; }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-bg"></div>
  <div class="login-box">
    <h1 id="authTitle">Welcome to ISHNTT</h1>
    <p class="sub" id="authSubtitle">Login karo ya naya account banao</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="setMode(true)">Login</button>
      <button class="auth-tab" id="signupTab" onclick="setMode(false)">Sign Up</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="input-wrap" id="usernameWrap" style="display:none;">
      <input type="text" id="usernameInput" placeholder="Username (unique)">
      <span class="icon">@</span>
    </div>

    <div class="input-wrap">
      <input type="email" id="emailInput" placeholder="Email address">
      <span class="icon">✉</span>
    </div>

    <div class="input-wrap">
      <input type="password" id="passwordInput" placeholder="Password (min 6 chars)">
      <span class="icon" onclick="togglePassword()">👁</span>
    </div>

    <button class="login-btn" id="authBtn" onclick="handleAuth()">Login</button>

    <button class="google-btn" onclick="googleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="G">
      Continue with Google
    </button>

    <button class="skip-btn" onclick="skipAuth()">Skip for now →</button>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="mainApp">
  <header>
    <div class="logo">ISHNTT</div>
    <div class="header-actions">
      <div class="icon-header" onclick="openChat()" style="position:relative;">
        💬 <span class="badge">3</span>
      </div>
      <div class="icon-header" onclick="handleBadgeClick()">👤</div>
    </div>
  </header>

  <div class="container">
    <div class="user-bar">
      <span>👤 <span class="badge-name" id="userBadge">Guest</span></span>
      <span class="limit" id="limitWarn"></span>
      <button class="logout" id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
    </div>

    <div class="post-box">
      <div class="avatar" id="postAvatar">G</div>
      <button class="upload-btn" onclick="handleUploadClick()">What's on your mind? Share a photo...</button>
    </div>

    <div id="loading" class="loading">⏳ Uploading...</div>
    <div id="emptyMsg" class="empty">
      <h3>Abhi koi image nahi hai</h3>
      <p>"+ Post" dabao aur apni pehli image upload karo!</p>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active"><span class="icon">🏠</span> Home</button>
    <button class="nav-item" onclick="alert('Explore jald!')"><span class="icon">🔍</span> Explore</button>
    <button class="nav-item" onclick="handleUploadClick()"><span class="icon">➕</span> Post</button>
    <button class="nav-item" onclick="openChat()"><span class="icon">💬</span> Chat</button>
    <button class="nav-item" onclick="handleBadgeClick()"><span class="icon">👤</span> Profile</button>
  </div>
</div>

<!-- ===== CHAT PANEL ===== -->
<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <button class="back" onclick="closeChat()">←</button>
    <h2>Chats</h2>
  </div>
  <div class="chat-list">
    <div class="chat-item" onclick="alert('Chat feature jald aa raha hai!')">
      <div class="avatar">A</div>
      <div class="info">
        <div class="name">arjun_99</div>
        <div class="msg">Bhai photo kaisi lagi?</div>
      </div>
      <div class="time">2m</div>
    </div>
    <div class="chat-item" onclick="alert('Chat feature jald aa raha hai!')">
      <div class="avatar">P</div>
      <div class="info">
        <div class="name">priya_sharma</div>
        <div class="msg">Thanks for the like! 😊</div>
      </div>
      <div class="time">15m</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJkg8OOu3szJmBnvbbND6BJYT_9aQVExg",
  authDomain: "ishntt-f8b74.firebaseapp.com",
  projectId: "ishntt-f8b74",
  storageBucket: "ishntt-f8b74.firebasestorage.app",
  messagingSenderId: "1002308007099",
  appId: "1:1002308007099:web:ed0f89596a74f522bba59e",
  measurementId: "G-7L1X880XLS"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

const WORKER_URL = "https://ishntbot.ishantgiri2004g.workers.dev";
const loginScreen = document.getElementById('loginScreen');
const mainApp = document.getElementById('mainApp');
const errorMsg = document.getElementById('errorMsg');
const userBadge = document.getElementById('userBadge');
const logoutBtn = document.getElementById('logoutBtn');
const limitWarn = document.getElementById('limitWarn');
const postAvatar = document.getElementById('postAvatar');
const usernameWrap = document.getElementById('usernameWrap');
const gallery = document.getElementById('gallery');
const loading = document.getElementById('loading');
const emptyMsg = document.getElementById('emptyMsg');
const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = 'image/*';
document.body.appendChild(fileInput);

let currentUser = null;
let isLoginMode = true;
const GUEST_LIMIT = 10;

function getGuestCount() { return parseInt(localStorage.getItem('ishntt_guest_uploads') || '0'); }
function incGuestCount() {
  const c = getGuestCount() + 1;
  localStorage.setItem('ishntt_guest_uploads', c);
  updateLimit();
}
function updateLimit() {
  if (currentUser) { limitWarn.textContent = ''; return; }
  const used = getGuestCount();
  limitWarn.textContent = used >= GUEST_LIMIT ? '⚠️ Limit khatam' : `${used}/${GUEST_LIMIT}`;
}

window.setMode = function(loginMode) {
  isLoginMode = loginMode;
  document.getElementById('loginTab').classList.toggle('active', loginMode);
  document.getElementById('signupTab').classList.toggle('active', !loginMode);
  document.getElementById('authTitle').textContent = loginMode ? 'Welcome Back' : 'Create Account';
  document.getElementById('authSubtitle').textContent = loginMode ? 'Login karo apne account me' : 'Naya account banao';
  document.getElementById('authBtn').textContent = loginMode ? 'Login' : 'Sign Up';
  usernameWrap.style.display = loginMode ? 'none' : 'block';
  errorMsg.style.display = 'none';
};

window.togglePassword = function() {
  const i = document.getElementById('passwordInput');
  i.type = i.type === 'password' ? 'text' : 'password';
};

function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; }

window.handleAuth = async function() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const username = document.getElementById('usernameInput').value.trim().toLowerCase();
  errorMsg.style.display = 'none';

  if (!email || !password) { showError('Email aur password dono daalo!'); return; }
  if (password.length < 6) { showError('Password kam se kam 6 characters!'); return; }

  if (!isLoginMode) {
    if (!username) { showError('Username daalo!'); return; }
    if (username.length < 3) { showError('Username kam se kam 3 characters!'); return; }
    if (!/^[a-z0-9_]+$/.test(username)) { showError('Sirf small letters, numbers, _ allowed!'); return; }
    try {
      const snap = await getDoc(doc(db, 'usernames', username));
      if (snap.exists()) { showError('Ye username already le liya gaya hai!'); return; }
    } catch (e) { showError('Check fail: ' + e.message); return; }
  }

  try {
    if (isLoginMode) {
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, 'usernames', username), {
        uid: cred.user.uid, email: cred.user.email, createdAt: Date.now()
      });
      await updateProfile(cred.user, { displayName: username });
    }
  } catch (err) {
    showError(err.message.replace('Firebase: ', ''));
  }
};

window.googleLogin = async function() {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    const user = result.user;
    const baseUsername = (user.displayName || user.email.split('@')[0]).toLowerCase().replace(/[^a-z0-9_]/g, '');
    const snap = await getDoc(doc(db, 'usernames', baseUsername));
    if (!snap.exists()) {
      await setDoc(doc(db, 'usernames', baseUsername), {
        uid: user.uid, email: user.email, createdAt: Date.now()
      });
      if (!user.displayName) await updateProfile(user, { displayName: baseUsername });
    }
  } catch (err) { showError(err.message); }
};

window.skipAuth = function() {
  loginScreen.classList.add('hidden');
  mainApp.classList.add('active');
  userBadge.textContent = 'Guest';
  updateLimit();
  loadAllImages();
};

window.logout = async function() { await signOut(auth); };

window.handleBadgeClick = function() {
  if (!currentUser) {
    loginScreen.classList.remove('hidden');
    mainApp.classList.remove('active');
  } else {
    changeUsername();
  }
};

window.changeUsername = async function() {
  const newU = prompt('Naya username daalo:', currentUser.name);
  if (!newU) return;
  const clean = newU.trim().toLowerCase();
  if (clean.length < 3) { alert('Kam se kam 3 characters!'); return; }
  if (!/^[a-z0-9_]+$/.test(clean)) { alert('Sirf small letters, numbers, _ !'); return; }
  if (clean === currentUser.name) return;

  try {
    const snap = await getDoc(doc(db, 'usernames', clean));
    if (snap.exists()) { alert('Ye username already le liya gaya hai!'); return; }
    await deleteDoc(doc(db, 'usernames', currentUser.name));
    await setDoc(doc(db, 'usernames', clean), {
      uid: currentUser.uid, email: currentUser.email, createdAt: Date.now()
    });
    await updateProfile(auth.currentUser, { displayName: clean });
    currentUser.name = clean;
    userBadge.textContent = clean;
    postAvatar.textContent = clean[0].toUpperCase();
    alert('Username change ho gaya! ✅');
  } catch (e) { alert('Fail: ' + e.message); }
};

window.handleUploadClick = function() {
  if (!currentUser && getGuestCount() >= GUEST_LIMIT) {
    alert('10 uploads ki limit khatam. Login karo!');
    loginScreen.classList.remove('hidden');
    mainApp.classList.remove('active');
    return;
  }
  fileInput.click();
};

window.openChat = function() { document.getElementById('chatPanel').classList.add('open'); };
window.closeChat = function() { document.getElementById('chatPanel').classList.remove('open'); };

// ====== UPLOAD ======
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!currentUser && getGuestCount() >= GUEST_LIMIT) {
    alert('Limit khatam. Login karo!');
    return;
  }
  loading.style.display = 'block';
  emptyMsg.style.display = 'none';
  const fd = new FormData();
  fd.append('file', file);
  fd.append('username', currentUser ? currentUser.name : 'Guest');
  fd.append('uid', currentUser ? currentUser.uid : 'guest_' + Date.now());

  try {
    const res = await fetch(`${WORKER_URL}/upload`, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.id) {
      if (!currentUser) incGuestCount();
      setTimeout(loadAllImages, 800);
    } else alert('Upload fail: ' + (data.error || 'Unknown'));
  } catch (err) { alert('Error: ' + err.message); }
  finally { loading.style.display = 'none'; fileInput.value = ''; }
});

// ====== GALLERY ======
async function loadAllImages() {
  try {
    const res = await fetch(`${WORKER_URL}/list`);
    const data = await res.json();
    gallery.innerHTML = '';
    if (data.images && data.images.length > 0) {
      emptyMsg.style.display = 'none';
      data.images.forEach(img => renderCard(img));
    } else {
      emptyMsg.style.display = 'block';
    }
  } catch (err) { console.error(err); }
}

function renderCard(img) {
  const isOwner = currentUser && img.uid === currentUser.uid;
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card_' + img.id;

  let actionsHTML = '';
  if (isOwner) {
    actionsHTML = `
      <div class="action-btns">
        <button class="icon-btn" onclick="editCaption('${img.id}')">✏️</button>
        <button class="icon-btn del" onclick="deleteImage('${img.id}')">🗑</button>
      </div>
    `;
  }

  const canComment = currentUser !== null;

  card.innerHTML = `
    <div class="card-img-wrap">
      <img src="${WORKER_URL}/image/${img.id}" loading="lazy" alt="image">
      ${isOwner ? '<span class="card-badge">Yours</span>' : ''}
    </div>
    <div class="card-body">
      <div class="uploader">📷 ${escapeHtml(img.username || 'Unknown')}</div>
      <div class="caption" id="caption_${img.id}">${escapeHtml(img.caption || '')}</div>
      <div class="actions">
        ${actionsHTML}
        <span class="comment-count">💬 ${img.comments.length}</span>
      </div>
      <div class="comments" id="comments_${img.id}">
        ${img.comments.map(c => `<div class="comment"><b>${escapeHtml(c.username || 'Anon')}:</b> ${escapeHtml(c.text)}</div>`).join('')}
      </div>
      <div class="comment-input">
        <input type="text" id="input_${img.id}" placeholder="${canComment ? 'Comment...' : 'Login to comment'}" ${canComment ? '' : 'disabled'}>
        <button onclick="addComment('${img.id}')" ${canComment ? '' : 'disabled'}>Post</button>
      </div>
    </div>
  `;
  gallery.appendChild(card);
}

window.deleteImage = async function(id) {
  if (!confirm('Delete kar dein?')) return;
  try {
    await fetch(`${WORKER_URL}/delete/${id}`, { method: 'DELETE' });
    document.getElementById('card_' + id).remove();
  } catch (err) { alert('Delete fail'); }
};

window.editCaption = async function(id) {
  const el = document.getElementById('caption_' + id);
  const newCap = prompt('Naya caption:', el.textContent);
  if (newCap === null) return;
  try {
    await fetch(`${WORKER_URL}/edit/${id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ caption: newCap })
    });
    el.textContent = newCap;
  } catch (err) { alert('Edit fail'); }
};

window.addComment = async function(id) {
  if (!currentUser) { alert('Login karo!'); return; }
  const input = document.getElementById('input_' + id);
  const text = input.value.trim();
  if (!text) return;
  try {
    const res = await fetch(`${WORKER_URL}/comment/${id}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, username: currentUser.name })
    });
    const data = await res.json();
    if (data.success) {
      input.value = '';
      const cDiv = document.getElementById('comments_' + id);
      const div = document.createElement('div');
      div.className = 'comment';
      div.innerHTML = `<b>${escapeHtml(currentUser.name)}:</b> ${escapeHtml(text)}`;
      cDiv.appendChild(div);
      document.querySelector(`#card_${id} .comment-count`).textContent = '💬 ' + data.comments.length;
    }
  } catch (err) { alert('Comment fail'); }
};

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

// ====== AUTH STATE ======
onAuthStateChanged(auth, async (user) => {
  if (user) {
    let name = user.displayName || user.email.split('@')[0];
    currentUser = { uid: user.uid, email: user.email, name };
    userBadge.textContent = name;
    postAvatar.textContent = name[0].toUpperCase();
    logoutBtn.style.display = 'inline-block';
    loginScreen.classList.add('hidden');
    mainApp.classList.add('active');
    updateLimit();
    loadAllImages();
  } else {
    currentUser = null;
    userBadge.textContent = 'Guest';
    postAvatar.textContent = 'G';
    logoutBtn.style.display = 'none';
    updateLimit();
  }
});
</script>
