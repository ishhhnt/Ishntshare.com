<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISHNTTCHAT</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { 
  background: #0a0a0a; color: #fff; height: 100vh; overflow: hidden;
  background-image: 
    radial-gradient(circle at 20% 10%, rgba(0, 255, 170, 0.08), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(0, 150, 255, 0.08), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(150, 0, 255, 0.05), transparent 60%);
}

/* ===== GLASS BASE ===== */
.glass {
  background: rgba(30, 30, 35, 0.5);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.glass-strong {
  background: rgba(20, 20, 25, 0.7);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* ===== LOGIN ===== */
#loginScreen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
#loginScreen.hide { display: none; }
.login-bg {
  position: absolute; inset: 0;
  background: 
    radial-gradient(circle at 30% 20%, rgba(0, 255, 170, 0.2), transparent 50%),
    radial-gradient(circle at 70% 80%, rgba(0, 150, 255, 0.15), transparent 50%),
    linear-gradient(135deg, #1a2a2a 0%, #0a0a0a 50%, #0a1a2a 100%);
}
.login-box {
  position: relative; width: 100%; max-width: 360px;
  padding: 32px 26px;
  background: rgba(30, 30, 35, 0.4);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.login-box h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; }
.login-box h1 span { 
  background: linear-gradient(135deg, #00ffaa, #00ccff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.login-box .sub { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 26px; }
.tabs { display: flex; padding: 4px; margin-bottom: 18px; background: rgba(0,0,0,0.3); border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); }
.tab { flex: 1; padding: 10px; border: none; background: transparent; color: rgba(255,255,255,0.5); font-weight: 700; font-size: 13px; border-radius: 10px; cursor: pointer; transition: all 0.25s; }
.tab.on { background: linear-gradient(135deg, #00ffaa, #00ccaa); color: #000; box-shadow: 0 4px 16px rgba(0, 255, 170, 0.3); }

input.field { 
  width: 100%; padding: 14px 16px; margin-bottom: 10px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff; font-size: 14px; border-radius: 14px; outline: none;
  transition: all 0.25s;
}
input.field:focus { border-color: rgba(0, 255, 170, 0.5); background: rgba(0, 255, 170, 0.05); }
input.field::placeholder { color: rgba(255,255,255,0.35); }

.btn { 
  width: 100%; padding: 14px; border: none; border-radius: 14px;
  font-size: 14px; font-weight: 800; cursor: pointer; margin-bottom: 10px;
  transition: all 0.2s;
}
.btn:active { transform: scale(0.97); }
.btn-green { 
  background: linear-gradient(135deg, #00ffaa, #00ccaa);
  color: #000; box-shadow: 0 8px 24px rgba(0, 255, 170, 0.25);
}
.btn-white { 
  background: rgba(255, 255, 255, 0.95); color: #000;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 13px; font-weight: 700; padding: 12px;
}
.btn-ghost { 
  background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6);
  border: 1px solid rgba(255,255,255,0.08);
  font-weight: 600; font-size: 13px; padding: 12px;
}
.err { color: #ff5577; font-size: 12px; margin-bottom: 10px; display: none; padding: 10px 12px; background: rgba(255, 85, 119, 0.1); border-radius: 10px; border: 1px solid rgba(255, 85, 119, 0.2); }

/* ===== APP ===== */
#app { display: none; height: 100vh; flex-direction: column; }
#app.on { display: flex; }

header { 
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  background: rgba(20, 20, 25, 0.6);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}
.logo { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { 
  background: linear-gradient(135deg, #00ffaa, #00ccff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.h-actions { display: flex; gap: 8px; align-items: center; }
.iconbtn { 
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff; width: 38px; height: 38px; border-radius: 50%;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  position: relative; transition: all 0.2s;
}
.iconbtn:hover { background: rgba(0, 255, 170, 0.15); border-color: rgba(0, 255, 170, 0.3); }
.iconbtn:active { transform: scale(0.92); }
.iconbtn .dot { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: #ff3355; display: none; box-shadow: 0 0 8px #ff3355; }
.iconbtn .dot.on { display: block; }
.postbtn { 
  background: linear-gradient(135deg, #00ffaa, #00ccaa);
  color: #000; border: none; padding: 10px 18px; border-radius: 22px;
  font-weight: 800; font-size: 13px; cursor: pointer;
  box-shadow: 0 4px 16px rgba(0, 255, 170, 0.3);
}
.postbtn:active { transform: scale(0.95); }

.searchWrap { padding: 12px 16px; }
.searchWrap input { 
  width: 100%; 
  background: rgba(30, 30, 35, 0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff; padding: 12px 18px; border-radius: 20px;
  font-size: 13px; outline: none;
}
.searchWrap input:focus { border-color: rgba(0, 255, 170, 0.5); }
.searchWrap input::placeholder { color: rgba(255,255,255,0.35); }

#gallery { flex: 1; overflow-y: auto; padding: 8px 12px 100px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }

.gcard { 
  background: rgba(30, 30, 35, 0.4);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 18px; overflow: hidden; cursor: pointer;
  transition: all 0.25s;
}
.gcard:active { transform: scale(0.97); }
.gcard:hover { border-color: rgba(0, 255, 170, 0.3); }
.gcard img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
.gcard .gbody { padding: 10px; }
.gcard .gname { font-size: 11px; color: #00ffaa; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.gcard .gcap { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gcard .gtags { font-size: 10px; color: #00ccff; margin-bottom: 6px; }
.gcard .grow { display: flex; justify-content: space-between; align-items: center; }
.gcard .gcnt { font-size: 10px; color: rgba(255,255,255,0.4); }
.empty { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.4); font-size: 14px; line-height: 1.6; }

/* ===== BOTTOM NAV (Image 5 inspired) ===== */
.bottomNav {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 4px; padding: 6px;
  background: rgba(20, 20, 25, 0.7);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 40px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  z-index: 100;
}
.navBtn {
  background: transparent; border: none; color: rgba(255,255,255,0.5);
  width: 56px; height: 56px; border-radius: 50%; font-size: 20px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s; position: relative;
}
.navBtn.active { 
  background: linear-gradient(135deg, rgba(0, 255, 170, 0.2), rgba(0, 204, 255, 0.2));
  color: #00ffaa;
  box-shadow: 0 0 20px rgba(0, 255, 170, 0.3);
}
.navBtn:active { transform: scale(0.9); }
.navBtn .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #ff3355; display: none; }
.navBtn .dot.on { display: block; }

/* ===== PANEL (Chat, Profile, Post View) ===== */
.panel {
  position: fixed; inset: 0;
  background: rgba(10, 10, 12, 0.85);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  z-index: 300; display: none; flex-direction: column;
  overflow-y: auto;
}
.panel.on { display: flex; }

.phead { 
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  position: sticky; top: 0;
  background: rgba(15, 15, 18, 0.6);
  backdrop-filter: blur(30px);
  z-index: 10;
}
.pback { 
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff; width: 36px; height: 36px; border-radius: 50%;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.pback:active { transform: scale(0.92); }
.phead h2 { font-size: 17px; font-weight: 700; }

.ptabs { display: flex; padding: 8px 12px; gap: 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
.ptab { 
  flex: 1; padding: 10px; text-align: center;
  color: rgba(255,255,255,0.5); font-weight: 700; font-size: 12px;
  cursor: pointer; border-radius: 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid transparent;
  transition: all 0.2s;
}
.ptab.on { background: rgba(0, 255, 170, 0.15); color: #00ffaa; border-color: rgba(0, 255, 170, 0.3); }

.plist { flex: 1; overflow-y: auto; padding: 6px 0; }
.chatrow { 
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; cursor: pointer;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  transition: background 0.2s;
}
.chatrow:hover { background: rgba(255, 255, 255, 0.04); }
.avatar { 
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, #00ffaa, #00ccff);
  color: #000; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; overflow: hidden;
  box-shadow: 0 4px 12px rgba(0, 255, 170, 0.2);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.chatrow .cinfo { flex: 1; min-width: 0; }
.chatrow .cname { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.chatrow .cmsg { font-size: 12px; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.searchbox { padding: 12px 16px; }
.searchbox input { 
  width: 100%; 
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff; padding: 12px 16px; border-radius: 20px;
  font-size: 13px; outline: none;
}
.searchbox input:focus { border-color: rgba(0, 255, 170, 0.5); }

.userrow { 
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; cursor: pointer;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  transition: background 0.2s;
}
.userrow:hover { background: rgba(255, 255, 255, 0.04); }
.userrow .uname { font-size: 14px; font-weight: 700; flex: 1; }
.userrow .uchat { color: #00ffaa; font-size: 12px; font-weight: 700; }
.pempty { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.4); font-size: 12px; line-height: 1.7; }

/* ===== MESSAGES ===== */
#msgView { 
  position: fixed; inset: 0;
  background: rgba(10, 10, 12, 0.9);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  z-index: 400; display: none; flex-direction: column;
}
#msgView.on { display: flex; }
.mhead { 
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(15, 15, 18, 0.6);
  backdrop-filter: blur(30px);
}
.mhead .avatar { width: 40px; height: 40px; font-size: 14px; }
.mhead .mname { font-size: 14px; font-weight: 700; }
.mhead .mstatus { font-size: 10px; color: #00ffaa; display: flex; align-items: center; gap: 4px; }
.mhead .mstatus::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #00ffaa; box-shadow: 0 0 6px #00ffaa; }
#msgBody { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }

.msg-row { display: flex; align-items: flex-end; gap: 8px; }
.msg-row.me { justify-content: flex-end; }
.msg { 
  max-width: 75%; padding: 10px 14px; border-radius: 20px;
  font-size: 13px; line-height: 1.45; word-break: break-word;
}
.msg.me { 
  background: linear-gradient(135deg, #00ffaa, #00ccaa);
  color: #000; border-bottom-right-radius: 6px;
  box-shadow: 0 4px 12px rgba(0, 255, 170, 0.2);
}
.msg.you { 
  background: rgba(40, 40, 45, 0.8);
  backdrop-filter: blur(20px);
  color: #fff; border-bottom-left-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.msg .mtime { font-size: 9px; opacity: 0.55; margin-top: 3px; display: block; text-align: right; }
.msg .medit { font-size: 9px; opacity: 0.55; margin-right: 4px; font-style: italic; }
.msg img { max-width: 100%; border-radius: 12px; margin-bottom: 4px; display: block; cursor: pointer; }
.msg-action { 
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff; width: 30px; height: 30px; border-radius: 50%;
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; opacity: 0.7;
  transition: all 0.2s;
}
.msg-action:hover { opacity: 1; background: rgba(0, 255, 170, 0.2); }

.mbottom { 
  display: flex; gap: 8px; padding: 12px 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(15, 15, 18, 0.6);
  backdrop-filter: blur(30px);
  align-items: center;
}
.mbottom .attach { 
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #00ffaa; width: 42px; height: 42px; border-radius: 50%;
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.mbottom .attach:active { transform: scale(0.92); }
.mbottom input { 
  flex: 1; background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff; padding: 12px 18px; border-radius: 24px;
  font-size: 13px; outline: none;
}
.mbottom input:focus { border-color: rgba(0, 255, 170, 0.5); }
.mbottom .send { 
  background: linear-gradient(135deg, #00ffaa, #00ccaa);
  color: #000; border: none; width: 42px; height: 42px;
  border-radius: 50%; font-size: 16px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 12px rgba(0, 255, 170, 0.3);
  transition: all 0.2s;
}
.mbottom .send:active { transform: scale(0.92); }

/* ===== MSG MENU (Bottom Sheet) ===== */
#msgMenu { 
  position: fixed; left: 50%; bottom: -100%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 400px;
  background: rgba(25, 25, 30, 0.9);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 24px 24px 0 0;
  padding: 8px; z-index: 500;
  transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
}
#msgMenu.on { bottom: 0; }
#msgMenu .handle { width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 4px; margin: 4px auto 12px; }
#msgMenu button { 
  width: 100%; background: rgba(255, 255, 255, 0.04);
  border: none; color: #fff; padding: 16px;
  text-align: left; font-size: 15px; font-weight: 600;
  cursor: pointer; border-radius: 14px; margin-bottom: 6px;
  display: flex; align-items: center; gap: 12px;
  transition: all 0.2s;
}
#msgMenu button:hover { background: rgba(255, 255, 255, 0.08); }
#msgMenu button.d { color: #ff5577; }
#msgMenu button.d:hover { background: rgba(255, 85, 119, 0.12); }
#msgMenu button .ic { font-size: 18px; width: 24px; text-align: center; }

#backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 150; display: none; }
#backdrop.on { display: block; }

/* ===== TOAST ===== */
#toast { 
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-100px);
  background: rgba(25, 25, 30, 0.9);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(0, 255, 170, 0.3);
  padding: 12px 16px; border-radius: 18px;
  z-index: 600; display: flex; gap: 10px; align-items: center;
  max-width: calc(100% - 32px); min-width: 280px;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 10px 40px rgba(0, 255, 170, 0.15);
}
#toast.on { transform: translateX(-50%) translateY(0); }
#toast .tinfo { flex: 1; min-width: 0; }
#toast .tname { font-size: 12px; color: #00ffaa; font-weight: 700; margin-bottom: 2px; }
#toast .tmsg { font-size: 12px; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===== MODAL ===== */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 700; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal.on { display: flex; }
.modal-box { 
  background: rgba(25, 25, 30, 0.9);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 24px; padding: 24px;
  width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
}
.modal-box h3 { font-size: 18px; margin-bottom: 14px; font-weight: 700; }
.modal-box textarea, .modal-box input { 
  width: 100%; background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff; padding: 13px 16px; border-radius: 14px;
  font-size: 14px; outline: none; margin-bottom: 10px;
  font-family: inherit; resize: vertical;
}
.modal-box textarea:focus, .modal-box input:focus { border-color: rgba(0, 255, 170, 0.5); }
.modal-box .preview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 12px; margin-bottom: 10px; }

/* ===== POST VIEW ===== */
.post-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); position: sticky; top: 0; background: rgba(15, 15, 18, 0.6); backdrop-filter: blur(30px); z-index: 10; }
.post-header .avatar { width: 40px; height: 40px; font-size: 14px; }
.post-header .pname { font-size: 14px; font-weight: 700; }
.post-img { width: 100%; max-height: 60vh; object-fit: contain; background: #000; display: block; }
.post-body { padding: 16px; }
.post-caption { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 10px; line-height: 1.5; }
.post-tags { font-size: 13px; color: #00ccff; margin-bottom: 14px; }
.post-actions-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.post-action-btn { 
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff; padding: 10px 16px; border-radius: 22px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.2s;
}
.post-action-btn:hover { background: rgba(0, 255, 170, 0.15); color: #00ffaa; border-color: rgba(0, 255, 170, 0.3); }
.post-action-btn.del:hover { background: rgba(255, 51, 85, 0.15); border-color: rgba(255, 51, 85, 0.3); color: #ff5577; }
.post-comments { margin-top: 10px; }
.post-comments h4 { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 10px; font-weight: 600; }

<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen">
  <div class="login-bg"></div>
  <div class="login-box">
    <h1>ISHNTT<span>CHAT</span></h1>
    <p class="sub">Share. Chat. Connect.</p>
    <div class="err" id="err"></div>
    <div class="tabs">
      <button class="tab on" id="tabLogin" onclick="setMode(true)">Login</button>
      <button class="tab" id="tabSignup" onclick="setMode(false)">Sign Up</button>

    <input type="text" class="field" id="inUser" placeholder="Username (unique)" style="display:none;">

      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" height="16" alt="G">

<!-- ===== APP ===== -->
<div id="app">
  <header>

      <button class="iconbtn" onclick="openChat()">💬<span class="dot" id="chatDot"></span></button>
      <button class="iconbtn" onclick="openProfile()">👤</button>

  </header>

  <div class="searchWrap">
    <input type="text" id="mainSearch" placeholder="🔍 Search... try #anime #nature #cars" oninput="filterBySearch(this.value)">
  </div>

    <div class="empty" id="gEmpty">Abhi koi post nahi hai<br>"+ Post" dabao aur upload karo!</div>

  <!-- BOTTOM NAV (Image 5 inspired) -->
  <div class="bottomNav">
    <button class="navBtn active" onclick="switchNav('home')" title="Home">🏠</button>
    <button class="navBtn" onclick="switchNav('search')" title="Search">🔍</button>
    <button class="navBtn" onclick="pickImage()" title="Post">➕</button>
    <button class="navBtn" onclick="openChat()" title="Chat">💬<span class="dot" id="navChatDot"></span></button>
    <button class="navBtn" onclick="openProfile()" title="Profile">👤</button>

  <input type="file" id="fileIn" accept="image/*" style="display:none;">
  <input type="file" id="chatImgIn" accept="image/*" style="display:none;">
  <input type="file" id="profilePicIn" accept="image/*" style="display:none;">

<!-- ===== UPLOAD MODAL ===== -->
<div class="modal" id="uploadModal">
  <div class="modal-box">
    <h3>New Post</h3>
    <img id="uploadPreview" class="preview" style="display:none;">
    <textarea id="uploadCaption" placeholder="Caption likho..." rows="2"></textarea>
    <input type="text" id="uploadTags" placeholder="#hashtags (jaise #anime #nature #cars)">
    <button class="btn btn-green" onclick="submitPost()">Share Post</button>
    <button class="btn btn-ghost" onclick="closeUpload()">Cancel</button>
  </div>
</div>

<!-- ===== CHAT PANEL ===== -->
<div id="backdrop" onclick="handleBackdrop()"></div>
<div class="panel" id="chatPanel">
  <div class="phead">
    <button class="pback" onclick="closeChat()">←</button>
    <h2>Chats</h2>
  </div>
  <div class="ptabs">
    <div class="ptab on" id="ptabChats" onclick="switchTab('chats')">💬 Chats</div>
    <div class="ptab" id="ptabSearch" onclick="switchTab('search')">🔍 Search</div>
  </div>
  <div class="plist" id="chatsList">
    <div class="pempty" id="chatsEmpty">Abhi koi chat nahi.<br>Search se kisi ko dhoondo!</div>
  </div>
  <div class="plist" id="searchList" style="display:none;">
    <div class="searchbox">
      <input type="text" id="searchIn" placeholder="Username search..." oninput="searchUsers(this.value)">
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<!-- ===== MSG VIEW ===== -->
<div id="msgView">
  <div class="mhead">
    <button class="pback" onclick="closeMsg()">←</button>
    <div class="avatar" id="mAvatar">U</div>
    <div>
      <div class="mname" id="mName">User</div>
      <div class="mstatus">online</div>
    </div>
  </div>
  <div id="msgBody"></div>
  <div class="mbottom">

    <input type="text" id="msgIn" placeholder="Message..." onkeypress="if(event.key==='Enter')sendMsg()">

<!-- ===== MSG MENU ===== -->
<div id="msgMenu">

  <button id="editOpt" onclick="editMsg()"><span class="ic">✏️</span> Edit Message</button>
  <button class="d" onclick="deleteMsg()"><span class="ic">🗑</span> Delete Message</button>
</div>

<!-- ===== POST VIEW ===== -->
<div class="panel" id="postView">
  <div class="post-header">
    <button class="pback" onclick="closePostView()">←</button>
    <div class="avatar" id="pvAvatar">U</div>
    <div>
      <div class="pname" id="pvName">User</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.4);" id="pvTime">just now</div>
    </div>
  </div>
  <img id="pvImage" class="post-img">
  <div class="post-body">
    <div class="post-caption" id="pvCaption"></div>
    <div class="post-tags" id="pvTags"></div>
    <div class="post-actions-row">
      <button class="post-action-btn" onclick="downloadPost()">⬇️ Download</button>
      <button class="post-action-btn" id="pvEditBtn" onclick="editPostFromView()">✏️ Edit</button>
      <button class="post-action-btn del" id="pvDelBtn" onclick="deletePostFromView()">🗑 Delete</button>
    </div>
    <div class="post-comments">
      <h4>Comments (<span id="pvCommentCount">0</span>)</h4>
      <div id="pvComments"></div>
      <div class="post-comment-input">
        <input type="text" id="pvCommentInput" placeholder="Comment...">
        <button onclick="addPvComment()">Post</button>
      </div>

</div>

<!-- ===== PROFILE VIEW (Image 2 inspired) ===== -->
<div class="panel" id="profileView">
  <div class="phead">
    <button class="pback" onclick="closeProfile()">←</button>
    <h2>Profile</h2>
  </div>
  <div class="profile-wrap">
    <div class="profile-card">
      <div class="profile-pic" id="profilePic" onclick="changeProfilePic()">
        <span id="profilePicText">U</span>
      </div>
      <div class="profile-name" id="profileName">User</div>
      <div class="profile-email" id="profileEmail">email@example.com</div>
      <div class="stats-grid">
        <div class="stat-card"><b id="statPosts">0</b><span>Posts</span></div>
        <div class="stat-card"><b id="statChats">0</b><span>Chats</span></div>
      </div>
      <div class="profile-actions">
        <button onclick="changeUsername()">✏️ Change Username</button>
        <button onclick="changeProfilePic()">📷 Change Photo</button>
        <button class="danger" onclick="doLogout()">🚪 Logout</button>
      </div>

      <h4>My Posts</h4>
      <div class="profile-grid" id="profileGrid"></div>
    </div>

</div>

<!-- ===== TOAST ===== -->
<div id="toast">
  <div class="avatar" id="toastAvatar">U</div>
  <div class="tinfo">
    <div class="tname" id="toastName">User</div>
    <div class="tmsg" id="toastMsg">Hello</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJkg8OOu3szJmBnvbbND6BJYT_9aQVExg",
  authDomain: "ishntt-f8b74.firebaseapp.com",
  projectId: "ishntt-f8b74",
  storageBucket: "ishntt-f8b74.firebasestorage.app",
  messagingSenderId: "1002308007099",
  appId: "1:1002308007099:web:ed0f89596a74f522bba59e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();
const WORKER_URL = "https://ishntbot.ishantgiri2004g.workers.dev";

let currentUser = null, isGuest = false, isLoginMode = true;
let activeChatId = null, activeChatUser = null;
let unsubMsgs = null, unsubChats = null, unsubNotif = null;
let selectedMsgId = null, selectedMsgText = '';
let currentPost = null;
let allImages = [];
let currentFilter = '';
let pendingFile = null;
let knownMsgIds = new Set();
const GUEST_LIMIT = 10;

const $ = id => document.getElementById(id);
const guestCount = () => parseInt(localStorage.getItem('ishntt_gu') || '0');
const incGuest = () => { localStorage.setItem('ishntt_gu', guestCount() + 1); };

// ===== USER PROFILE CACHE =====
const userCache = {};
async function getUserProfile(uid) {
  if (!uid || uid === 'unknown' || (uid && uid.startsWith('guest_'))) {
    return { username: 'Guest', profilePic: '' };
  }
  if (userCache[uid]) return userCache[uid];
  try {
    const snap = await getDoc(doc(db, 'users', uid));
    if (snap.exists()) {
      const d = snap.data();
      userCache[uid] = { username: d.username || 'User', profilePic: d.profilePic || '' };
      return userCache[uid];
    }
  } catch (e) { console.log('getUserProfile error:', e); }
  return { username: 'User', profilePic: '' };
}

window.setMode = m => {
  isLoginMode = m;
  $('tabLogin').classList.toggle('on', m);
  $('tabSignup').classList.toggle('on', !m);
  $('authBtn').textContent = m ? 'Login' : 'Sign Up';
  $('inUser').style.display = m ? 'none' : 'block';
  $('err').style.display = 'none';
};

window.doAuth = async () => {
  const email = $('inEmail').value.trim(), pass = $('inPass').value, user = $('inUser').value.trim().toLowerCase();
  $('err').style.display = 'none';
  if (!email || !pass) return showErr('Email aur password daalo!');
  if (pass.length < 6) return showErr('Password min 6 chars!');
  if (!isLoginMode) {
    if (!user) return showErr('Username daalo!');
    if (user.length < 3 || !/^[a-z0-9_]+$/.test(user)) return showErr('Username: small letters, numbers, _ only!');
    const s = await getDoc(doc(db, 'usernames', user));
    if (s.exists()) return showErr('Ye username already le liya gaya hai!');
  }
  try {
    if (isLoginMode) await signInWithEmailAndPassword(auth, email, pass);
    else {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, 'usernames', user), { uid: c.user.uid, email, createdAt: Date.now() });
      await setDoc(doc(db, 'users', c.user.uid), { username: user, email, createdAt: Date.now() });
      await updateProfile(c.user, { displayName: user });
    }
  } catch (e) { showErr(e.message.replace('Firebase: ', '')); }
};

window.doGoogle = async () => {
  try {
    const r = await signInWithPopup(auth, googleProvider);
    const u = r.user;
    let base = (u.displayName || u.email.split('@')[0]).toLowerCase().replace(/[^a-z0-9_]/g, '');
    let s = await getDoc(doc(db, 'usernames', base));
    if (s.exists() && s.data().uid !== u.uid) base = base + '_' + Math.floor(Math.random() * 9999);
    if (!s.exists()) {
      await setDoc(doc(db, 'usernames', base), { uid: u.uid, email: u.email, createdAt: Date.now() });
      await setDoc(doc(db, 'users', u.uid), { username: base, email: u.email, createdAt: Date.now() });
      await updateProfile(u, { displayName: base });
    } else if (s.data().uid === u.uid) await updateProfile(u, { displayName: base });
  } catch (e) { showErr(e.message); }
};

window.doSkip = () => {
  isGuest = true;
  currentUser = { uid: 'guest_' + Date.now(), email: '', name: 'Guest' };
  $('loginScreen').classList.add('hide');
  $('app').classList.add('on');
  loadImages();
};

window.doLogout = async () => { await signOut(auth); isGuest = false; };

function showErr(m) { $('err').textContent = m; $('err').style.display = 'block'; }

// ===== NAV =====
window.switchNav = (which) => {
  document.querySelectorAll('.navBtn').forEach(b => b.classList.remove('active'));
  event.target.closest('.navBtn').classList.add('active');
  if (which === 'home') {
    closeChat(); closeProfile();
  } else if (which === 'search') {
    closeProfile();
    $('mainSearch').focus();
  }
};

// ===== IMAGE UPLOAD =====
window.pickImage = () => {
  if (isGuest && guestCount() >= GUEST_LIMIT) { alert('Limit khatam! Login karo!'); $('loginScreen').classList.remove('hide'); return; }
  $('fileIn').click();
};

$('fileIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  pendingFile = f;
  const reader = new FileReader();
  reader.onload = ev => { $('uploadPreview').src = ev.target.result; $('uploadPreview').style.display = 'block'; };
  reader.readAsDataURL(f);
  $('uploadModal').classList.add('on');
};

window.closeUpload = () => { $('uploadModal').classList.remove('on'); pendingFile = null; $('uploadPreview').style.display = 'none'; $('uploadCaption').value = ''; $('uploadTags').value = ''; $('fileIn').value = ''; };

window.submitPost = async () => {
  if (!pendingFile) return;
  const caption = $('uploadCaption').value.trim();
  const tags = $('uploadTags').value.trim();
  if (isGuest && guestCount() >= GUEST_LIMIT) return alert('Limit khatam!');
  const fd = new FormData();
  fd.append('file', pendingFile);
  fd.append('username', currentUser && !isGuest ? currentUser.name : 'Guest');
  fd.append('uid', currentUser && !isGuest ? currentUser.uid : 'guest_' + Date.now());
  fd.append('caption', caption);
  fd.append('tags', tags);
  try {
    const r = await fetch(`${WORKER_URL}/upload`, { method: 'POST', body: fd });
    const d = await r.json();
    if (d.id) { if (isGuest) incGuest(); closeUpload(); setTimeout(loadImages, 500); }
    else alert('Upload fail');
  } catch (er) { alert('Error: ' + er.message); }
};

// ===== GALLERY =====
async function loadImages() {
  try {
    const r = await fetch(`${WORKER_URL}/list`);
    const d = await r.json();
    allImages = d.images || [];
    renderGallery();
  } catch (e) {}
}

async function renderGallery() {
  const grid = $('gGrid');
  grid.innerHTML = '';
  let filtered = allImages;
  if (currentFilter) {
    const f = currentFilter.toLowerCase();
    filtered = allImages.filter(im => {
      const tags = (im.tags || '').toLowerCase();
      const cap = (im.caption || '').toLowerCase();
      const un = (im.username || '').toLowerCase();
      return tags.includes(f) || cap.includes(f) || un.includes(f);
    });
  }
  if (filtered.length > 0) {
    $('gEmpty').style.display = 'none';
    for (const im of filtered) {
      const card = await makeCard(im);
      grid.appendChild(card);
    }
  } else {
    $('gEmpty').style.display = 'block';
    $('gEmpty').textContent = currentFilter ? 'Koi post nahi mila' : 'Abhi koi post nahi hai';
  }
}

async function makeCard(im) {
  const c = document.createElement('div');
  c.className = 'gcard';
  c.onclick = () => openPostView(im);
  const tagList = (im.tags || '').split(' ').filter(t => t).map(t => t.startsWith('#') ? t : '#' + t).join(' ');
  const profile = await getUserProfile(im.uid);
  const picHTML = profile.profilePic
    ? `<img src="${profile.profilePic}" style="width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;">`
    : `<div style="width:18px;height:18px;border-radius:50%;background:#00ffaa;color:#000;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${(profile.username || 'U')[0].toUpperCase()}</div>`;
  c.innerHTML = `
    <img src="${WORKER_URL}/image/${im.id}" loading="lazy">
    <div class="gbody">
      <div class="gname">${picHTML}<span>${esc(profile.username || im.username || 'Unknown')}</span></div>
      <div class="gcap">${esc(im.caption || '')}</div>
      ${tagList ? `<div class="gtags">${esc(tagList)}</div>` : ''}
      <div class="grow"><span class="gcnt">💬 ${(im.comments || []).length}</span></div>
    </div>`;
  return c;
}

window.filterBySearch = v => { currentFilter = v.trim(); renderGallery(); };

// ===== POST VIEW =====
window.openPostView = async (im) => {
  currentPost = im;
  $('pvImage').src = `${WORKER_URL}/image/${im.id}`;
  const profile = await getUserProfile(im.uid);
  $('pvAvatar').innerHTML = profile.profilePic
    ? `<img src="${profile.profilePic}" style="width:100%;height:100%;object-fit:cover;">`
    : (profile.username || 'U')[0].toUpperCase();
  $('pvName').textContent = profile.username || im.username || 'Unknown';
  $('pvTime').textContent = im.date ? new Date(im.date).toLocaleString() : 'just now';
  $('pvCaption').textContent = im.caption || '';
  const tagList = (im.tags || '').split(' ').filter(t => t).map(t => t.startsWith('#') ? t : '#' + t).join(' ');
  $('pvTags').textContent = tagList;
  $('pvCommentCount').textContent = (im.comments || []).length;
  $('pvComments').innerHTML = (im.comments || []).map(c => `<div class="post-comment"><b>${esc(c.username || 'Anon')}:</b> ${esc(c.text)}</div>`).join('');
  const isOwn = currentUser && !isGuest && im.uid === currentUser.uid;
  $('pvEditBtn').style.display = isOwn ? 'flex' : 'none';
  $('pvDelBtn').style.display = isOwn ? 'flex' : 'none';
  $('postView').classList.add('on');
};

window.closePostView = () => { $('postView').classList.remove('on'); currentPost = null; };

window.downloadPost = async () => {
  if (!currentPost) return;
  try {
    const url = `${WORKER_URL}/image/${currentPost.id}`;
    const r = await fetch(url);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ishntt_${currentPost.id}.jpg`;
    a.click();
  } catch (e) { alert('Download fail: ' + e.message); }
};

window.editPostFromView = async () => {
  if (!currentPost) return;
  const n = prompt('Naya caption:', currentPost.caption || '');
  if (n === null) return;
  const t = prompt('Naye tags:', currentPost.tags || '');
  if (t === null) return;
  await fetch(`${WORKER_URL}/edit/${currentPost.id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ caption: n, tags: t })
  });
  currentPost.caption = n; currentPost.tags = t;
  $('pvCaption').textContent = n;
  const tagList = (t || '').split(' ').filter(x => x).map(x => x.startsWith('#') ? x : '#' + x).join(' ');
  $('pvTags').textContent = tagList;
  loadImages();
};

window.deletePostFromView = async () => {
  if (!currentPost) return;
  if (!confirm('Delete?')) return;
  await fetch(`${WORKER_URL}/delete/${currentPost.id}`, { method: 'DELETE' });
  closePostView();
  loadImages();
};

window.addPvComment = async () => {
  if (!currentPost) return;
  if (!currentUser || isGuest) { $('loginScreen').classList.remove('hide'); return; }
  const inp = $('pvCommentInput');
  const t = inp.value.trim(); if (!t) return;
  const r = await fetch(`${WORKER_URL}/comment/${currentPost.id}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: t, username: currentUser.name })
  });
  const d = await r.json();
  if (d.success) {
    inp.value = '';
    const cmts = $('pvComments');
    const div = document.createElement('div');
    div.className = 'post-comment';
    div.innerHTML = `<b>${esc(currentUser.name)}:</b> ${esc(t)}`;
    cmts.appendChild(div);
    $('pvCommentCount').textContent = d.comments.length;
    currentPost.comments = d.comments;
  }
};

// ===== CHAT =====
window.openChat = () => {
  $('chatPanel').classList.add('on');
  $('backdrop').classList.add('on');
  $('chatDot').classList.remove('on');
  $('navChatDot').classList.remove('on');
  if (currentUser && !isGuest) loadChats();
  else $('chatsList').innerHTML = '<div class="pempty">Login karo!</div>';
};
window.closeChat = () => { $('chatPanel').classList.remove('on'); $('backdrop').classList.remove('on'); };
window.switchTab = t => {
  $('ptabChats').classList.toggle('on', t === 'chats');
  $('ptabSearch').classList.toggle('on', t === 'search');
  $('chatsList').style.display = t === 'chats' ? 'block' : 'none';
  $('searchList').style.display = t === 'search' ? 'block' : 'none';
};

window.searchUsers = async q => {
  const res = $('searchResults');
  if (q.length < 2) { res.innerHTML = '<div class="pempty">2 letters daalo...</div>'; return; }
  if (isGuest || !currentUser) { res.innerHTML = '<div class="pempty">Login karo!</div>'; return; }
  res.innerHTML = '<div class="pempty">Searching...</div>';
  const s = await getDocs(collection(db, 'usernames'));
  res.innerHTML = '';
  let f = 0;
  for (const d of s.docs) {
    const n = d.id, data = d.data();
    if (n.includes(q.toLowerCase()) && data.uid !== currentUser.uid) {
      f++;
      const profile = await getUserProfile(data.uid);
      const r = document.createElement('div');
      r.className = 'userrow';
      r.onclick = () => startChat(data.uid, n);
      r.innerHTML = `
        <div class="avatar">
          ${profile.profilePic ? `<img src="${profile.profilePic}">` : n[0].toUpperCase()}
        </div>
        <div class="uname">${n}</div>
        <div class="uchat">💬 Chat</div>
      `;
      res.appendChild(r);
    }
  }
  if (f === 0) res.innerHTML = '<div class="pempty">Koi user nahi mila</div>';
};

window.startChat = async (uid, name) => {
  if (isGuest) return alert('Login karo!');
  const cid = [currentUser.uid, uid].sort().join('_');
  activeChatId = cid;
  activeChatUser = { uid, name };
  $('mName').textContent = name;
  
  const myProfile = await getUserProfile(currentUser.uid);
  const otherProfile = await getUserProfile(uid);
  
  $('mAvatar').innerHTML = otherProfile.profilePic
    ? `<img src="${otherProfile.profilePic}">`
    : name[0].toUpperCase();
  
  $('msgView').classList.add('on');
  const ref = doc(db, 'chats', cid);
  const snap = await getDoc(ref);
  
  if (!snap.exists()) {
    await setDoc(ref, {
      users: [currentUser.uid, uid],
      usernames: { [currentUser.uid]: currentUser.name, [uid]: name },
      profilePics: {
        [currentUser.uid]: myProfile.profilePic || '',
        [uid]: otherProfile.profilePic || ''
      },
      createdAt: Date.now(),
      lastMessage: 'Connected!',
      lastMessageTime: Date.now(),
      lastSender: 'system'
    });
  } else {
    const existing = snap.data();
    const pics = existing.profilePics || {};
    pics[currentUser.uid] = myProfile.profilePic || '';
    pics[uid] = otherProfile.profilePic || '';
    await setDoc(ref, { profilePics: pics }, { merge: true });
  }
  
  closeChat();
  knownMsgIds = new Set();
  loadMsgs(cid);
};

function loadMsgs(cid) {
  if (unsubMsgs) unsubMsgs();
  const body = $('msgBody');
  body.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.4);padding:20px;font-size:12px;">Loading...</div>';
  const q = query(collection(db, 'chats', cid, 'messages'), orderBy('createdAt', 'asc'), limit(200));
  unsubMsgs = onSnapshot(q, snap => {
    body.innerHTML = '';
    if (snap.empty) { body.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.4);padding:20px;font-size:12px;">Abhi koi message nahi</div>'; return; }
    snap.forEach(d => {
      const m = d.data(), mid = d.id, me = m.from === currentUser.uid;
      const row = document.createElement('div');
      row.className = 'msg-row ' + (me ? 'me' : 'you');
      if (me) {
        const btn = document.createElement('button');
        btn.className = 'msg-action';
        btn.innerHTML = '⋯';
        btn.onclick = e => { e.stopPropagation(); openMsgMenu(mid, m.text || ''); };
        row.appendChild(btn);
      }
      const div = document.createElement('div');
      div.className = 'msg ' + (me ? 'me' : 'you');
      const time = m.createdAt ? new Date(m.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      let h = '';
      if (m.imageUrl) h += `<img src="${m.imageUrl}" onclick="event.stopPropagation();window.open('${m.imageUrl}','_blank')">`;
      if (m.text) h += `<span>${esc(m.text)}</span>`;
      h += `<span class="mtime">${m.edited ? '<span class="medit">edited</span>' : ''}${time}</span>`;
      div.innerHTML = h;
      row.appendChild(div);
      body.appendChild(row);
    });
    body.scrollTop = body.scrollHeight;
  });
}

window.sendMsg = async () => {
  if (isGuest) return alert('Login karo!');
  const inp = $('msgIn'), t = inp.value.trim();
  if (!t || !activeChatId) return;
  inp.value = '';
  try {
    await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
      text: t, from: currentUser.uid, fromName: currentUser.name, createdAt: serverTimestamp()
    });
    const myProfile = await getUserProfile(currentUser.uid);
    const chatRef = doc(db, 'chats', activeChatId);
    const chatSnap = await getDoc(chatRef);
    const existingPics = chatSnap.exists() ? (chatSnap.data().profilePics || {}) : {};
    existingPics[currentUser.uid] = myProfile.profilePic || '';
    await setDoc(chatRef, {
      lastMessage: t,
      lastMessageTime: Date.now(),
      lastSender: currentUser.uid,
      lastSenderName: currentUser.name,
      profilePics: existingPics
    }, { merge: true });
  } catch (err) { alert('Message fail: ' + err.message); }
};

$('chatImgIn').onchange = async e => {
  const f = e.target.files[0]; if (!f || !activeChatId) return;
  if (isGuest) return alert('Login karo!');
  const inp = $('msgIn');
  inp.placeholder = 'Uploading...'; inp.disabled = true;
  try {
    const fd = new FormData();
    fd.append('file', f); fd.append('username', currentUser.name); fd.append('uid', currentUser.uid);
    const r = await fetch(`${WORKER_URL}/upload`, { method: 'POST', body: fd });
    const d = await r.json();
    if (d.id) {
      await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
        text: '', imageUrl: `${WORKER_URL}/image/${d.id}`, from: currentUser.uid, fromName: currentUser.name, createdAt: serverTimestamp()
      });
      const myProfile = await getUserProfile(currentUser.uid);
      const chatRef = doc(db, 'chats', activeChatId);
      const chatSnap = await getDoc(chatRef);
      const existingPics = chatSnap.exists() ? (chatSnap.data().profilePics || {}) : {};
      existingPics[currentUser.uid] = myProfile.profilePic || '';
      await setDoc(chatRef, {
        lastMessage: '📷 Photo',
        lastMessageTime: Date.now(),
        lastSender: currentUser.uid,
        lastSenderName: currentUser.name,
        profilePics: existingPics
      }, { merge: true });
    }
  } catch (er) { alert('Error: ' + er.message); }
  inp.placeholder = 'Message...'; inp.disabled = false;
  $('chatImgIn').value = '';
};

function openMsgMenu(mid, txt) {
  selectedMsgId = mid; selectedMsgText = txt;
  $('msgMenu').classList.add('on');
  $('editOpt').style.display = txt ? 'flex' : 'none';
}
window.closeMsgMenu = () => $('msgMenu').classList.remove('on');

window.editMsg = async () => {
  if (!selectedMsgId) return;
  $('msgMenu').classList.remove('on');
  const n = prompt('Edit:', selectedMsgText);
  if (!n || !n.trim()) return;
  await updateDoc(doc(db, 'chats', activeChatId, 'messages', selectedMsgId), { text: n.trim(), edited: true });
  await setDoc(doc(db, 'chats', activeChatId), { lastMessage: n.trim(), lastMessageTime: Date.now() }, { merge: true });
};

window.deleteMsg = async () => {
  if (!selectedMsgId) return;
  $('msgMenu').classList.remove('on');
  if (!confirm('Delete?')) return;
  await deleteDoc(doc(db, 'chats', activeChatId, 'messages', selectedMsgId));
};

window.handleBackdrop = () => {
  if ($('msgMenu').classList.contains('on')) closeMsgMenu();
  else if ($('chatPanel').classList.contains('on')) closeChat();
};

window.closeMsg = () => {
  $('msgView').classList.remove('on');
  if (unsubMsgs) unsubMsgs();
  activeChatId = null;
};

// ===== CHAT LIST =====
function loadChats() {
  if (unsubChats) unsubChats();
  const list = $('chatsList');
  const q = query(collection(db, 'chats'), where('users', 'array-contains', currentUser.uid));
  unsubChats = onSnapshot(q, snap => {
    list.innerHTML = '';
    if (snap.empty) {
      list.innerHTML = '<div class="pempty">Abhi koi chat nahi.<br>Search se kisi ko dhoondo!</div>';
      return;
    }
    const arr = [];
    snap.forEach(d => {
      const data = d.data();
      if (data.users && data.users.includes(currentUser.uid)) arr.push({ id: d.id, ...data });
    });
    arr.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
    arr.forEach(c => {
      const ou = c.users.find(u => u !== currentUser.uid);
      const on = c.usernames && c.usernames[ou] ? c.usernames[ou] : 'User';
      const oPic = c.profilePics && c.profilePics[ou] ? c.profilePics[ou] : '';
      const isUnread = c.lastSender && c.lastSender !== currentUser.uid && c.lastSender !== 'system';
      const r = document.createElement('div');
      r.className = 'chatrow';
      r.onclick = () => startChat(ou, on);
      r.innerHTML = `
        <div class="avatar">${oPic ? `<img src="${oPic}">` : on[0].toUpperCase()}</div>
        <div class="cinfo">
          <div class="cname">${esc(on)}</div>
          <div class="cmsg" style="${isUnread ? 'color:#00ffaa;font-weight:600;' : ''}">${esc(c.lastMessage || 'Chat shuru karo...')}</div>
        </div>
        ${isUnread ? '<div style="width:8px;height:8px;background:#00ffaa;border-radius:50%;flex-shrink:0;"></div>' : ''}
      `;
      list.appendChild(r);
    });
  }, error => {
    console.error('Chat list error:', error);
    list.innerHTML = '<div class="pempty">Error: ' + error.message + '</div>';
  });
}

// ===== NOTIFICATION =====
function startNotif() {
  if (unsubNotif) unsubNotif();
  const q = query(collection(db, 'chats'), where('users', 'array-contains', currentUser.uid));
  unsubNotif = onSnapshot(q, snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type === 'modified') {
        const c = ch.doc.data();
        const chatId = ch.doc.id;
        if (chatId !== activeChatId && c.lastSender && c.lastSender !== currentUser.uid && c.lastSender !== 'system' && c.lastMessage) {
          const ou = c.users.find(u => u !== currentUser.uid);
          const on = c.usernames && c.usernames[ou] ? c.usernames[ou] : 'User';
          const oPic = c.profilePics && c.profilePics[ou] ? c.profilePics[ou] : '';
          showToast(on, c.lastMessage, oPic);
          $('chatDot').classList.add('on');
          $('navChatDot').classList.add('on');
        }
      }
    });
  });
}

function showToast(name, msg, pic) {
  $('toastAvatar').innerHTML = pic
    ? `<img src="${pic}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
    : name[0].toUpperCase();
  $('toastName').textContent = name;
  $('toastMsg').textContent = msg;
  $('toast').classList.add('on');
  setTimeout(() => $('toast').classList.remove('on'), 3500);
}

function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

// ===== PROFILE =====
window.openProfile = async () => {
  if (!currentUser || isGuest) { $('loginScreen').classList.remove('hide'); return; }
  try {
    $('profileName').textContent = currentUser.name;
    $('profileEmail').textContent = currentUser.email || '';
    $('profilePic').innerHTML = `<span id="profilePicText">${currentUser.name[0].toUpperCase()}</span>`;
    try {
      const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
      if (userDoc.exists() && userDoc.data().profilePic) {
        $('profilePic').innerHTML = `<img src="${userDoc.data().profilePic}">`;
      }
    } catch (e) {}
    const myPosts = allImages.filter(im => im.uid === currentUser.uid);
    $('statPosts').textContent = myPosts.length;
    try {
      const cq = query(collection(db, 'chats'), where('users', 'array-contains', currentUser.uid));
      const cs = await getDocs(cq);
      $('statChats').textContent = cs.size;
    } catch (e) { $('statChats').textContent = '0'; }
    const grid = $('profileGrid');
    grid.innerHTML = '';
    if (myPosts.length === 0) {
      grid.innerHTML = '<div style="color:rgba(255,255,255,0.4);font-size:12px;text-align:center;padding:20px;grid-column:1/-1;">Abhi koi post nahi</div>';
    } else {
      myPosts.forEach(im => {
        const img = document.createElement('img');
        img.src = `${WORKER_URL}/image/${im.id}`;
        img.onclick = () => { closeProfile(); openPostView(im); };
        grid.appendChild(img);
      });
    }
    $('profileView').classList.add('on');
  } catch (err) {
    alert('Profile load fail: ' + err.message);
  }
};

window.closeProfile = () => $('profileView').classList.remove('on');

window.changeUsername = async () => {
  const n = prompt('Naya username:', currentUser.name);
  if (!n) return;
  const c = n.trim().toLowerCase();
  if (c.length < 3 || !/^[a-z0-9_]+$/.test(c)) return alert('Invalid!');
  if (c === currentUser.name) return;
  const s = await getDoc(doc(db, 'usernames', c));
  if (s.exists()) return alert('Already taken!');
  await deleteDoc(doc(db, 'usernames', currentUser.name));
  await setDoc(doc(db, 'usernames', c), { uid: currentUser.uid, email: currentUser.email, createdAt: Date.now() });
  await setDoc(doc(db, 'users', currentUser.uid), { username: c }, { merge: true });
  await updateProfile(auth.currentUser, { displayName: c });
  currentUser.name = c;
  userCache[currentUser.uid] = { username: c, profilePic: userCache[currentUser.uid]?.profilePic || '' };
  $('profileName').textContent = c;
  alert('Done! ✅');
};

window.changeProfilePic = () => $('profilePicIn').click();

$('profilePicIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData();
  fd.append('file', f); fd.append('username', currentUser.name); fd.append('uid', 'profile_' + currentUser.uid);
  try {
    const r = await fetch(`${WORKER_URL}/upload`, { method: 'POST', body: fd });
    const d = await r.json();
    if (d.id) {
      const url = `${WORKER_URL}/image/${d.id}`;
      await setDoc(doc(db, 'users', currentUser.uid), { profilePic: url }, { merge: true });
      userCache[currentUser.uid] = { username: currentUser.name, profilePic: url };
      $('profilePic').innerHTML = `<img src="${url}">`;
      alert('Profile pic updated! ✅');
    }
  } catch (er) { alert('Error: ' + er.message); }
  $('profilePicIn').value = '';
};

// ===== AUTH STATE =====
onAuthStateChanged(auth, async u => {
  if (u) {
    isGuest = false;
    let name = u.displayName;
    if (!name) {
      const s = await getDocs(collection(db, 'usernames'));
      s.forEach(d => { if (d.data().uid === u.uid) name = d.id; });
      if (!name) name = u.email.split('@')[0];
      await updateProfile(u, { displayName: name });
    }
    currentUser = { uid: u.uid, email: u.email, name };
    $('loginScreen').classList.add('hide');
    $('app').classList.add('on');
    loadImages();
    loadChats();
    startNotif();
  } else if (!isGuest) {
    currentUser = null;
    $('loginScreen').classList.remove('hide');
    $('app').classList.remove('on');
  }
});
</script>
