<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISHNTTCHAT — Share. Chat. Connect.</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #0f0f0f; color: #fff; min-height: 100vh; }

/* ===== LOGIN ===== */
.login-screen { position: fixed; inset: 0; background: #0f0f0f; z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
.login-screen.hidden { display: none; }
.login-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 380px; }
.login-box h1 { font-size: 26px; margin-bottom: 6px; letter-spacing: 1px; }
.login-box h1 span { color: #00ffaa; }
.login-box p { font-size: 13px; color: #888; margin-bottom: 20px; }
.login-box input { width: 100%; background: #0f0f0f; border: 1px solid #333; color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 14px; outline: none; margin-bottom: 10px; }
.login-box input:focus { border-color: #00ffaa; }
.login-btn { width: 100%; background: #00ffaa; color: #000; border: none; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; margin-bottom: 8px; }
.google-btn { width: 100%; background: #fff; color: #000; border: none; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.skip-btn { width: 100%; background: transparent; color: #888; border: 1px solid #333; padding: 11px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.error-msg { color: #ff4466; font-size: 12px; margin-bottom: 10px; display: none; padding: 8px; background: rgba(255,68,102,0.1); border-radius: 8px; }
.success-msg { color: #00ffaa; font-size: 12px; margin-bottom: 10px; display: none; padding: 8px; background: rgba(0,255,170,0.1); border-radius: 8px; }

/* ===== HEADER ===== */
header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #1f1f1f; position: sticky; top: 0; background: rgba(15,15,15,0.95); backdrop-filter: blur(10px); z-index: 50; }
.logo { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
.logo span { color: #00ffaa; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.user-badge { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 8px 14px; border-radius: 20px; font-size: 13px; color: #00ffaa; font-weight: 600; cursor: pointer; }
.user-badge.guest { color: #888; }
.logout-btn { background: #ff3355; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
.icon-btn-header { background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
.icon-btn-header:hover { color: #00ffaa; }
.upload-btn { background: #00ffaa; color: #000; padding: 10px 18px; border-radius: 25px; font-weight: 700; cursor: pointer; border: none; font-size: 14px; }
#fileInput { display: none; }

/* ===== GALLERY ===== */
.container { max-width: 1100px; margin: 0 auto; padding: 20px; }
.empty { text-align: center; padding: 80px 20px; color: #666; }
.empty h3 { font-size: 18px; color: #888; margin-bottom: 6px; }
.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 640px) { .gallery { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .gallery { grid-template-columns: repeat(4, 1fr); } }
.card { background: #1a1a1a; border-radius: 12px; border: 1px solid #2a2a2a; overflow: hidden; }
.card-img-wrap { position: relative; }
.card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
.card-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #00ffaa; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
.card-body { padding: 10px; }
.uploader { font-size: 12px; color: #00ffaa; font-weight: 600; margin-bottom: 6px; }
.caption { font-size: 12px; color: #ccc; margin-bottom: 8px; }
.actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.action-btns { display: flex; gap: 6px; }
.icon-btn { background: #252525; border: 1px solid #333; color: #ccc; width: 28px; height: 28px; border-radius: 50%; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.icon-btn.del { color: #ff5577; }
.comment-count { color: #888; font-size: 12px; }
.comments { max-height: 100px; overflow-y: auto; margin-top: 6px; }
.comment { background: #252525; padding: 5px 8px; border-radius: 8px; font-size: 11px; margin-bottom: 4px; color: #ccc; }
.comment b { color: #00ffaa; }
.comment-input { display: flex; gap: 4px; margin-top: 6px; }
.comment-input input { flex: 1; background: #252525; border: 1px solid #333; color: #fff; padding: 6px 10px; border-radius: 15px; font-size: 12px; outline: none; }
.comment-input button { background: #00ffaa; color: #000; border: none; padding: 6px 12px; border-radius: 15px; font-size: 11px; font-weight: 700; cursor: pointer; }
.comment-input input:disabled, .comment-input button:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== CHAT PANEL ===== */
.chat-panel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 420px; height: 100vh; background: #0f0f0f; border-left: 1px solid #1f1f1f; z-index: 200; transition: right 0.3s ease; display: flex; flex-direction: column; }
.chat-panel.open { right: 0; }
.chat-header { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid #1f1f1f; }
.chat-header .back { background: #1a1a1a; border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; }
.chat-header h2 { font-size: 18px; font-weight: 700; }
.chat-tabs { display: flex; background: #0f0f0f; border-bottom: 1px solid #1f1f1f; }
.chat-tab { flex: 1; padding: 12px; text-align: center; color: #888; font-weight: 700; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
.chat-tab.active { color: #00ffaa; border-bottom-color: #00ffaa; }
.chat-list { flex: 1; overflow-y: auto; }
.chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #1a1a1a; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #00ffaa, #00ccff); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #000; font-size: 16px; flex-shrink: 0; }
.chat-item .info { flex: 1; min-width: 0; }
.chat-item .name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.chat-item .msg { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-chats { text-align: center; padding: 40px 20px; color: #555; font-size: 13px; line-height: 1.6; }
.search-bar { padding: 12px 16px; border-bottom: 1px solid #1f1f1f; }
.search-bar input { width: 100%; background: #141414; border: 1px solid #262626; color: #fff; padding: 11px 16px; border-radius: 22px; font-size: 13px; outline: none; }
.search-bar input:focus { border-color: #00ffaa; }
.user-result { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #1a1a1a; }
.user-result:hover { background: #141414; }
.user-result .info { flex: 1; }
.user-result .name { font-size: 15px; font-weight: 700; }
.user-result .action { color: #00ffaa; font-size: 12px; font-weight: 700; }

/* ===== MESSAGE VIEW ===== */
.message-view { position: fixed; inset: 0; background: #0a0a0a; z-index: 300; display: none; flex-direction: column; }
.message-view.active { display: flex; }
.msg-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #1f1f1f; background: #0f0f0f; }
.msg-header .back { background: #1a1a1a; border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; }
.msg-header .avatar { width: 40px; height: 40px; font-size: 16px; }
.msg-header .name { font-size: 15px; font-weight: 700; }
.msg-header .status { font-size: 11px; color: #00ffaa; }
.msg-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-break: break-word; }
.msg.sent { background: linear-gradient(135deg, #00ffaa, #00cc66); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.received { background: #1c1c1c; color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
.msg .time { font-size: 10px; opacity: 0.6; margin-top: 4px; display: block; text-align: right; }
.msg-input { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #1f1f1f; background: #0f0f0f; }
.msg-input input { flex: 1; background: #1c1c1c; border: 1px solid #262626; color: #fff; padding: 12px 16px; border-radius: 24px; font-size: 14px; outline: none; }
.msg-input button { background: #00ffaa; color: #000; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; font-weight: 700; }

.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; }
.backdrop.active { display: block; }

@media (max-width: 640px) { .chat-panel { max-width: 100%; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>ISHNTT<span>CHAT</span></h1>
    <p>Share. Chat. Connect.</p>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- Mode Tabs -->
    <div style="display:flex;gap:4px;margin-bottom:16px;background:#0f0f0f;padding:4px;border-radius:10px;">
      <button id="loginTabBtn" onclick="setMode(true)" style="flex:1;padding:9px;border:none;background:#00ffaa;color:#000;font-weight:700;font-size:13px;border-radius:7px;cursor:pointer;">Login</button>
      <button id="signupTabBtn" onclick="setMode(false)" style="flex:1;padding:9px;border:none;background:transparent;color:#888;font-weight:700;font-size:13px;border-radius:7px;cursor:pointer;">Sign Up</button>
    </div>

    <input type="text" id="usernameInput" placeholder="Username (unique)" style="display:none;">
    <input type="email" id="emailInput" placeholder="Email address">
    <input type="password" id="passwordInput" placeholder="Password (min 6 chars)">

    <button class="login-btn" id="authBtn" onclick="handleAuth()">Login</button>

    <button class="google-btn" onclick="googleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="G">
      Continue with Google
    </button>

    <button class="skip-btn" onclick="skipLogin()">Skip for now →</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">ISHNTT<span>CHAT</span></div>
  <div class="header-actions">
    <span class="limit-warn" id="limitWarn" style="color:#ffaa00;font-size:11px;font-weight:600;"></span>
    <span class="user-badge" id="userBadge">👤 Guest</span>
    <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
    <button class="icon-btn-header" onclick="openChat()" style="position:relative;">💬</button>
    <button class="upload-btn" onclick="handleUploadClick()">+ Post</button>
  </div>
  <input type="file" id="fileInput" accept="image/*">
</header>

<!-- GALLERY -->
<div class="container">
  <div id="loading" style="display:none;text-align:center;padding:20px;color:#00ffaa;">⏳ Uploading...</div>
  <div id="emptyMsg" class="empty">
    <h3>Abhi koi image nahi hai</h3>
    <p>"+ Post" dabao aur apni pehli image upload karo!</p>
  </div>
  <div class="gallery" id="gallery"></div>
</div>

<!-- CHAT PANEL -->
<div class="backdrop" id="backdrop" onclick="closeChat()"></div>
<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <button class="back" onclick="closeChat()">←</button>
    <h2>Chats</h2>
  </div>
  <div class="chat-tabs">
    <div class="chat-tab active" onclick="switchChatTab('chats')">💬 Chats</div>
    <div class="chat-tab" onclick="switchChatTab('search')">🔍 Search</div>
  </div>
  <div class="chat-list" id="chatsList">
    <div class="empty-chats">Abhi koi chat nahi.<br>Search tab se kisi ko dhoondo!</div>
  </div>
  <div class="chat-list" id="searchList" style="display:none;">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Username search karo..." oninput="searchUsers(this.value)">
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<!-- MESSAGE VIEW -->
<div class="message-view" id="messageView">
  <div class="msg-header">
    <button class="back" onclick="closeMessage()">←</button>
    <div class="avatar" id="msgAvatar">U</div>
    <div>
      <div class="name" id="msgName">User</div>
      <div class="status">online</div>
    </div>
  </div>
  <div class="msg-body" id="msgBody"></div>
  <div class="msg-input">
    <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJkg8OOu3szJmBnvbbND6BJYT_9aQVExg",
  authDomain: "ishntt-f8b74.firebaseapp.com",
  projectId: "ishntt-f8b74",
  storageBucket: "ishntt-f8b74.firebasestorage.app",
  messagingSenderId: "1002308007099",
  appId: "1:1002308007099:web:ed0f89596a74f522bba59e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

const WORKER_URL = "https://ishntbot.ishantgiri2004g.workers.dev";
const fileInput = document.getElementById('fileInput');
const gallery = document.getElementById('gallery');
const emptyMsg = document.getElementById('emptyMsg');
const loginScreen = document.getElementById('loginScreen');
const userBadge = document.getElementById('userBadge');
const logoutBtn = document.getElementById('logoutBtn');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');
const limitWarn = document.getElementById('limitWarn');
const usernameInput = document.getElementById('usernameInput');

let currentUser = null;
let isGuest = false;
let isLoginMode = true;
let activeChatId = null;
let unsubscribeMessages = null;
let unsubscribeChats = null;
const GUEST_LIMIT = 10;

function getGuestCount() { return parseInt(localStorage.getItem('ishntt_guest_uploads') || '0'); }
function incGuestCount() { localStorage.setItem('ishntt_guest_uploads', getGuestCount() + 1); updateLimit(); }
function updateLimit() {
  if (currentUser && !isGuest) { limitWarn.textContent = ''; return; }
  const used = getGuestCount();
  limitWarn.textContent = used >= GUEST_LIMIT ? '⚠️ Limit khatam' : `Guest: ${used}/${GUEST_LIMIT}`;
}

// ===== AUTH =====
window.setMode = function(loginMode) {
  isLoginMode = loginMode;
  document.getElementById('loginTabBtn').style.background = loginMode ? '#00ffaa' : 'transparent';
  document.getElementById('loginTabBtn').style.color = loginMode ? '#000' : '#888';
  document.getElementById('signupTabBtn').style.background = loginMode ? 'transparent' : '#00ffaa';
  document.getElementById('signupTabBtn').style.color = loginMode ? '#888' : '#000';
  document.getElementById('authBtn').textContent = loginMode ? 'Login' : 'Sign Up';
  usernameInput.style.display = loginMode ? 'none' : 'block';
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
};

window.handleAuth = async function() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const username = usernameInput.value.trim().toLowerCase();
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';

  if (!email || !password) { showError('Email aur password dono daalo!'); return; }
  if (password.length < 6) { showError('Password kam se kam 6 characters!'); return; }

  if (!isLoginMode) {
    if (!username) { showError('Username daalo!'); return; }
    if (username.length < 3) { showError('Username kam se kam 3 characters!'); return; }
    if (!/^[a-z0-9_]+$/.test(username)) { showError('Sirf small letters, numbers, _ allowed!'); return; }
    try {
      const snap = await getDoc(doc(db, 'usernames', username));
      if (snap.exists()) { showError('Ye username already le liya gaya hai!'); return; }
    } catch (e) { showError('Check fail: ' + e.message); return; }
  }

  try {
    if (isLoginMode) {
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, 'usernames', username), {
        uid: cred.user.uid, email: cred.user.email, createdAt: Date.now()
      });
      await updateProfile(cred.user, { displayName: username });
    }
  } catch (err) { showError(err.message.replace('Firebase: ', '')); }
};

window.googleLogin = async function() {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    const user = result.user;
    // Google user ka username auto-generate
    let baseUsername = (user.displayName || user.email.split('@')[0]).toLowerCase().replace(/[^a-z0-9_]/g, '');
    let snap = await getDoc(doc(db, 'usernames', baseUsername));
    if (snap.exists() && snap.data().uid !== user.uid) {
      // Username taken, unique banao
      baseUsername = baseUsername + '_' + Math.floor(Math.random() * 9999);
      snap = await getDoc(doc(db, 'usernames', baseUsername));
    }
    if (!snap.exists()) {
      await setDoc(doc(db, 'usernames', baseUsername), { uid: user.uid, email: user.email, createdAt: Date.now() });
      await updateProfile(user, { displayName: baseUsername });
    } else if (snap.data().uid === user.uid) {
      // Already exists, uska display name set karo
      await updateProfile(user, { displayName: baseUsername });
    }
  } catch (err) { showError(err.message); }
};

window.skipLogin = function() {
  isGuest = true;
  currentUser = { uid: 'guest_' + Date.now(), email: '', name: 'Guest' };
  userBadge.textContent = '👤 Guest';
  userBadge.classList.add('guest');
  loginScreen.classList.add('hidden');
  updateLimit();
  loadAllImages();
};

window.logout = async function() { await signOut(auth); isGuest = false; };

window.handleBadgeClick = function() {
  if (isGuest || !currentUser) loginScreen.classList.remove('hidden');
  else changeUsername();
};

window.changeUsername = async function() {
  const newU = prompt('Naya username:', currentUser.name);
  if (!newU) return;
  const clean = newU.trim().toLowerCase();
  if (clean.length < 3 || !/^[a-z0-9_]+$/.test(clean)) { alert('Invalid!'); return; }
  if (clean === currentUser.name) return;
  try {
    const snap = await getDoc(doc(db, 'usernames', clean));
    if (snap.exists()) { alert('Ye username already le liya gaya hai!'); return; }
    await setDoc(doc(db, 'usernames', clean), { uid: currentUser.uid, email: currentUser.email, createdAt: Date.now() });
    await updateProfile(auth.currentUser, { displayName: clean });
    currentUser.name = clean;
    userBadge.textContent = '👤 ' + clean;
    alert('Username change! ✅');
  } catch (e) { alert('Fail: ' + e.message); }
};

function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; }

// ===== UPLOAD =====
window.handleUploadClick = function() {
  if (isGuest && getGuestCount() >= GUEST_LIMIT) { alert('Limit khatam! Login karo!'); loginScreen.classList.remove('hidden'); return; }
  fileInput.click();
};
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (isGuest && getGuestCount() >= GUEST_LIMIT) { alert('Limit khatam!'); return; }
  document.getElementById('loading').style.display = 'block';
  emptyMsg.style.display = 'none';
  const fd = new FormData();
  fd.append('file', file);
  fd.append('username', currentUser && !isGuest ? currentUser.name : 'Guest');
  fd.append('uid', currentUser && !isGuest ? currentUser.uid : 'guest_' + Date.now());
  try {
    const res = await fetch(`${WORKER_URL}/upload`, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.id) { if (isGuest) incGuestCount(); setTimeout(loadAllImages, 800); }
    else alert('Upload fail');
  } catch (err) { alert('Error: ' + err.message); }
  finally { document.getElementById('loading').style.display = 'none'; fileInput.value = ''; }
});

// ===== GALLERY =====
async function loadAllImages() {
  try {
    const res = await fetch(`${WORKER_URL}/list`);
    const data = await res.json();
    gallery.innerHTML = '';
    if (data.images && data.images.length > 0) {
      emptyMsg.style.display = 'none';
      data.images.forEach(img => renderCard(img));
    } else emptyMsg.style.display = 'block';
  } catch (err) {}
}
function renderCard(img) {
  const isOwner = currentUser && !isGuest && img.uid === currentUser.uid;
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card_' + img.id;
  let actionsHTML = '';
  if (isOwner) actionsHTML = `<div class="action-btns"><button class="icon-btn" onclick="editCaption('${img.id}')">✏️</button><button class="icon-btn del" onclick="deleteImage('${img.id}')">🗑</button></div>`;
  const canComment = currentUser && !isGuest;
  card.innerHTML = `
    <div class="card-img-wrap">
      <img src="${WORKER_URL}/image/${img.id}" loading="lazy">
      ${isOwner ? '<span class="card-badge">Yours</span>' : ''}
    </div>
    <div class="card-body">
      <div class="uploader">📷 ${escapeHtml(img.username || 'Unknown')}</div>
      <div class="caption" id="caption_${img.id}">${escapeHtml(img.caption || '')}</div>
      <div class="actions">${actionsHTML}<span class="comment-count">💬 ${img.comments.length}</span></div>
      <div class="comments" id="comments_${img.id}">${img.comments.map(c => `<div class="comment"><b>${escapeHtml(c.username || 'Anon')}:</b> ${escapeHtml(c.text)}</div>`).join('')}</div>
      <div class="comment-input">
        <input type="text" id="input_${img.id}" placeholder="${canComment ? 'Comment...' : 'Login to comment'}" ${canComment ? '' : 'disabled'}>
        <button onclick="addComment('${img.id}')" ${canComment ? '' : 'disabled'}>Post</button>
      </div>
    </div>`;
  gallery.appendChild(card);
}
window.deleteImage = async function(id) {
  if (!confirm('Delete?')) return;
  await fetch(`${WORKER_URL}/delete/${id}`, { method: 'DELETE' });
  document.getElementById('card_' + id).remove();
};
window.editCaption = async function(id) {
  const el = document.getElementById('caption_' + id);
  const nc = prompt('Naya caption:', el.textContent);
  if (nc === null) return;
  await fetch(`${WORKER_URL}/edit/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caption: nc }) });
  el.textContent = nc;
};
window.addComment = async function(id) {
  if (!currentUser || isGuest) { loginScreen.classList.remove('hidden'); return; }
  const input = document.getElementById('input_' + id);
  const text = input.value.trim();
  if (!text) return;
  const res = await fetch(`${WORKER_URL}/comment/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, username: currentUser.name }) });
  const data = await res.json();
  if (data.success) {
    input.value = '';
    const cDiv = document.getElementById('comments_' + id);
    const div = document.createElement('div');
    div.className = 'comment';
    div.innerHTML = `<b>${escapeHtml(currentUser.name)}:</b> ${escapeHtml(text)}`;
    cDiv.appendChild(div);
    document.querySelector(`#card_${id} .comment-count`).textContent = '💬 ' + data.comments.length;
  }
};

// ===== CHAT =====
window.openChat = function() {
  document.getElementById('chatPanel').classList.add('open');
  document.getElementById('backdrop').classList.add('active');
  if (currentUser && !isGuest) loadChats();
  else document.getElementById('chatsList').innerHTML = '<div class="empty-chats">Login karo chat ke liye!</div>';
};
window.closeChat = function() {
  document.getElementById('chatPanel').classList.remove('open');
  document.getElementById('backdrop').classList.remove('active');
};
window.switchChatTab = function(tab) {
  document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  if (tab === 'chats') { document.getElementById('chatsList').style.display = 'block'; document.getElementById('searchList').style.display = 'none'; }
  else { document.getElementById('chatsList').style.display = 'none'; document.getElementById('searchList').style.display = 'block'; }
};

window.searchUsers = async function(q_) {
  const results = document.getElementById('searchResults');
  if (q_.length < 2) { results.innerHTML = '<div class="empty-chats">Kam se kam 2 letters daalo...</div>'; return; }
  if (isGuest || !currentUser) { results.innerHTML = '<div class="empty-chats">User search ke liye login karo!</div>'; return; }

  results.innerHTML = '<div class="empty-chats">Searching...</div>';
  try {
    const snap = await getDocs(collection(db, 'usernames'));
    results.innerHTML = '';
    let found = 0;
    snap.forEach(d => {
      const name = d.id, data = d.data();
      if (name.includes(q_.toLowerCase()) && data.uid !== currentUser.uid) {
        found++;
        const div = document.createElement('div');
        div.className = 'user-result';
        div.onclick = () => startChat(data.uid, name);
        div.innerHTML = `<div class="avatar">${name[0].toUpperCase()}</div><div class="info"><div class="name">${name}</div><div class="action">💬 Chat karo</div></div>`;
        results.appendChild(div);
      }
    });
    if (found === 0) results.innerHTML = '<div class="empty-chats">Koi user nahi mila</div>';
  } catch (err) { results.innerHTML = '<div class="empty-chats">Error: ' + err.message + '</div>'; }
};

window.startChat = async function(otherUid, otherName) {
  if (isGuest) { alert('Chat ke liye login karo!'); return; }
  const chatId = [currentUser.uid, otherUid].sort().join('_');
  activeChatId = chatId;
  document.getElementById('msgName').textContent = otherName;
  document.getElementById('msgAvatar').textContent = otherName[0].toUpperCase();
  document.getElementById('messageView').classList.add('active');
  const chatRef = doc(db, 'chats', chatId);
  const chatSnap = await getDoc(chatRef);
  if (!chatSnap.exists()) {
    await setDoc(chatRef, {
      users: [currentUser.uid, otherUid],
      usernames: { [currentUser.uid]: currentUser.name, [otherUid]: otherName },
      createdAt: Date.now(),
      lastMessage: 'Chat connected!',
      lastMessageTime: Date.now()
    });
  }
  closeChat();
  loadMessages(chatId);
};

function loadMessages(chatId) {
  if (unsubscribeMessages) unsubscribeMessages();
  const msgBody = document.getElementById('msgBody');
  msgBody.innerHTML = '<div style="text-align:center;color:#555;padding:20px;">Loading...</div>';
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt', 'asc'), limit(200));
  unsubscribeMessages = onSnapshot(q, (snapshot) => {
    msgBody.innerHTML = '';
    if (snapshot.empty) { msgBody.innerHTML = '<div style="text-align:center;color:#555;padding:20px;">Abhi koi message nahi. Pehla message bhejo!</div>'; return; }
    snapshot.forEach(d => {
      const msg = d.data();
      const isMe = msg.from === currentUser.uid;
      const div = document.createElement('div');
      div.className = 'msg ' + (isMe ? 'sent' : 'received');
      const time = msg.createdAt ? new Date(msg.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      div.innerHTML = `${escapeHtml(msg.text)}<span class="time">${time}</span>`;
      msgBody.appendChild(div);
    });
    msgBody.scrollTop = msgBody.scrollHeight;
  });
}

window.sendMessage = async function() {
  if (isGuest) { alert('Login karo!'); return; }
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !activeChatId) return;
  input.value = '';
  await addDoc(collection(db, 'chats', activeChatId, 'messages'), { text, from: currentUser.uid, fromName: currentUser.name, createdAt: serverTimestamp() });
  await setDoc(doc(db, 'chats', activeChatId), { lastMessage: text, lastMessageTime: Date.now() }, { merge: true });
};

function loadChats() {
  if (unsubscribeChats) unsubscribeChats();
  const chatsList = document.getElementById('chatsList');
  const q = query(collection(db, 'chats'), where('users', 'array-contains', currentUser.uid));
  unsubscribeChats = onSnapshot(q, (snapshot) => {
    chatsList.innerHTML = '';
    if (snapshot.empty) { chatsList.innerHTML = '<div class="empty-chats">Abhi koi chat nahi.<br>Search tab se kisi ko dhoondo!</div>'; return; }
    const chats = [];
    snapshot.forEach(d => chats.push({ id: d.id, ...d.data() }));
    chats.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
    chats.forEach(chat => {
      const otherUid = chat.users.find(u => u !== currentUser.uid);
      const otherName = chat.usernames ? chat.usernames[otherUid] : 'User';
      const div = document.createElement('div');
      div.className = 'chat-item';
      div.onclick = () => startChat(otherUid, otherName);
      const time = chat.lastMessageTime ? new Date(chat.lastMessageTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      div.innerHTML = `<div class="avatar">${otherName[0].toUpperCase()}</div><div class="info"><div class="name">${escapeHtml(otherName)}</div><div class="msg">${escapeHtml(chat.lastMessage || 'Chat shuru karo...')}</div></div><div class="time">${time}</div>`;
      chatsList.appendChild(div);
    });
  });
}

window.closeMessage = function() {
  document.getElementById('messageView').classList.remove('active');
  if (unsubscribeMessages) unsubscribeMessages();
  activeChatId = null;
};

function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text || ''; return d.innerHTML; }

// ===== AUTH STATE =====
onAuthStateChanged(auth, async (user) => {
  if (user) {
    isGuest = false;
    let name = user.displayName;
    // Agar displayName nahi hai (rare case), Firestore se dhoondo
    if (!name) {
      const snap = await getDocs(collection(db, 'usernames'));
      snap.forEach(d => { if (d.data().uid === user.uid) name = d.id; });
      if (!name) name = user.email.split('@')[0];
      await updateProfile(user, { displayName: name });
    }
    currentUser = { uid: user.uid, email: user.email, name };
    userBadge.textContent = '👤 ' + name;
    userBadge.classList.remove('guest');
    logoutBtn.style.display = 'inline-block';
    loginScreen.classList.add('hidden');
    updateLimit();
    loadAllImages();
  } else {
    if (!isGuest) {
      currentUser = null;
      userBadge.textContent = '👤 Guest';
      userBadge.classList.add('guest');
      logoutBtn.style.display = 'none';
      loginScreen.classList.remove('hidden');
      updateLimit();
    }
  }
});

userBadge.addEventListener('click', handleBadgeClick);
</script>
